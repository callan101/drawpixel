        // In the app, restore the saved file into localStorage before loading.
        // ---- Tile types & links (docs/map-links-spec.md) ----
        // Links live in world coordinates. An endpoint inside a lifted float is
        // stored float-relative ({x, y, f: true}) so it moves with the float.
        // Each link remembers its endpoint colors (fc / tc) so edits can be
        // detected and re-checked (spec §6.2).
        const LINK_HIT_PX = 22;
        const LINK_BAD = "#ff3b30";
        const MAP_VERSION = 1;
        const DEFAULT_LEGACY_CONFIG = {
          rules: [
            { hue: 150, type: "button" },
            { hue: 100, type: "door" },
          ],
          hueTolerance: 3,
          saturationTolerance: 2,
          minSaturation: 10,
          minBrightness: 10,
        };
        const mapStatus = document.getElementById("map-status");
        const linkActionBtn = document.getElementById("link-action");
        const copyMapBtn = document.getElementById("btn-copy-map");
        const downloadMapBtn = document.getElementById("btn-download-map");
        const cpTypeRow = document.getElementById("cp-type-row");
        const cpType = document.getElementById("cp-type");
        const cpRole = document.getElementById("cp-role");
        const legacyDialog = document.getElementById("legacy-dialog");
        const legacyConfigEl = document.getElementById("legacy-config");
        const legacySummaryEl = document.getElementById("legacy-summary");
        const legacyApplyBtn = document.getElementById("legacy-apply");

        const LINK_ROLES = ["source", "target", "both"];
        const canSource = (t) => !!t && (t.role === "source" || t.role === "both");
        const canTarget = (t) => !!t && (t.role === "target" || t.role === "both");
        const samePos = (a, b) => !!a && !!b && a.x === b.x && a.y === b.y;

        function tileTypeOf(color) {
          return color ? state.tileTypes[color] || null : null;
        }

        function isMapMode() {
          for (const _ in state.tileTypes) return true;
          return false;
        }

        // Color shown at a cell: the float on top, else the canvas.
        function colorAtCell(x, y) {
          const f = state.float;
          if (f && x >= f.x && y >= f.y && x < f.x + f.w && y < f.y + f.h) {
            const c = f.pixels.get(key(x - f.x, y - f.y));
            if (c) return c;
          }
          return pixels.get(key(x, y)) || null;
        }

        function endpointPos(ep) {
          if (!ep.f) return ep;
          return state.float ? { x: state.float.x + ep.x, y: state.float.y + ep.y } : null;
        }

        function linkIsValid(l) {
          const a = endpointPos(l.from);
          const b = endpointPos(l.to);
          if (!a || !b || samePos(a, b)) return false;
          return (
            canSource(tileTypeOf(colorAtCell(a.x, a.y))) &&
            canTarget(tileTypeOf(colorAtCell(b.x, b.y)))
          );
        }

        function cloneLinks(list) {
          return list.map((l) => {
            const c = { ...l, from: { ...l.from }, to: { ...l.to } };
            if (l.props) c.props = JSON.parse(JSON.stringify(l.props));
            return c;
          });
        }

        function findLink(a, b) {
          return state.links.find(
            (l) => samePos(endpointPos(l.from), a) && samePos(endpointPos(l.to), b)
          );
        }

        // §6.2: re-check links whose endpoint color changed since last check.
        function checkLinks() {
          if (!state.links.length) return;
          let removed = 0;
          state.links = state.links.filter((l) => {
            for (const end of ["from", "to"]) {
              const ep = l[end];
              if (ep.f) {
                if (state.float) continue; // re-checked after the float commits
                removed++;
                return false;
              }
              const rec = end === "from" ? "fc" : "tc";
              const c = pixels.get(key(ep.x, ep.y)) || null;
              if (c === l[rec]) continue;
              const t = tileTypeOf(c);
              if (end === "from" ? canSource(t) : canTarget(t)) {
                l[rec] = c;
                continue;
              }
              removed++;
              return false;
            }
            return true;
          });
          if (state.linkSelLink && !state.links.some((l) => l.id === state.linkSelLink)) {
            state.linkSelLink = null;
          }
          if (removed) {
            showToast("Removed " + removed + " link" + (removed === 1 ? "" : "s"), "Undo", undo);
            state.needsDraw = true;
          }
        }

        // Selection lifted into a float: its link endpoints ride along.
        function liftLinks(rect) {
          for (const l of state.links) {
            for (const ep of [l.from, l.to]) {
              if (ep.f || !pointInRect(ep, rect)) continue;
              if (!state.float.pixels.has(key(ep.x - rect.x, ep.y - rect.y))) continue;
              ep.x -= rect.x;
              ep.y -= rect.y;
              ep.f = true;
            }
          }
        }

        function landLinks() {
          if (!state.float) return;
          for (const l of state.links) {
            for (const ep of [l.from, l.to]) {
              if (!ep.f) continue;
              ep.x += state.float.x;
              ep.y += state.float.y;
              delete ep.f;
            }
          }
        }

        function serializeLinks() {
          const out = [];
          for (const l of state.links) {
            const a = endpointPos(l.from);
            const b = endpointPos(l.to);
            if (!a || !b) continue;
            const o = { id: l.id, from: { x: a.x, y: a.y }, to: { x: b.x, y: b.y }, fc: l.fc, tc: l.tc };
            if (l.props) o.props = l.props;
            out.push(o);
          }
          return out;
        }

        function deserializeLinks(list) {
          const out = [];
          if (!Array.isArray(list)) return out;
          const isPt = (p) => p && Number.isInteger(p.x) && Number.isInteger(p.y);
          for (const l of list) {
            if (!l || typeof l.id !== "string" || !isPt(l.from) || !isPt(l.to)) continue;
            const o = {
              id: l.id,
              from: { x: l.from.x, y: l.from.y },
              to: { x: l.to.x, y: l.to.y },
              fc: typeof l.fc === "string" ? l.fc : null,
              tc: typeof l.tc === "string" ? l.tc : null,
            };
            if (l.props && typeof l.props === "object") o.props = l.props;
            out.push(o);
          }
          return out;
        }

        function sanitizeTileTypes(obj) {
          const out = {};
          if (!obj || typeof obj !== "object") return out;
          const names = new Set();
          for (const [hex, t] of Object.entries(obj)) {
            const h = normalizeHex(hex);
            if (!/^#[0-9a-f]{6}$/.test(h) || !t || typeof t.type !== "string") continue;
            const name = t.type.trim();
            if (!name || names.has(name)) continue;
            names.add(name);
            out[h] = { type: name };
            if (LINK_ROLES.includes(t.role)) out[h].role = t.role;
          }
          return out;
        }

        function nextLinkIdFor(list, floor) {
          let n = Math.max(1, floor | 0);
          for (const l of list) {
            const m = /^l(\d+)$/.exec(l.id);
            if (m) n = Math.max(n, +m[1] + 1);
          }
          return n;
        }

        // ---- Status bar & toast ----
        let toastTimer = null;
        function showToast(text, actionLabel, action) {
          state.toast = { text, actionLabel: actionLabel || null, action: action || null };
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => {
            state.toast = null;
            updateMapStatus();
          }, actionLabel ? 6000 : 3500);
          updateMapStatus();
        }

        function mapOrigin() {
          const b = contentBounds();
          return b ? { x: b.x, y: b.y } : { x: 0, y: 0 };
        }

        function countUnknown() {
          let n = 0;
          for (const c of pixels.values()) if (!state.tileTypes[c]) n++;
          if (state.float) for (const c of state.float.pixels.values()) if (!state.tileTypes[c]) n++;
          return n;
        }

        function inspectCell() {
          if (state.tool !== "link") return null;
          if (state.hoverVisible) {
            const t = tileTypeOf(colorAtCell(state.hover.x, state.hover.y));
            if (canSource(t) || canTarget(t)) return state.hover;
          }
          return state.linkSel;
        }

        function linkInspectText() {
          const c = inspectCell();
          if (!c) return "";
          const t = tileTypeOf(colorAtCell(c.x, c.y));
          if (!t) return "";
          let outs = 0;
          let ins = 0;
          for (const l of state.links) {
            if (samePos(endpointPos(l.from), c)) outs++;
            if (samePos(endpointPos(l.to), c)) ins++;
          }
          const o = mapOrigin();
          let text = t.type + " (" + (c.x - o.x) + "," + (c.y - o.y) + ")";
          if (canSource(t)) text += " → " + outs + " target" + (outs === 1 ? "" : "s");
          if (canTarget(t)) text += " ← " + ins + " source" + (ins === 1 ? "" : "s");
          return text;
        }

        let statusKey = "";
        function updateMapStatus() {
          const parts = [];
          if (state.toast) {
            parts.push({ text: state.toast.text, btn: state.toast.actionLabel, act: "toast" });
          }
          const info = linkInspectText();
          if (info) parts.push({ text: info });
          if (isMapMode()) {
            const n = countUnknown();
            if (n) parts.push({ text: n + " unknown", tap: "unknown" });
          }
          const bad = state.links.filter((l) => !linkIsValid(l)).length;
          if (bad) {
            parts.push({ text: bad + " invalid link" + (bad === 1 ? "" : "s"), btn: "Remove", act: "invalid" });
          }
          if (state.legacyOffer) {
            parts.push({ text: "Legacy colors found", btn: "Convert links", act: "legacy" });
          }
          const k = JSON.stringify(parts);
          if (k === statusKey) return;
          statusKey = k;
          mapStatus.textContent = "";
          mapStatus.hidden = !parts.length;
          for (const part of parts) {
            const span = document.createElement("span");
            span.textContent = part.text;
            if (part.tap) {
              span.dataset.act = part.tap;
              span.className = "status-tap";
              span.title = "Show them";
            }
            mapStatus.appendChild(span);
            if (part.btn) {
              const b = document.createElement("button");
              b.type = "button";
              b.dataset.act = part.act;
              b.textContent = part.btn;
              mapStatus.appendChild(b);
            }
          }
        }

        mapStatus.addEventListener("click", (e) => {
          const b = e.target.closest("[data-act]");
          if (!b) return;
          if (b.dataset.act === "unknown") {
            // Flash every unknown pixel for a second.
            state.unknownFlashUntil = performance.now() + 1000;
            state.needsDraw = true;
            return;
          }
          if (b.dataset.act === "toast" && state.toast && state.toast.action) {
            const action = state.toast.action;
            state.toast = null;
            action();
          } else if (b.dataset.act === "invalid") {
            pushUndo();
            state.links = state.links.filter((l) => linkIsValid(l));
            saveSettings();
          } else if (b.dataset.act === "legacy") {
            openLegacyDialog();
          }
          state.needsDraw = true;
          updateMapStatus();
        });

        // ---- Tile types in the color picker (§3.2) ----
        function syncTypeRow() {
          const slot = colorPicker.paletteSlot;
          cpTypeRow.hidden = slot == null;
          if (slot == null) return;
          const t = state.tileTypes[state.palette[slot]];
          cpType.value = t ? t.type : "";
          cpRole.value = t && t.role ? t.role : "";
        }

        function commitTypeRow() {
          const slot = colorPicker.paletteSlot;
          if (slot == null) return;
          const hex = state.palette[slot];
          const name = cpType.value.trim();
          const cur = state.tileTypes[hex];
          const role = cpRole.value || undefined;
          if (cur ? cur.type === name && cur.role === role : !name) return;
          const clash = Object.entries(state.tileTypes).find(([h, t]) => h !== hex && t.type === name);
          if (name && clash) {
            showToast("Type “" + name + "” is already " + clash[0]);
            syncTypeRow();
            return;
          }
          if (!name && cur) {
            // A type can only be removed once no tiles use it.
            const used = countColorUse(hex);
            if (used) {
              showToast("“" + cur.type + "” is used by " + used + " tile" + (used === 1 ? "" : "s") + " — can't remove it");
              syncTypeRow();
              return;
            }
          }
          pushUndo(true);
          if (name) {
            state.tileTypes[hex] = { type: name };
            if (role) state.tileTypes[hex].role = role;
          } else {
            delete state.tileTypes[hex];
            removeFromMaster(hex);
          }
          syncMasterTypes();
          buildPalette();
          saveSettings();
          state.needsDraw = true;
        }

        cpType.addEventListener("change", commitTypeRow);
        cpRole.addEventListener("change", commitTypeRow);
        cpType.addEventListener("keydown", (e) => {
          e.stopPropagation();
          if (e.key === "Enter") cpType.blur();
        });

        // A typed swatch's color moved: carry the type and its tiles along.
        // Returns false if the edit must be refused.
        function retypeSwatchColor(index, oldHex, newHex) {
          const t = state.tileTypes[oldHex];
          if (!t || oldHex === newHex) return true;
          if (state.tileTypes[newHex]) {
            showToast(newHex + " is already “" + state.tileTypes[newHex].type + "”");
            return false;
          }
          if (!colorPicker.typeUndo) {
            pushUndo(true);
            colorPicker.typeUndo = true;
          }
          // Types are global: move it, recolor its tiles, and update every
          // palette that holds the color (the Master palette included).
          state.tileTypes[newHex] = { ...t };
          delete state.tileTypes[oldHex];
          for (const [k, c] of pixels) if (c === oldHex) pixels.set(k, newHex);
          if (state.float) {
            for (const [k, c] of state.float.pixels) if (c === oldHex) state.float.pixels.set(k, newHex);
          }
          syncActivePalette();
          for (const pal of state.palettes) {
            pal.colors.forEach((c, i) => {
              if (c === oldHex) pal.colors[i] = newHex;
            });
          }
          return true;
        }

        // ---- Link tool (§5) ----
        function cellCenter(p, s) {
          return { x: state.camX + (p.x + 0.5) * s, y: state.camY + (p.y + 0.5) * s };
        }

        function distToSegment(px, py, a, b) {
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const len2 = dx * dx + dy * dy;
          const t = len2 ? Math.max(0, Math.min(1, ((px - a.x) * dx + (py - a.y) * dy) / len2)) : 0;
          return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
        }

        function isLinkable(x, y) {
          const t = tileTypeOf(colorAtCell(x, y));
          return canSource(t) || canTarget(t);
        }

        // Nearest hit within LINK_HIT_PX: linkable tile under the pointer,
        // then a link line, then the nearest linkable tile, then any tile.
        function linkHitTest(sx, sy) {
          const s = state.scale;
          const cell = screenToWorld(sx, sy);
          if (isLinkable(cell.x, cell.y)) return { kind: "tile", x: cell.x, y: cell.y };
          let best = null;
          let bd = LINK_HIT_PX;
          for (const l of state.links) {
            const a = endpointPos(l.from);
            const b = endpointPos(l.to);
            if (!a || !b) continue;
            const d = distToSegment(sx, sy, cellCenter(a, s), cellCenter(b, s));
            if (d < bd) {
              bd = d;
              best = { kind: "link", id: l.id };
            }
          }
          if (best) return best;
          bd = LINK_HIT_PX;
          const r = Math.min(40, Math.ceil(LINK_HIT_PX / s) + 1);
          for (let dy = -r; dy <= r; dy++) {
            for (let dx = -r; dx <= r; dx++) {
              const x = cell.x + dx;
              const y = cell.y + dy;
              if (!isLinkable(x, y)) continue;
              const c = cellCenter({ x, y }, s);
              const d = Math.hypot(c.x - sx, c.y - sy);
              if (d < bd) {
                bd = d;
                best = { kind: "tile", x, y };
              }
            }
          }
          if (best) return best;
          if (colorAtCell(cell.x, cell.y)) return { kind: "tile", x: cell.x, y: cell.y };
          return null;
        }

        function flashTile(p) {
          state.linkFlash = { x: p.x, y: p.y, until: performance.now() + 350 };
          state.needsDraw = true;
        }

        function linkTap(sx, sy) {
          const hit = linkHitTest(sx, sy);
          state.needsDraw = true;
          if (!hit) {
            state.linkSel = null;
            state.linkSelLink = null;
            return;
          }
          if (hit.kind === "link") {
            state.linkSelLink = hit.id;
            return;
          }
          state.linkSelLink = null;
          const t = tileTypeOf(colorAtCell(hit.x, hit.y));
          const sel = state.linkSel;
          if (sel && samePos(sel, hit)) {
            state.linkSel = null;
          } else if (sel && canTarget(t)) {
            addLink(sel, hit);
          } else if (canSource(t)) {
            state.linkSel = { x: hit.x, y: hit.y };
          } else {
            flashTile(hit);
          }
          updateMapStatus();
        }

        // Press on a source and drag to a target; a live line follows the
        // pointer. A press without a drag behaves like a tap.
        const LINK_DRAG_SLOP = 6;
        function linkDragStart(sx, sy) {
          const hit = linkHitTest(sx, sy);
          if (!hit || hit.kind !== "tile") return false;
          if (!canSource(tileTypeOf(colorAtCell(hit.x, hit.y)))) return false;
          state.linkDrag = {
            from: { x: hit.x, y: hit.y },
            sx, sy, cx: sx, cy: sy,
            moved: false,
            wasSel: samePos(state.linkSel, hit),
            prevSel: state.linkSel,
          };
          state.linkSel = { x: hit.x, y: hit.y };
          state.linkSelLink = null;
          state.needsDraw = true;
          updateMapStatus();
          return true;
        }

        function linkDragTarget(from, sx, sy) {
          const hit = linkHitTest(sx, sy);
          if (!hit || hit.kind !== "tile" || samePos(hit, from)) return null;
          return canTarget(tileTypeOf(colorAtCell(hit.x, hit.y))) ? hit : null;
        }

        function linkDragMove(sx, sy) {
          const d = state.linkDrag;
          d.cx = sx;
          d.cy = sy;
          if (Math.hypot(sx - d.sx, sy - d.sy) > LINK_DRAG_SLOP) d.moved = true;
          state.needsDraw = true;
        }

        function linkDragEnd(sx, sy) {
          const d = state.linkDrag;
          state.linkDrag = null;
          state.needsDraw = true;
          if (!d.moved) {
            const t = tileTypeOf(colorAtCell(d.from.x, d.from.y));
            if (d.wasSel) {
              state.linkSel = null; // tap on the selected source deselects
            } else if (d.prevSel && canTarget(t)) {
              // Tap on a "both" tile while another source is selected: link it.
              state.linkSel = d.prevSel;
              addLink(d.prevSel, d.from);
            }
            updateMapStatus();
            return;
          }
          const target = linkDragTarget(d.from, sx, sy);
          if (target) addLink(d.from, target);
          else {
            const hit = linkHitTest(sx, sy);
            if (hit && hit.kind === "tile" && !samePos(hit, d.from)) flashTile(hit);
          }
          updateMapStatus();
        }

        function drawLinkDrag(s) {
          const d = state.linkDrag;
          if (!d || !d.moved) return;
          const k = Math.min(1, s / 16);
          const w = Math.max(0.75, 3 * k);
          const a = cellCenter(d.from, s);
          const target = linkDragTarget(d.from, d.cx, d.cy);
          const b = target ? cellCenter(target, s) : { x: d.cx, y: d.cy };
          const color = linkColorFor(d.from);
          ctx.save();
          ctx.strokeStyle = color;
          ctx.fillStyle = color;
          ctx.lineCap = "round";
          if (!target) ctx.setLineDash([Math.max(2, 6 * k), Math.max(2, 5 * k)]);
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = LINK_HALO;
          ctx.lineWidth = w + Math.max(0.5, 2 * k);
          ctx.stroke();
          ctx.strokeStyle = color;
          ctx.lineWidth = w;
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.beginPath();
          ctx.arc(b.x, b.y, Math.max(1.5, 4 * k), 0, Math.PI * 2);
          ctx.fill();
          if (target) {
            const x = Math.round(state.camX + target.x * s);
            const y = Math.round(state.camY + target.y * s);
            const size = Math.max(1, Math.round(state.camX + (target.x + 1) * s) - x);
            const bw = Math.min(w, size / 3);
            ctx.lineWidth = bw;
            ctx.strokeRect(x + bw / 2, y + bw / 2, size - bw, size - bw);
          }
          ctx.restore();
        }

        function addLink(a, b) {
          if (samePos(a, b) || findLink(a, b)) return;
          pushUndo();
          state.links.push({
            id: "l" + state.nextLinkId++,
            from: { x: a.x, y: a.y },
            to: { x: b.x, y: b.y },
            fc: colorAtCell(a.x, a.y),
            tc: colorAtCell(b.x, b.y),
          });
          saveSettings();
          state.needsDraw = true;
        }

        function deleteSelectedLink() {
          if (!state.linkSelLink) return false;
          pushUndo();
          state.links = state.links.filter((l) => l.id !== state.linkSelLink);
          state.linkSelLink = null;
          saveSettings();
          state.needsDraw = true;
          return true;
        }

        function clearSourceLinks(p) {
          if (!state.links.some((l) => samePos(endpointPos(l.from), p))) return;
          pushUndo();
          state.links = state.links.filter((l) => !samePos(endpointPos(l.from), p));
          saveSettings();
          state.needsDraw = true;
        }

        linkActionBtn.addEventListener("click", () => {
          if (state.linkSelLink) deleteSelectedLink();
          else if (state.linkSel) clearSourceLinks(state.linkSel);
          updateMapStatus();
        });

        // ---- Overlay (§6.1), always on ----
        // All valid links are white (invalid ones stay red); a dark halo keeps
        // them visible on light backgrounds.
        const LINK_COLOR = "#ffffff";
        const LINK_HALO = "rgba(0,0,0,0.55)";
        function linkColorFor() {
          return LINK_COLOR;
        }

        function drawMapOverlay(x0, y0, x1, y1, s) {
          const inView = (p) => p.x >= x0 && p.x <= x1 && p.y >= y0 && p.y <= y1;
          const inLinkTool = state.tool === "link";
          // Overlay sizes are tuned for 16px+ tiles and shrink with them below that.
          const k = Math.min(1, s / 16);
          const lw = (w) => Math.max(0.5, w * k);

          // Tapping "N unknown" flashes them: a bold, pulsing fill on top.
          const flashing = state.unknownFlashUntil && performance.now() < state.unknownFlashUntil;
          if (flashing) {
            const t = 1 - (state.unknownFlashUntil - performance.now()) / 1000;
            ctx.save();
            ctx.fillStyle = withAlpha(LINK_BAD, 0.35 + 0.35 * Math.abs(Math.sin(t * Math.PI * 3)));
            ctx.strokeStyle = LINK_BAD;
            ctx.lineWidth = Math.max(1, Math.min(3, s * 0.15));
            const hit = (x, y, c) => {
              if (state.tileTypes[c] || x < x0 || x > x1 || y < y0 || y > y1) return;
              fillCell(x, y, s);
              const l = Math.round(state.camX + x * s);
              const tp = Math.round(state.camY + y * s);
              ctx.strokeRect(l - 2, tp - 2, Math.max(1, s) + 4, Math.max(1, s) + 4);
            };
            for (const [k, c] of pixels) {
              const p = parseKey(k);
              hit(p.x, p.y, c);
            }
            if (state.float) {
              for (const [k, c] of state.float.pixels) {
                const p = parseKey(k);
                hit(p.x + state.float.x, p.y + state.float.y, c);
              }
            }
            ctx.restore();
            state.needsDraw = true;
          } else if (state.unknownFlashUntil) {
            state.unknownFlashUntil = 0;
          }

          // Unknown pixels, only once the drawing is being used as a map.
          if (isMapMode() && (inLinkTool || state.showUnknownOutside)) {
            ctx.save();
            const tiny = s < 5;
            const w = lw(1);
            const inset = w / 2 + (s >= 8 ? 1 : 0);
            ctx.setLineDash([Math.max(1, 3 * k), Math.max(1, 3 * k)]);
            ctx.lineWidth = w;
            ctx.strokeStyle = withAlpha(state.accentColor, 0.9);
            ctx.fillStyle = withAlpha(state.accentColor, 0.45);
            const mark = (x, y, c) => {
              if (state.tileTypes[c] || x < x0 || x > x1 || y < y0 || y > y1) return;
              const px = state.camX + x * s;
              const py = state.camY + y * s;
              // Too small for a dashed outline: tint the tile instead.
              if (tiny) ctx.fillRect(px, py, s, s);
              else ctx.strokeRect(px + inset, py + inset, s - inset * 2, s - inset * 2);
            };
            for (const [k, c] of pixels) {
              const p = parseKey(k);
              mark(p.x, p.y, c);
            }
            if (state.float) {
              for (const [k, c] of state.float.pixels) {
                const p = parseKey(k);
                mark(p.x + state.float.x, p.y + state.float.y, c);
              }
            }
            ctx.restore();
          }

          if (inLinkTool && state.linkSel) {
            // Valid targets for the selected source.
            ctx.save();
            ctx.lineWidth = lw(2);
            ctx.strokeStyle = withAlpha(state.accentColor, 0.55);
            for (const k of pixels.keys()) {
              const p = parseKey(k);
              if (!inView(p) || samePos(p, state.linkSel)) continue;
              if (!canTarget(tileTypeOf(pixels.get(k)))) continue;
              const i = ctx.lineWidth / 2;
              ctx.strokeRect(state.camX + p.x * s + i, state.camY + p.y * s + i, s - i * 2, s - i * 2);
            }
            ctx.restore();
          }

          const showLinks = inLinkTool || state.showLinksOutside;

          const focus = inspectCell();
          const head = Math.max(1.5, Math.min(10, s * 0.4));
          for (const l of showLinks ? state.links : []) {
            const a = endpointPos(l.from);
            const b = endpointPos(l.to);
            if (!a || !b) continue;
            const valid = linkIsValid(l);
            const selected = inLinkTool && l.id === state.linkSelLink;
            const ofSel = inLinkTool && samePos(a, state.linkSel);
            const dim = !ofSel && focus && !samePos(a, focus) && !samePos(b, focus);
            const pa = cellCenter(a, s);
            const pb = cellCenter(b, s);
            const ang = Math.atan2(pb.y - pa.y, pb.x - pa.x);
            const color = valid ? linkColorFor(a) : LINK_BAD;
            ctx.save();
            ctx.globalAlpha = dim ? 0.45 : 0.95;
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineCap = "round";
            const width = lw(selected ? 4 : ofSel ? 3 : 2);
            ctx.lineWidth = width;
            if (!valid) ctx.setLineDash([Math.max(2, 6 * k), Math.max(1.5, 4 * k)]);
            ctx.beginPath();
            ctx.moveTo(pa.x, pa.y);
            ctx.lineTo(pb.x, pb.y);
            if (valid) {
              ctx.strokeStyle = LINK_HALO;
              ctx.lineWidth = width + lw(2);
              ctx.stroke();
              ctx.strokeStyle = color;
              ctx.lineWidth = width;
            }
            ctx.stroke();
            ctx.setLineDash([]);
            // Arrowhead centred on the end of the line (the target's centre).
            const th = head * Math.cos(0.45); // triangle height
            const hw = head * Math.sin(0.45); // half base
            const ux = Math.cos(ang);
            const uy = Math.sin(ang);
            const bx = pb.x - (ux * th) / 3;
            const by = pb.y - (uy * th) / 3;
            ctx.beginPath();
            ctx.moveTo(pb.x + (ux * th * 2) / 3, pb.y + (uy * th * 2) / 3);
            ctx.lineTo(bx - uy * hw, by + ux * hw);
            ctx.lineTo(bx + uy * hw, by - ux * hw);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.arc(pa.x, pa.y, Math.max(0.75, Math.min(4, s * 0.15)), 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          if (inLinkTool && state.linkSel) {
            // Bright border on the selected source and on each tile it links to.
            // Drawn inside the tile, so neighbouring highlights never overlap.
            const border = (p, color, w0) => {
              const x = Math.round(state.camX + p.x * s);
              const y = Math.round(state.camY + p.y * s);
              const size = Math.max(1, Math.round(state.camX + (p.x + 1) * s) - x);
              const w = Math.min(lw(w0), size / 3);
              const halo = Math.min(w + lw(1.5), size / 2);
              ctx.lineWidth = halo;
              ctx.strokeStyle = "rgba(0,0,0,0.8)";
              ctx.strokeRect(x + halo / 2, y + halo / 2, size - halo, size - halo);
              ctx.lineWidth = w;
              ctx.strokeStyle = color;
              ctx.strokeRect(x + w / 2, y + w / 2, size - w, size - w);
            };
            const color = linkColorFor(state.linkSel);
            ctx.save();
            for (const l of state.links) {
              const b = endpointPos(l.to);
              if (b && samePos(endpointPos(l.from), state.linkSel)) border(b, color, 2);
            }
            border(state.linkSel, "#ffffff", 3);
            ctx.restore();
          }

          if (state.linkFlash) {
            if (performance.now() < state.linkFlash.until) {
              ctx.save();
              ctx.fillStyle = withAlpha(LINK_BAD, 0.6);
              fillCell(state.linkFlash.x, state.linkFlash.y, s);
              ctx.restore();
              state.needsDraw = true;
            } else {
              state.linkFlash = null;
            }
          }

          drawLinkDrag(s);
          placeLinkAction(s);
          updateMapStatus();
        }

        function placeLinkAction(s) {
          let at = null;
          let label = "";
          if (state.linkDrag && state.linkDrag.moved) {
            // keep the canvas clear while dragging
          } else if (state.tool === "link" && state.linkSelLink) {
            const l = state.links.find((x) => x.id === state.linkSelLink);
            const a = l && endpointPos(l.from);
            const b = l && endpointPos(l.to);
            if (a && b) {
              const pa = cellCenter(a, s);
              const pb = cellCenter(b, s);
              at = { x: (pa.x + pb.x) / 2, y: (pa.y + pb.y) / 2 };
              label = "×";
            }
          } else if (
            state.tool === "link" &&
            state.linkSel &&
            state.links.some((l) => samePos(endpointPos(l.from), state.linkSel))
          ) {
            const c = cellCenter(state.linkSel, s);
            at = { x: c.x, y: c.y + Math.max(8, s * 0.75) + 20 };
            label = "Clear links";
          }
          linkActionBtn.hidden = !at;
          if (!at) return;
          const r = canvas.getBoundingClientRect();
          linkActionBtn.style.left = r.left + at.x + "px";
          linkActionBtn.style.top = r.top + at.y + "px";
          linkActionBtn.textContent = label;
          linkActionBtn.setAttribute("aria-label", label === "×" ? "Delete link" : "Clear links");
        }

        // ---- Map export (§7.1) ----
        function mapWarnings() {
          const out = [];
          const unknown = isMapMode() ? countUnknown() : 0;
          if (unknown) out.push(unknown + " unknown pixel" + (unknown === 1 ? "" : "s"));
          const bad = state.links.filter((l) => !linkIsValid(l)).length;
          if (bad) out.push(bad + " invalid link" + (bad === 1 ? "" : "s"));
          return out.join(", ");
        }

        async function buildMapJson() {
          if (state.float) commitFloat();
          const b = contentBounds();
          if (!b) throw new Error("empty");
          const blob = await buildSelectionPngBlob(b);
          if (!blob) throw new Error("empty");
          const image = "data:image/png;base64," + (await blobToBase64(blob));
          const palette = Object.entries(state.tileTypes).map(([color, t]) => {
            const e = { color, type: t.type };
            if (t.role) e.linkRole = t.role;
            return e;
          });
          const links = [];
          for (const l of state.links) {
            const a = endpointPos(l.from);
            const z = endpointPos(l.to);
            if (!a || !z) continue;
            const o = { id: l.id, from: [a.x - b.x, a.y - b.y], to: [z.x - b.x, z.y - b.y] };
            if (l.props) o.props = l.props;
            links.push(o);
          }
          const doc = {
            format: "tilemap",
            version: MAP_VERSION,
            name: state.mapName || "map",
            origin: [b.x, b.y],
            width: b.w,
            height: b.h,
            image,
            palette,
            nextLinkId: state.nextLinkId,
            links,
          };
          return { json: JSON.stringify(doc, null, 2), name: doc.name, warn: mapWarnings() };
        }

        async function copyMap() {
          const job = buildMapJson();
          try {
            if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
              // Promise-valued item keeps Safari's user-gesture requirement happy.
              const blob = job.then((r) => new Blob([r.json], { type: "text/plain" }));
              try {
                await navigator.clipboard.write([new ClipboardItem({ "text/plain": blob })]);
              } catch (err) {
                if (err && err.message === "empty") throw err;
                await navigator.clipboard.writeText((await job).json);
              }
            } else {
              await navigator.clipboard.writeText((await job).json);
            }
            const r = await job;
            showToast("Map copied" + (r.warn ? " (" + r.warn + ")" : ""));
          } catch (err) {
            showToast(err && err.message === "empty" ? "Nothing to export" : "Copy failed");
          }
        }

        async function downloadMap() {
          try {
            const r = await buildMapJson();
            await saveBlob(new Blob([r.json], { type: "application/json" }), r.name + ".map.json");
            showToast("Map saved" + (r.warn ? " (" + r.warn + ")" : ""));
          } catch (err) {
            if (err && err.message === "empty") showToast("Nothing to export");
            else if (!/cancel/i.test((err && err.message) || "")) showToast("Save failed");
          }
        }

        copyMapBtn.addEventListener("click", copyMap);
        downloadMapBtn.addEventListener("click", downloadMap);

        // Export: tap copies the map; hold (or right-click) opens a menu with
        // every export option.
        const exportBtn = document.getElementById("btn-export");
        const exportMenu = document.getElementById("export-menu");
        const EXPORT_HOLD_MS = 450;
        let exportHold = null;
        let exportSuppressClick = 0;

        function openExportMenu() {
          syncActionButtons();
          exportMenu.hidden = false;
          const b = exportBtn.getBoundingClientRect();
          const m = exportMenu.getBoundingClientRect();
          const left = b.right + 8 + m.width <= window.innerWidth ? b.right + 8 : Math.max(8, b.left - 8 - m.width);
          const top = Math.max(8, Math.min(window.innerHeight - m.height - 8, b.top + b.height / 2 - m.height / 2));
          exportMenu.style.left = left + "px";
          exportMenu.style.top = top + "px";
        }

        function closeExportMenu() {
          exportMenu.hidden = true;
        }

        exportBtn.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          const h = { id: e.pointerId, x: e.clientX, y: e.clientY };
          h.timer = setTimeout(() => {
            if (exportHold !== h) return;
            exportHold = null;
            exportSuppressClick = performance.now() + 1000;
            openExportMenu();
          }, EXPORT_HOLD_MS);
          exportHold = h;
        });
        const endExportHold = (e) => {
          if (exportHold && e.pointerId === exportHold.id) {
            clearTimeout(exportHold.timer);
            exportHold = null;
          }
        };
        window.addEventListener("pointerup", endExportHold);
        window.addEventListener("pointercancel", endExportHold);
        window.addEventListener("pointermove", (e) => {
          if (exportHold && e.pointerId === exportHold.id && Math.hypot(e.clientX - exportHold.x, e.clientY - exportHold.y) > 10) {
            endExportHold(e);
          }
        });
        exportBtn.addEventListener("click", () => {
          if (performance.now() < exportSuppressClick) {
            exportSuppressClick = 0;
            return;
          }
          copyMap();
        });
        exportBtn.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          openExportMenu();
        });
        // Picking an item closes the menu; tapping elsewhere just closes it.
        exportMenu.addEventListener("click", (e) => {
          if (e.target.closest(".export-item")) closeExportMenu();
        });
        document.addEventListener(
          "pointerdown",
          (e) => {
            if (exportMenu.hidden) return;
            if (exportMenu.contains(e.target) || exportBtn.contains(e.target)) return;
            closeExportMenu();
            swallowTap(e);
          },
          true
        );

        // ---- Map import (§7.2) ----
        function parseMapText(text) {
          if (!text || text.trim()[0] !== "{") return null;
          try {
            const d = JSON.parse(text);
            return d && d.format === "tilemap" ? d : null;
          } catch (_) {
            return null;
          }
        }

        function decodeImage(src) {
          return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error("Map image could not be read"));
            img.src = src;
          });
        }

        async function importMap(d) {
          try {
            if (!Number.isInteger(d.version) || d.version < 1) throw new Error("Map has no version");
            if (d.version > MAP_VERSION) throw new Error("Map version " + d.version + " is newer than this editor");
            if (typeof d.image !== "string" || !d.image.startsWith("data:image/")) {
              throw new Error("Map has no image");
            }
            const img = await decodeImage(d.image);
            const w = img.naturalWidth;
            const h = img.naturalHeight;
            if (w !== d.width || h !== d.height) {
              throw new Error("Map size " + d.width + "×" + d.height + " doesn't match its image (" + w + "×" + h + ")");
            }
            const off = document.createElement("canvas");
            off.width = w;
            off.height = h;
            const octx = off.getContext("2d", { willReadFrequently: true });
            octx.drawImage(img, 0, 0);
            const data = octx.getImageData(0, 0, w, h).data;
            const origin =
              Array.isArray(d.origin) && Number.isInteger(d.origin[0]) && Number.isInteger(d.origin[1])
                ? { x: d.origin[0], y: d.origin[1] }
                : { x: 0, y: 0 };

            const types = {};
            for (const e of Array.isArray(d.palette) ? d.palette : []) {
              if (e && typeof e.color === "string") types[e.color] = { type: e.type, role: e.linkRole };
            }

            pushUndo(true);
            state.float = null;
            state.selection = null;
            pixels.clear();
            for (let y = 0; y < h; y++) {
              for (let x = 0; x < w; x++) {
                const i = (y * w + x) * 4;
                if (data[i + 3] < 128) continue;
                pixels.set(key(origin.x + x, origin.y + y), rgbToHex(data[i], data[i + 1], data[i + 2]));
              }
            }
            state.tileTypes = sanitizeTileTypes(types);
            syncMasterTypes(); // the map's types join the Master palette

            const links = [];
            const ids = new Set();
            let dupProps = 0;
            const isXY = (v) => Array.isArray(v) && Number.isInteger(v[0]) && Number.isInteger(v[1]);
            for (const raw of Array.isArray(d.links) ? d.links : []) {
              if (!raw || !isXY(raw.from) || !isXY(raw.to)) continue;
              const from = { x: origin.x + raw.from[0], y: origin.y + raw.from[1] };
              const to = { x: origin.x + raw.to[0], y: origin.y + raw.to[1] };
              const dup = links.find((l) => samePos(l.from, from) && samePos(l.to, to));
              if (dup) {
                if (JSON.stringify(dup.props || null) !== JSON.stringify(raw.props || null)) dupProps++;
                continue;
              }
              const l = {
                id: typeof raw.id === "string" && !ids.has(raw.id) ? raw.id : null,
                from,
                to,
                fc: pixels.get(key(from.x, from.y)) || null,
                tc: pixels.get(key(to.x, to.y)) || null,
              };
              if (raw.props && typeof raw.props === "object") l.props = raw.props;
              if (l.id) ids.add(l.id);
              links.push(l);
            }
            let next = nextLinkIdFor(links.filter((l) => l.id), d.nextLinkId);
            for (const l of links) if (!l.id) l.id = "l" + next++;
            state.links = links;
            state.nextLinkId = next;
            state.mapName = typeof d.name === "string" && d.name.trim() ? d.name.trim() : "map";
            state.linkSel = null;
            state.linkSelLink = null;
            state.legacyOffer = false;
            buildPalette();
            syncActionButtons();
            saveSettings();
            state.needsDraw = true;
            const warn = mapWarnings();
            showToast(
              "Loaded “" + state.mapName + "”" +
                (dupProps ? " · merged duplicates with different props" : "") +
                (warn ? " (" + warn + ")" : "")
            );
          } catch (err) {
            showToast((err && err.message) || "Couldn't load map");
          }
        }

        async function importAnyFile(file) {
          if (!file) return;
          const name = String(file.name || "").toLowerCase();
          if (name.endsWith(".json") || /json/.test(file.type || "")) {
            const d = parseMapText(await file.text());
            if (d) importMap(d);
            else showToast("Not a map file");
            return;
          }
          importImageFile(file);
        }

        async function tryPasteMapText() {
          if (!navigator.clipboard || typeof navigator.clipboard.readText !== "function") return false;
          try {
            const d = parseMapText(await navigator.clipboard.readText());
            if (!d) return false;
            await importMap(d);
            return true;
          } catch (_) {
            return false;
          }
        }

        // ---- Legacy converter (§8) ----
        function hueDistance(a, b) {
          const d = Math.abs(a - b) % 360;
          return d > 180 ? 360 - d : d;
        }

        function readLegacyConfig(text) {
          let c;
          try {
            c = JSON.parse(text);
          } catch (_) {
            return { error: "Config isn't valid JSON" };
          }
          const num = (v, d) => (Number.isFinite(v) ? v : d);
          if (!c || !Array.isArray(c.rules) || !c.rules.length) return { error: "Config needs a rules list" };
          const rules = [];
          for (const r of c.rules) {
            if (!r || !Number.isFinite(r.hue) || typeof r.type !== "string") {
              return { error: "Each rule needs a numeric hue and a type" };
            }
            rules.push({ hue: ((r.hue % 360) + 360) % 360, type: r.type.trim() });
          }
          return {
            config: {
              rules,
              hueTolerance: num(c.hueTolerance, 3),
              saturationTolerance: num(c.saturationTolerance, 2),
              minSaturation: num(c.minSaturation, 10),
              minBrightness: num(c.minBrightness, 10),
            },
          };
        }

        function legacyMatches(cfg, entries) {
          const out = [];
          for (const [k, c] of entries) {
            const { r, g, b } = hexToRgb(c);
            const hsv = rgbToHsv(r, g, b);
            const sat = hsv.s * 100;
            if (sat < cfg.minSaturation || hsv.v * 100 < cfg.minBrightness) continue;
            const rule = cfg.rules.find((x) => hueDistance(hsv.h, x.hue) <= cfg.hueTolerance);
            if (rule) out.push({ k, p: parseKey(k), type: rule.type, sat: Math.round(sat) });
          }
          return out;
        }

        function legacyPlan(cfg) {
          const typeHex = {};
          for (const [hex, t] of Object.entries(state.tileTypes)) typeHex[t.type] = hex;
          const missing = [...new Set(cfg.rules.map((r) => r.type))].filter((t) => !typeHex[t]);
          const matches = legacyMatches(cfg, pixels);
          if (missing.length) {
            return {
              error:
                "Give a swatch each of these tile types first: " + missing.join(", ") +
                " (" + matches.length + " matching pixels)",
            };
          }
          matches.sort((a, b) => a.sat - b.sat);
          const groups = [];
          for (const m of matches) {
            const g = groups[groups.length - 1];
            if (g && m.sat - g.last <= cfg.saturationTolerance) {
              g.items.push(m);
              g.last = m.sat;
            } else {
              groups.push({ items: [m], first: m.sat, last: m.sat });
            }
          }
          const links = [];
          const warnings = [];
          const counts = {};
          for (const g of groups) {
            const src = g.items.filter((m) => canSource(state.tileTypes[typeHex[m.type]]));
            const tgt = g.items.filter((m) => canTarget(state.tileTypes[typeHex[m.type]]));
            const label = g.first === g.last ? g.first + "%" : g.first + "–" + g.last + "%";
            if (src.length && !tgt.length) warnings.push("sat " + label + ": " + src.length + " source(s), no targets");
            if (!src.length && tgt.length) warnings.push("sat " + label + ": " + tgt.length + " target(s), no sources");
            for (const a of src) {
              for (const b of tgt) {
                if (!samePos(a.p, b.p)) links.push({ from: a.p, to: b.p });
              }
            }
          }
          for (const m of matches) counts[m.type] = (counts[m.type] || 0) + 1;
          return { matches, groups, links, warnings, counts, typeHex };
        }

        function legacySummary(plan) {
          if (plan.error) return plan.error;
          const counts = Object.entries(plan.counts).map(([t, n]) => n + " " + t + (n === 1 ? "" : "s"));
          let text =
            "Found " + plan.groups.length + " group" + (plan.groups.length === 1 ? "" : "s") +
            (counts.length ? ", " + counts.join(", ") : "") +
            " → " + plan.links.length + " link" + (plan.links.length === 1 ? "" : "s") + ".";
          if (plan.warnings.length) text += "\n\nWarnings:\n" + plan.warnings.join("\n");
          return text;
        }

        let legacyCurrent = null;
        function refreshLegacyPlan() {
          const parsed = readLegacyConfig(legacyConfigEl.value);
          legacyCurrent = parsed.error ? { error: parsed.error } : legacyPlan(parsed.config);
          if (!parsed.error) state.legacyConfig = parsed.config;
          legacySummaryEl.textContent = legacySummary(legacyCurrent);
          legacyApplyBtn.disabled = !!legacyCurrent.error || !legacyCurrent.matches.length;
        }

        function openLegacyDialog() {
          if (state.float) {
            pushUndo();
            commitFloat();
          }
          closeColorPicker();
          legacyConfigEl.value = JSON.stringify(state.legacyConfig || DEFAULT_LEGACY_CONFIG, null, 2);
          legacyDialog.hidden = false;
          refreshLegacyPlan();
        }

        function closeLegacyDialog() {
          legacyDialog.hidden = true;
          legacyCurrent = null;
        }

        function applyLegacyPlan() {
          const plan = legacyCurrent;
          if (!plan || plan.error) return;
          pushUndo();
          for (const m of plan.matches) pixels.set(m.k, plan.typeHex[m.type]);
          let added = 0;
          for (const l of plan.links) {
            if (findLink(l.from, l.to)) continue;
            state.links.push({
              id: "l" + state.nextLinkId++,
              from: { ...l.from },
              to: { ...l.to },
              fc: pixels.get(key(l.from.x, l.from.y)),
              tc: pixels.get(key(l.to.x, l.to.y)),
            });
            added++;
          }
          state.legacyOffer = false;
          closeLegacyDialog();
          saveSettings();
          state.needsDraw = true;
          showToast("Converted " + plan.matches.length + " pixels, added " + added + " links", "Undo", undo);
        }

        legacyConfigEl.addEventListener("input", refreshLegacyPlan);
        legacyDialog.addEventListener("keydown", (e) => {
          e.stopPropagation();
          if (e.key === "Escape") closeLegacyDialog();
        });
        legacyApplyBtn.addEventListener("click", applyLegacyPlan);
        document.getElementById("legacy-cancel").addEventListener("click", closeLegacyDialog);
        document.getElementById("btn-legacy").addEventListener("click", openLegacyDialog);

        readNativeSettings().then(startApp);
      })();
    </script>
  </body>
</html>
