          quickMenu.target = { x, y };
          if (immediate || !quickMenu.aim) {
            quickMenu.aim = { x, y };
            aimQuickMenu(x, y);
            return;
          }
          if (!quickMenu.smoothing) {
            quickMenu.smoothing = true;
            quickMenu.smoothAt = performance.now();
            requestAnimationFrame(smoothQuickMenuAim);
          }
        }

        function smoothQuickMenuAim(now) {
          if (!quickMenu.open || !quickMenu.aim || !quickMenu.target) {
            quickMenu.smoothing = false;
            return;
          }
          const dt = Math.max(0, now - quickMenu.smoothAt);
          quickMenu.smoothAt = now;
          const t = 1 - Math.exp(-dt / QM_SMOOTH_MS);
          const a = quickMenu.aim;
          const b = quickMenu.target;
          a.x += (b.x - a.x) * t;
          a.y += (b.y - a.y) * t;
          if (Math.hypot(b.x - a.x, b.y - a.y) < 0.5) {
            a.x = b.x;
            a.y = b.y;
          }
          aimQuickMenu(a.x, a.y);
          if (quickMenu.open && (a.x !== b.x || a.y !== b.y)) requestAnimationFrame(smoothQuickMenuAim);
          else quickMenu.smoothing = false;
        }

        function aimQuickMenu(x, y) {
          const at = quickMenuItemAt(x, y);
          const hot = at.item || null;
          // Leaving the menu picks whatever is in that direction and closes it
          // (leaving through colors just opens the swatch ring). Only once the
          // pointer has been inside, so one that starts outside (a mouse on

          syncActivePalette();
          const m = masterPalette();
          if (!m || m.colors.length <= 1) return;
          const i = m.colors.indexOf(hex);
          if (i < 0) return;
          m.colors.splice(i, 1);
          if (m.index > i || m.index >= m.colors.length) m.index = Math.max(0, m.index - 1);
          if (activeIsMaster()) {
            state.paletteIndex = m.index;
            state.color = state.palette[state.paletteIndex];
          }
        }

        function ensurePalettes() {
          if (!state.palettes.length) {
            state.palettes = [{ name: "Palette 1", colors: state.palette, index: state.paletteIndex }];
            state.activePalette = 0;
          }
          if (!masterPalette()) {
            // Older saves: add Master in front, seeded with every typed color.
            const typed = Object.keys(state.tileTypes);
            state.palettes.unshift({
              name: "Master",
              master: true,
              colors: typed.length ? typed.slice() : [state.palette[0] || DEFAULT_PALETTE[0]],
              index: 0,
            });
            state.activePalette += 1;
          }
          syncMasterTypes();
        }

        function switchPalette(i) {
          if (i === state.activePalette || !state.palettes[i]) return;
          syncActivePalette();
          state.activePalette = i;
          const p = state.palettes[i];
          state.palette = p.colors;
          state.paletteIndex = Math.min(p.index, p.colors.length - 1);
          state.color = state.palette[state.paletteIndex];
          closeColorPicker();
          buildPalette();
          saveSettings();
          state.needsDraw = true;
        }

        function nextPaletteName() {
          let n = state.palettes.length + 1;
          while (state.palettes.some((p) => p.name === "Palette " + n)) n++;
          return "Palette " + n;
        }

        function addPalette(colors) {
          syncActivePalette();
          pushUndo(true);
          state.palettes.push({ name: nextPaletteName(), colors, index: 0 });
          switchPalette(state.palettes.length - 1);
          renderPalettesDialog();
        }

        let paletteDeleteArm = null; // index whose delete was tapped once
        function deletePalette(i) {
          if (state.palettes.length <= 1 || (state.palettes[i] && state.palettes[i].master)) return;
          if (paletteDeleteArm !== i) {
            paletteDeleteArm = i; // first tap arms; second confirms
            renderPalettesDialog();
            return;
          }
          paletteDeleteArm = null;
          syncActivePalette();
          pushUndo(true);
          state.palettes.splice(i, 1);
          let act = state.activePalette;
          if (i < act || act >= state.palettes.length) act = Math.max(0, act - 1);
          if (i === state.activePalette) act = Math.min(i, state.palettes.length - 1);
          state.activePalette = -1; // force switchPalette to load
          switchPalette(act);
          renderPalettesDialog();
        }

        function renamePalette(i, name) {
          const n = name.trim().slice(0, 40);
          if (!n || !state.palettes[i]) return;
          state.palettes[i].name = n;
          buildPalette();
          saveSettings();
        }

        // Move a color from one palette to another (appended). The last color
        // of a palette is copied instead, since a palette can't be empty.
        function moveColor(from, k, to) {
          syncActivePalette();
          const src = state.palettes[from];
          const dst = state.palettes[to];
          if (!src || !dst || from === to || dst.colors.length >= MAX_PALETTE_SIZE) return;
          pushUndo(true);
          const color = src.colors[k];
          dst.colors.push(color);
          if (src.master && state.tileTypes[color]) {
            showToast("Copied — the Master palette keeps every tile type");
          } else if (src.colors.length > 1) {
            src.colors.splice(k, 1);
            if (src.index > k || src.index >= src.colors.length) src.index = Math.max(0, src.index - 1);
          } else {
            showToast("Copied — a palette needs at least one color");
          }
          if (from === state.activePalette || to === state.activePalette) {
            const act = state.palettes[state.activePalette];
            state.palette = act.colors;
            state.paletteIndex = Math.min(act.index, act.colors.length - 1);
            state.color = state.palette[state.paletteIndex];
            buildPalette();
          }
          saveSettings();
          renderPalettesDialog();
        }

        function renderPalettesDialog() {
          syncActivePalette();
          palettesList.textContent = "";
          state.palettes.forEach((pal, i) => {
            const row = document.createElement("div");
            row.className = "pal-row" + (i === state.activePalette ? " active" : "");
            row.dataset.i = String(i);
            const head = document.createElement("div");
            head.className = "pal-head";
            const name = document.createElement("input");
            name.className = "pal-name";
            name.value = pal.name;
            name.maxLength = 40;
            name.setAttribute("aria-label", "Palette name");
            name.addEventListener("change", () => renamePalette(i, name.value));
            name.addEventListener("keydown", (e) => {
              e.stopPropagation();
              if (e.key === "Enter") name.blur();
            });
            name.addEventListener("click", (e) => e.stopPropagation());
            // Focusing a name selects all of it, ready to retype.
            name.addEventListener("focus", () => setTimeout(() => name.select(), 0));
            const del = document.createElement("button");
            del.type = "button";
            del.className = "settings-btn";
            del.textContent = pal.master ? "master" : paletteDeleteArm === i ? "delete?" : "delete";
            del.disabled = pal.master || state.palettes.length <= 1;
            if (pal.master) del.title = "Holds every tile type; can't be deleted";
            del.addEventListener("click", (e) => {
              e.stopPropagation();
              deletePalette(i);
            });
            head.append(name, del);
            const strip = document.createElement("div");
            strip.className = "pal-strip";
            pal.colors.forEach((c, k) => {
              const sw = document.createElement("div");
              sw.className = "pal-swatch";
              sw.style.background = c;
              sw.title = c;
              sw.dataset.k = String(k);
              sw.addEventListener("pointerdown", (e) => palDragStart(e, i, k, c));
              strip.appendChild(sw);
            });
            row.append(head, strip);
            row.addEventListener("click", () => {
              paletteDeleteArm = null;
              switchPalette(i);
              renderPalettesDialog();
            });
            palettesList.appendChild(row);
          });
        }

        // Drag a color swatch onto another palette's row to move it there.
        let palDrag = null;
        function palDragStart(e, from, k, color) {
          e.stopPropagation();
          palDrag = { id: e.pointerId, from, k, color, sx: e.clientX, sy: e.clientY, ghost: null, over: null };
          try {
            e.target.setPointerCapture(e.pointerId);
          } catch (_) {}
        }
        window.addEventListener("pointermove", (e) => {
          const d = palDrag;
          if (!d || e.pointerId !== d.id) return;
          if (!d.ghost) {
            if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 5) return;
            d.ghost = document.createElement("div");
            d.ghost.className = "pal-ghost";
            d.ghost.style.background = d.color;
            document.body.appendChild(d.ghost);
          }
          d.ghost.style.left = e.clientX + "px";
          d.ghost.style.top = e.clientY + "px";
          const under = document.elementFromPoint(e.clientX, e.clientY);
          const row = under && under.closest && under.closest(".pal-row");
          const over = row && +row.dataset.i !== d.from ? row : null;
          if (d.over !== over) {
            if (d.over) d.over.classList.remove("drop");
            if (over) over.classList.add("drop");
            d.over = over;
          }
        });
        const endPalDrag = (e) => {
          const d = palDrag;
          if (!d || e.pointerId !== d.id) return;
          palDrag = null;
          if (d.ghost) d.ghost.remove();
          if (d.over) d.over.classList.remove("drop");
          if (e.type === "pointerup" && d.ghost && d.over) {
            palSuppressClick = performance.now() + 400;
            moveColor(d.from, d.k, +d.over.dataset.i);
          }
        };
        let palSuppressClick = 0;
        palettesList.addEventListener(
          "click",
          (e) => {
            if (performance.now() < palSuppressClick) {
              e.stopPropagation();
              e.preventDefault();
            }
          },
          true
        );
        window.addEventListener("pointerup", endPalDrag);
        window.addEventListener("pointercancel", endPalDrag);

        function openPalettesDialog() {
          closeColorPicker();
          paletteDeleteArm = null;
          renderPalettesDialog();
          palettesDialog.hidden = false;
        }

        function closePalettesDialog() {
          palettesDialog.hidden = true;
          paletteDeleteArm = null;
        }

        document.getElementById("palettes-close").addEventListener("click", closePalettesDialog);
        document.getElementById("palette-new").addEventListener("click", () => addPalette([state.color || DEFAULT_PALETTE[0]]));
        document.getElementById("palette-dup").addEventListener("click", () => addPalette(state.palette.slice()));
        palettesDialog.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            e.stopPropagation();
            closePalettesDialog();
          }
        });
        // Tapping outside the window closes it.
        document.addEventListener(
          "pointerdown",
          (e) => {
            if (palettesDialog.hidden) return;
            const t = e.target;
            if (palettesDialog.contains(t) || (t.closest && t.closest(".palette-menu"))) return;
            closePalettesDialog();
            swallowTap(e);
          },
          true
        );

        // ---- Movable / resizable toolbar and palette ----
        // Layout per panel: { x, y } top-left (null = default spot) and { w, h }
        // (null = natural size). A sized panel lays its buttons out in a grid.
        const HUD_MIN_W = 66; // one 44px button + padding
        const HUD_MIN_H = 104; // grip + one 44px row + padding
        const HUD_DOUBLE_TAP_MS = 350;
        const huds = {
          tools: document.getElementById("hud-tools"),
          palette: document.getElementById("hud-palette"),
          size: document.getElementById("size-hud"),
        };
        const HUD_MIN = { size: { w: 48, h: 40 } };

        function hudLayout(name) {
          if (!state.hudLayout[name]) state.hudLayout[name] = { x: null, y: null, w: null, h: null };
          return state.hudLayout[name];
        }

        function applyHudLayout(name) {
          const el = huds[name];
          const L = hudLayout(name);
          const sized = L.w != null;
          el.classList.toggle("sized", sized);
          // A portrait size bar stacks vertically with an up/down slider.
          el.classList.toggle("portrait", name === "size" && sized && L.h > L.w);
          if (name === "size") syncSizeHud();
          if (sized) {
            const min = HUD_MIN[name] || { w: HUD_MIN_W, h: HUD_MIN_H };
            // Whole pixels, so a snapped edge sits exactly on the screen edge.
            L.w = Math.round(Math.max(min.w, Math.min(window.innerWidth, L.w)));
            L.h = Math.round(Math.max(min.h, Math.min(window.innerHeight, L.h)));
            el.style.width = L.w + "px";
            el.style.height = L.h + "px";
          } else {
            el.style.width = "";
            el.style.height = "";
          }
          if (L.x == null) {
            el.classList.remove("snap-l", "snap-t", "snap-r", "snap-b");
            // Default spot: vertically centred at its edge.
            el.style.left = "";
            el.style.top = "";
            el.style.right = "";
            el.style.transform = "";
            return;
          }
          // Keep the whole panel on screen.
          const w = el.offsetWidth;
          const h = el.offsetHeight;
          L.x = Math.round(Math.max(0, Math.min(window.innerWidth - w, L.x)));
          L.y = Math.round(Math.max(0, Math.min(window.innerHeight - h, L.y)));
          el.style.left = L.x + "px";
          el.style.top = L.y + "px";
          el.style.right = "auto";
          el.style.transform = "none";
          // Mark edges flush with the screen (their border and handles hide).
          el.classList.toggle("snap-l", L.x <= 0);
          el.classList.toggle("snap-t", L.y <= 0);
          el.classList.toggle("snap-r", L.x + w >= window.innerWidth - 0.5);
          el.classList.toggle("snap-b", L.y + h >= window.innerHeight - 0.5);
        }

        // Sized panel: pick the column count that gives the biggest square cells
        // while fitting every button, then stretch the grid to fill the panel.
        const HUD_GAP = 6;
        function hudItems(name) {
          if (name === "palette") return [...paletteEl.children];
          return [...document.querySelectorAll("#tools-body .tool")].filter(
            (b) => !b.hidden && !b.closest("[hidden]")
          );
        }

        function fitHudGrid(name) {
          if (name === "size") return; // the size bar just wraps; no grid
          const el = huds[name];
          const body = name === "palette" ? paletteEl : document.getElementById("tools-body");
          if (!el.classList.contains("sized")) {
            body.style.gridTemplateColumns = "";
            body.style.gridTemplateRows = "";
            el.style.removeProperty("--cell");
            return;
          }
          const n = Math.max(1, hudItems(name).length);
          const W = body.clientWidth;
          const H = body.clientHeight;
          let best = { cell: 0, cols: 1, rows: n };
          for (let cols = 1; cols <= n; cols++) {
            const rows = Math.ceil(n / cols);
            const cell = Math.min((W - (cols - 1) * HUD_GAP) / cols, (H - (rows - 1) * HUD_GAP) / rows);
            if (cell > best.cell) best = { cell, cols, rows };
          }
          // That column count fits the most-square cells; then stretch them to
          // fill the panel so there are no wide margins. --cell is the shorter
          // side, for icon sizing.
          const cw = (W - (best.cols - 1) * HUD_GAP) / best.cols;
          const ch = (H - (best.rows - 1) * HUD_GAP) / best.rows;
          el.style.setProperty("--cell", Math.max(8, Math.floor(Math.min(cw, ch))) + "px");
          body.style.gridTemplateColumns = "repeat(" + best.cols + ", minmax(0, 1fr))";
          body.style.gridTemplateRows = "repeat(" + best.rows + ", minmax(0, 1fr))";
        }

        function applyHudLayouts() {
          applyHudLayout("tools");
          applyHudLayout("palette");
          applyHudLayout("size");
          fitHudGrid("tools");
          fitHudGrid("palette");
        }

        // Every panel gets a resize handle on each corner (the markup has the
        // bottom-right one).
        // ...and side grips, shown only when it spans the full screen height.
        for (const top of document.querySelectorAll(".hud-grip:not(.bottom)")) {
          for (const side of ["left", "right"]) {
            const g = top.cloneNode(false);
            g.classList.add(side);
            top.parentNode.appendChild(g);
          }
        }
        for (const br of document.querySelectorAll('.hud-resize[data-corner="br"]')) {
          for (const corner of ["tl", "tr", "bl"]) {
            const h = br.cloneNode(false);
            h.dataset.corner = corner;
            br.parentNode.appendChild(h);
          }
        }

        let hudDrag = null;
        let hudLastTap = null;
        document.addEventListener("pointerdown", (e) => {
          const handle = e.target.closest && e.target.closest(".hud-grip, .hud-resize");
          if (!handle) return;
          e.preventDefault();
          const name = handle.dataset.hud;
          const L = hudLayout(name);
          const r = huds[name].getBoundingClientRect();
          hudDrag = {
            name,
            handle,
            resize: handle.classList.contains("hud-resize"),
            id: e.pointerId,
            sx: e.clientX,
            sy: e.clientY,
            corner: handle.dataset.corner || "br",
            rect: { left: r.left, top: r.top, right: r.right, bottom: r.bottom },
            // Where in the corner it was grabbed, so the corner stays under the pointer.
            offX: e.clientX - ((handle.dataset.corner || "br")[1] === "l" ? r.left : r.right),
            offY: e.clientY - ((handle.dataset.corner || "br")[0] === "t" ? r.top : r.bottom),
            // Moving or resizing leaves the default spot from exactly where it is.
            x: L.x == null ? r.left : L.x,
            y: L.x == null ? r.top : L.y,
            w: r.width,
            h: r.height,
            moved: false,
          };
          try {
            handle.setPointerCapture(e.pointerId);
          } catch (_) {}
        });

        window.addEventListener("pointermove", (e) => {
          const d = hudDrag;
          if (!d || e.pointerId !== d.id) return;
          const dx = e.clientX - d.sx;
          const dy = e.clientY - d.sy;
          if (Math.hypot(dx, dy) > 4) d.moved = true;
          const L = hudLayout(d.name);
          if (d.resize) {
            // The grabbed corner tracks the pointer; the opposite corner stays put.
            if (!d.moved) return;
            const min = HUD_MIN[d.name] || { w: HUD_MIN_W, h: HUD_MIN_H };
            let { left, top, right, bottom } = d.rect;
            const px = e.clientX - d.offX;
            const py = e.clientY - d.offY;
            if (d.corner[1] === "l") left = Math.max(0, Math.min(px, right - min.w));
            else right = Math.min(window.innerWidth, Math.max(px, left + min.w));
            if (d.corner[0] === "t") top = Math.max(0, Math.min(py, bottom - min.h));
            else bottom = Math.min(window.innerHeight, Math.max(py, top + min.h));
            // Edges that come close to the screen edge snap onto it.
            const W = window.innerWidth;
            const H = window.innerHeight;
            if (d.corner[1] === "l" && left < state.hudSnap) left = 0;
            if (d.corner[1] === "r" && right > W - state.hudSnap) right = W;
            if (d.corner[0] === "t" && top < state.hudSnap) top = 0;
            if (d.corner[0] === "b" && bottom > H - state.hudSnap) bottom = H;
            L.x = left;
            L.y = top;
            L.w = right - left;
            L.h = bottom - top;
          } else {
            const el = huds[d.name];
            const w = el.offsetWidth;
            const h = el.offsetHeight;
            let x = d.x + dx;
            let y = d.y + dy;
            if (x < state.hudSnap) x = 0;
            else if (x + w > window.innerWidth - state.hudSnap) x = window.innerWidth - w;
            if (y < state.hudSnap) y = 0;
            else if (y + h > window.innerHeight - state.hudSnap) y = window.innerHeight - h;
            L.x = x;
            L.y = y;
          }
          applyHudLayout(d.name);
          fitHudGrid(d.name);
        });

        // Refit when buttons appear/disappear or swatches are added/removed.
        if (window.MutationObserver) {
          new MutationObserver(() => fitHudGrid("tools")).observe(document.getElementById("tools-body"), {
            subtree: true,
            attributes: true,
            attributeFilter: ["hidden"],
          });
          new MutationObserver(() => fitHudGrid("palette")).observe(paletteEl, { childList: true });
        }

        const endHudDrag = (e) => {
          const d = hudDrag;
          if (!d || e.pointerId !== d.id) return;
          hudDrag = null;
          if (!d.moved) {
            // Double-tap the grip to put the panel back; the corner to reset its size.
            const now = performance.now();
            if (hudLastTap && hudLastTap.handle === d.handle && now - hudLastTap.t < HUD_DOUBLE_TAP_MS) {
              const L = hudLayout(d.name);
              if (d.resize) {
                L.w = null;
                L.h = null;
              } else {
                L.x = null;
                L.y = null;
              }
              hudLastTap = null;
            } else {
              hudLastTap = { handle: d.handle, t: now };
            }
          }
          applyHudLayouts();
          saveSettings();
        };
        window.addEventListener("pointerup", endHudDrag);
        window.addEventListener("pointercancel", endHudDrag);
        window.addEventListener("resize", applyHudLayouts);

        // Press and hold a tool to select it and open its settings section.
        const TOOL_HOLD_MS = 500;
        const TOOL_SETTINGS = {
          eyedropper: "settings-eyedropper",
          link: "settings-map",
        };

        // Collapsed sections are remembered (by data-section key).
        document.getElementById("settings-close").addEventListener("click", () => setSettingsOpen(false));
        for (const sec of settingsPanel.querySelectorAll(".settings-section")) {
          sec.addEventListener("toggle", () => {
            const k = sec.dataset.section;
            const set = new Set(state.settingsCollapsed);
            if (sec.open) set.delete(k);
            else set.add(k);
            state.settingsCollapsed = [...set];
            saveSettings();
          });
        }
        function syncSettingsSections() {
          for (const sec of settingsPanel.querySelectorAll(".settings-section")) {
            sec.open = !state.settingsCollapsed.includes(sec.dataset.section);
          }
        }
        let toolHold = null;
        let suppressToolClickUntil = 0;

        function openToolSettings(tool) {
          setTool(tool);
          setSettingsOpen(true);
          const label = document.getElementById(TOOL_SETTINGS[tool]);
          if (!label) return;
          const section = label.closest("details");
          if (section && !section.open) section.open = true;
          const body = settingsPanel.querySelector(".settings-body");
          body.scrollTop = section.offsetTop - body.offsetTop - 4;
          label.classList.add("flash");
          setTimeout(() => label.classList.remove("flash"), 900);
        }

        huds.tools.addEventListener("pointerdown", (e) => {
          const btn = e.target.closest(".tool[id^='tool-']");
          if (!btn) return;
          if (toolHold) clearTimeout(toolHold.timer);
          const h = { id: e.pointerId, x: e.clientX, y: e.clientY };
          h.timer = setTimeout(() => {
            if (toolHold !== h) return;
            toolHold = null;
            suppressToolClickUntil = performance.now() + 1000; // the release isn't a tap
            openToolSettings(btn.id.slice(5));
          }, TOOL_HOLD_MS);
          toolHold = h;
        });
        window.addEventListener("pointermove", (e) => {
          if (toolHold && e.pointerId === toolHold.id && Math.hypot(e.clientX - toolHold.x, e.clientY - toolHold.y) > 10) {
            clearTimeout(toolHold.timer);
            toolHold = null;
          }
        });
        const endToolHold = (e) => {
          if (toolHold && e.pointerId === toolHold.id) {
            clearTimeout(toolHold.timer);
            toolHold = null;
          }
        };
        window.addEventListener("pointerup", endToolHold);
        window.addEventListener("pointercancel", endToolHold);
        huds.tools.addEventListener(
          "click",
          (e) => {
            if (performance.now() < suppressToolClickUntil && e.target.closest(".tool[id^='tool-']")) {
              e.preventDefault();
              e.stopPropagation();
              suppressToolClickUntil = 0;
            }
          },
          true
        );
        huds.tools.addEventListener("contextmenu", (e) => {
          if (e.target.closest(".tool[id^='tool-']")) e.preventDefault();
        });

        function setSettingsOpen(open) {
          settingsPanel.classList.toggle("open", open);
          settingsPanel.hidden = !open;
          settingsBtn.classList.toggle("active", open);
          settingsBtn.setAttribute("aria-pressed", open ? "true" : "false");
          if (!open && colorPicker.open && settingsPanel.contains(colorPicker.anchor)) {
            closeColorPicker();
          }
        }
        settingsBtn.addEventListener("click", () => {
          setSettingsOpen(!settingsPanel.classList.contains("open"));
        });
        // Swallow a pointerdown and the click that follows it.
        let swallowClickUntil = 0;
        function swallowTap(e) {
          e.preventDefault();
          e.stopPropagation();
          swallowClickUntil = performance.now() + 600;
        }
        window.addEventListener(
          "click",
          (e) => {
            if (performance.now() < swallowClickUntil) {
              e.preventDefault();
              e.stopPropagation();
              swallowClickUntil = 0;
            }
          },
          true
        );

        // Any interaction outside settings (and the color picker it opened) closes it.
        document.addEventListener(
          "pointerdown",
          (e) => {
            if (!settingsPanel.classList.contains("open")) return;
            const t = e.target;
            if (settingsPanel.contains(t) || settingsBtn.contains(t)) return;
            if (colorPopover.contains(t) || legacyDialog.contains(t)) return;
            // The tap only closes settings: it doesn't also reach a tool, the
            // canvas or anything else underneath.
            setSettingsOpen(false);
            swallowTap(e);
          },
          true
        );

        // Press or drag anywhere on the size bar: the position sets the size.
        let sizeDragId = null;
        function sizeFromPointer(e) {
          const r = sizeControls.getBoundingClientRect();
          const portrait = sizeHud.classList.contains("portrait");
          const t = portrait ? (r.bottom - e.clientY) / r.height : (e.clientX - r.left) / r.width;
          setBrushSize(1 + Math.round(Math.max(0, Math.min(1, t)) * (BRUSH_MAX - 1)));
        }
        sizeControls.addEventListener("pointerdown", (e) => {
          sizeDragId = e.pointerId;
          try {
            sizeControls.setPointerCapture(e.pointerId);
          } catch (_) {}
          sizeFromPointer(e);
        });
        sizeControls.addEventListener("pointermove", (e) => {
          if (e.pointerId === sizeDragId) sizeFromPointer(e);
        });
        const endSizeDrag = (e) => {
          if (e.pointerId === sizeDragId) sizeDragId = null;
        };
        sizeControls.addEventListener("pointerup", endSizeDrag);
        sizeControls.addEventListener("pointercancel", endSizeDrag);
        sizeControls.addEventListener("keydown", (e) => {
          const step = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
          if (!step) return;

        brushBtn.addEventListener("click", () => setTool("brush"));
        eraserBtn.addEventListener("click", () => setTool("eraser"));
        lineBtn.addEventListener("click", () => setTool("line"));
        selectBtn.addEventListener("click", () => setTool("select"));
        eyedropperBtn.addEventListener("click", () => setTool("eyedropper"));
        linkBtn.addEventListener("click", () => setTool("link"));
        undoBtn.addEventListener("click", () => undo());
        redoBtn.addEventListener("click", () => redo());

        window.addEventListener("paste", (e) => {

          if (map) {

        // Text editing (caret, selection, magnifier, copy/paste) is only on while
        // a text field has focus; the native plugin turns those gestures off
        // otherwise so the magnifier never appears over the drawing UI.
        const NON_TEXT_INPUTS = ["checkbox", "radio", "range", "button", "color", "file", "submit"];
        function isTextField(el) {
          return (
            !!el &&
            (el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && !NON_TEXT_INPUTS.includes(el.type)))
          );
        }
        function setNativeTextInput(on) {
          const plugin = native && native.PencilSqueeze;
          if (plugin && typeof plugin.setTextInput === "function") {
            plugin.setTextInput({ enabled: on }).catch(() => {});
          }
        }
        document.addEventListener("focusin", (e) => {
          if (!isTextField(e.target)) return;
          setNativeTextInput(true);
          setTimeout(liftForKeyboard, 50);
        });
        document.addEventListener("focusout", (e) => {
          if (isTextField(e.target) && !isTextField(e.relatedTarget)) setNativeTextInput(false);
          setTimeout(liftForKeyboard, 50);
        });
        setNativeTextInput(false);

        // The keyboard overlays the app (the page itself never scrolls). If it
        // covers the field being edited, slide just that field's window up.
        const KB_GAP = 12;
        const LIFTABLE = ".hud-settings, .palettes-dialog, .legacy-dialog, .color-popover, .hud";
        let keyboardHeight = 0;
        let liftedEl = null;
        function liftForKeyboard() {
          if (liftedEl) {
            liftedEl.style.translate = "";
            liftedEl = null;
          }
          const field = document.activeElement;
          if (!keyboardHeight || !isTextField(field)) return;
          const win = field.closest(LIFTABLE);
          if (!win) return;
          const keyboardTop = window.innerHeight - keyboardHeight;
          if (field.getBoundingClientRect().bottom + KB_GAP <= keyboardTop) return;
          // The field is covered: lift the window so its bottom sits on the
          // keyboard, without pushing its top off screen.
          const r = win.getBoundingClientRect();
          const shift = Math.min(r.bottom - keyboardTop, Math.max(0, r.top - 8));
          if (shift <= 0) return;
          win.style.translate = "0 " + -shift + "px";
          liftedEl = win;
        }
        if (native && native.PencilSqueeze && native.PencilSqueeze.addListener) {
          native.PencilSqueeze.addListener("keyboard", (ev) => {
            keyboardHeight = (ev && ev.height) || 0;
            liftForKeyboard();
          });
        } else if (window.visualViewport) {
          // Browser fallback: the visual viewport shrinks by the keyboard.
          window.visualViewport.addEventListener("resize", () => {
            keyboardHeight = Math.max(0, window.innerHeight - window.visualViewport.height);
            liftForKeyboard();
          });
        }

        // Never start a text selection outside text fields (that's what brings
        // up the iPadOS magnifier).
        document.addEventListener("selectstart", (e) => {
          if (!isTypingTarget(e.target)) e.preventDefault();

        canvas.addEventListener("contextmenu", (e) => e.preventDefault());

        function startApp() {
          applySchemeCanvasDefaults();
          loadSettings();
          ensurePalettes();
          if (state.followSystem) Object.assign(state, state.schemeColors[currentScheme()]);
          syncSettingsUi();
          syncSettingsSections();
          applyHudLayouts();
          syncSizeHud();
          buildPalette();
          // Apply tool UI without wiping restored selection
          brushBtn.classList.toggle("active", state.tool === "brush");
          eraserBtn.classList.toggle("active", state.tool === "eraser");
          lineBtn.classList.toggle("active", state.tool === "line");
          selectBtn.classList.toggle("active", state.tool === "select");
          eyedropperBtn.classList.toggle("active", state.tool === "eyedropper");
          brushBtn.setAttribute("aria-pressed", state.tool === "brush" ? "true" : "false");
          eraserBtn.setAttribute("aria-pressed", state.tool === "eraser" ? "true" : "false");
          lineBtn.setAttribute("aria-pressed", state.tool === "line" ? "true" : "false");
          selectBtn.setAttribute("aria-pressed", state.tool === "select" ? "true" : "false");
          eyedropperBtn.setAttribute("aria-pressed", state.tool === "eyedropper" ? "true" : "false");
          linkBtn.classList.toggle("active", state.tool === "link");
          linkBtn.setAttribute("aria-pressed", state.tool === "link" ? "true" : "false");

            state.tool === "eyedropper" ? "copy" : state.tool === "link" ? "pointer" : "crosshair";
          resize();
