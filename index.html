      :root {
        --bg0: #f2f2f2;
        --panel: #ffffff;
        --ink: #1a1a1a;
        --muted: #6a6a6a;
        --line: #c8c8c8;
        --accent: #1a1a1a;
        --hud: #ffffff;
        --size-under: #ffffff; /* brush size: below the current size */
        --size-over: #e2e2e2; /* ...and above it */
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg0: #141414;
          --panel: #1c1c1c;
          --ink: #ececec;
          --muted: #8a8a8a;
          --line: #3a3a3a;
          --accent: #ececec;
          --hud: #1c1c1c;
          --size-under: #4a4a4a;
          --size-over: #161616;
        }
      }

      * {
        box-sizing: border-box;
        /* touch-action isn't inherited: without this, double-tapping a button
           (e.g. undo/redo) makes iPadOS zoom the whole page. Elements that need
           "none" still set it with a more specific rule. */
        touch-action: manipulation;
        /* No iPadOS text selection loupe or long-press callout on the UI. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      input[type="text"],
      input[type="number"],
      input:not([type]),
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg0);
        color: var(--ink);
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      #stage {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
        background: var(--bg0);
      }

      #stage.panning,
      #stage.moving {
        cursor: grabbing;
      }

      .hud {
        position: fixed;
        z-index: 2;
        display: flex;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--panel);
      }

      .hud-tools {
        top: 50%;
        left: calc(16px + env(safe-area-inset-left));
        transform: translateY(-50%);
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        padding: 10px;
        width: 66px;
        max-height: calc(100vh - 32px);
        overflow: hidden;
        padding-bottom: 14px;
      }

      /* Toolbar / palette: drag the grip to move, the corner to resize. */
      /* Move handle: a small squircle centred at the top of the panel, with
         a larger invisible touch area. */
      .hud-grip {
        position: absolute;
        top: 5px;
        left: 50%;
        width: 16px;
        height: 16px;
        transform: translateX(-50%);
        border-radius: 6px;
        background: var(--muted);
        opacity: 0.55;
        cursor: grab;
        touch-action: none;
      }

      .hud-grip.bottom {
        top: auto;
        bottom: 5px;
      }

      /* Side grips: only shown when the panel spans the full height (snapped to
         top and bottom), since the top/bottom grips are hidden then. */
      .hud-grip.left,
      .hud-grip.right {
        display: none;
        top: 50%;
        transform: translateY(-50%);
      }

      .hud-grip.left {
        left: 5px;
      }

      .hud-grip.right {
        left: auto;
        right: 5px;
      }

      .hud.snap-t.snap-b .hud-grip.left,
      .hud.snap-t.snap-b .hud-grip.right {
        display: block;
      }

      .hud.snap-t.snap-b.snap-l .hud-grip.left,
      .hud.snap-t.snap-b.snap-r .hud-grip.right {
        display: none;
      }

      /* Snapped edges: no border, square corners, and no handles on that side. */
      .hud.snap-l { border-left-width: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; }
      .hud.snap-r { border-right-width: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; }
      .hud.snap-t { border-top-width: 0; border-top-left-radius: 0; border-top-right-radius: 0; }
      .hud.snap-b { border-bottom-width: 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
      /* Snapped sides lose their grip and every corner touching them. */
      .hud.snap-t .hud-grip:not(.bottom):not(.left):not(.right),
      .hud.snap-b .hud-grip.bottom,
      .hud.snap-l .hud-resize[data-corner$="l"],
      .hud.snap-r .hud-resize[data-corner$="r"],
      .hud.snap-t .hud-resize[data-corner^="t"],
      .hud.snap-b .hud-resize[data-corner^="b"] {
        display: none;
      }

      .hud-grip::after {
        content: "";
        position: absolute;
        inset: -8px -14px;
      }

      .hud-grip:hover {
        opacity: 0.85;
      }

      .hud-tools,
      .hud-palette {
        padding-top: 26px !important;
        padding-bottom: 26px !important;
      }

      .hud-grip:active {
        cursor: grabbing;
      }

      /* Resize handles on all four corners: a 28px touch target with the
         small striped mark drawn in its corner. */
      .hud-resize {
        position: absolute;
        width: 28px;
        height: 28px;
        z-index: 2;
        touch-action: none;
        background-repeat: no-repeat;
        background-size: 16px 16px;
        opacity: 0.7;
        --stripes: transparent 50%, var(--muted) 50%, var(--muted) 58%, transparent 58%, transparent 70%, var(--muted) 70%, var(--muted) 78%, transparent 78%;
      }

      .hud-resize[data-corner="br"] {
        right: 0;
        bottom: 0;
        cursor: nwse-resize;
        background-image: linear-gradient(135deg, var(--stripes));
        background-position: right 1px bottom 1px;
      }

      .hud-resize[data-corner="bl"] {
        left: 0;
        bottom: 0;
        cursor: nesw-resize;
        background-image: linear-gradient(225deg, var(--stripes));
        background-position: left 1px bottom 1px;
      }

      .hud-resize[data-corner="tr"] {
        right: 0;
        top: 0;
        cursor: nesw-resize;
        background-image: linear-gradient(45deg, var(--stripes));
        background-position: right 1px top 1px;
      }

      .hud-resize[data-corner="tl"] {
        left: 0;
        top: 0;
        cursor: nwse-resize;
        background-image: linear-gradient(315deg, var(--stripes));
        background-position: left 1px top 1px;
      }

      /* Toolbar body: a column normally; once the panel has a custom size the
         buttons flow into a grid (columns when tall, rows when wide). */
      .hud-body {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      /* Only the button area scrolls, so the grip and resize corner stay put. */
      .hud-body,
      .hud-palette .palette-grid {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
      }

      .hud.sized {
        max-height: none;
      }

      /* Sized panel: an explicit grid (set from JS) whose cells grow or shrink
         so every button fits. --cell is the cell size in px. */
      .hud.sized .hud-body,
      .hud.sized .palette-grid {
        flex: 1 1 auto;
        min-height: 0;
        display: grid;
        gap: 6px;
        overflow: hidden;
        grid-auto-flow: row; /* always left→right, then top→bottom */
        justify-content: stretch;
        align-content: stretch;
      }

      /* Cells stretch to fill the panel; icons size from the shorter side. */
      .hud-tools.sized .tool {
        width: 100%;
        height: 100%;
      }

      .hud-tools.sized .tool svg {
        width: calc(var(--cell) * 0.5);
        height: calc(var(--cell) * 0.5);
      }

      .hud.sized .hud-body .tool-group:not([hidden]) {
        display: contents;
      }

      .hud.sized .palette-slot {
        width: 100%;
        height: 100%;
        aspect-ratio: auto;
      }

      .hud-palette {
        top: 50%;
        right: calc(16px + env(safe-area-inset-right));
        transform: translateY(-50%);
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        padding: 10px;
        width: 64px;
        max-height: calc(100vh - 32px);
        overflow: hidden;
        padding-bottom: 14px;
      }

      /* Brush size: the whole panel is the slider. The part below the current
         size (left of it when landscape) is lighter; drag anywhere to set it. */
      .hud-size {
        left: 50%;
        bottom: calc(16px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        width: 260px;
        height: 52px;
        padding: 0;
        overflow: hidden;
        background: var(--size-over);
        color: var(--ink);
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .hud-size .size-controls {
        position: absolute;
        inset: 0;
        z-index: 1;
        cursor: pointer;
        touch-action: none;
      }

      .hud-size .size-controls.inactive {
        opacity: 0.45;
      }

      .size-fill {
        position: absolute;
        left: 0;
        bottom: 0;
        background: var(--size-under);
      }

      .size-label {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        color: var(--muted);
      }

      .size-label b {
        color: var(--ink);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .hud-size .hud-grip,
      .hud-size .hud-resize {
        z-index: 2;
      }

      /* Smaller grips hugging the edges so they clear the label. */
      .hud-size .hud-grip {
        top: 3px;
        width: 12px;
        height: 12px;
        border-radius: 4px;
      }

      .hud-size .hud-grip.bottom {
        top: auto;
        bottom: 3px;
      }

      #brush-size {
        display: none;
      }

      .tool-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .tool-group.icons {
        flex-direction: column;
        flex-wrap: nowrap;
        width: auto;
      }

      .panel-label.flash {
        color: var(--ink);
        background: var(--line);
        transition: background 0.6s;
      }

      .hud-tools .tool {
        -webkit-touch-callout: none;
      }

      .panel-label {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .tool {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        margin: 0;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--panel);
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }

      .tool svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .tool.active {
        border-color: var(--ink);
        background: var(--ink);
        color: var(--panel);
      }

      .tool:hover:not(:disabled):not(.active) {
        border-color: var(--muted);
      }

      .tool:disabled {
        opacity: 0.35;
        cursor: default;
      }

      /* Settings: a floating window centred over everything. */
      .hud-settings {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 50;
        display: none;
        flex-direction: column;
        align-items: stretch;
        width: min(320px, calc(100vw - 32px));
        max-height: calc(100vh - 48px);
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      }

      .settings-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 8px 8px 14px;
        border-bottom: 1px solid var(--line);
      }

      .settings-title {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .settings-close {
        width: 32px;
        height: 32px;
        margin: 0;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--bg0);
        color: var(--ink);
        font: inherit;
        font-size: 16px;
        cursor: pointer;
      }

      .settings-body {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px 14px 14px;
        overflow: auto;
      }

      .settings-section {
        border-bottom: 1px solid var(--line);
      }

      .settings-section:last-child {
        border-bottom: 0;
      }

      .settings-section > summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0;
        padding: 10px 0;
        cursor: pointer;
        list-style: none;
      }

      .settings-section > summary::-webkit-details-marker {
        display: none;
      }

      .settings-section > summary::after {
        content: "›";
        font-size: 14px;
        transition: transform 0.15s;
      }

      .settings-section[open] > summary::after {
        transform: rotate(90deg);
      }

      .settings-section > .settings-block {
        padding-bottom: 12px;
      }

      .hud-settings.open {
        display: flex;
      }

      .palette-grid {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .palette-slot {
        position: relative;
        display: block;
        width: 100%;
        aspect-ratio: 1;
        margin: 0;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 2px;
        cursor: pointer;
        overflow: hidden;
        background: #ddd;
        font: inherit;
        color: inherit;
        appearance: none;
        -webkit-appearance: none;
        /* Swatches are draggable (reorder / drag off to delete). */
        touch-action: none;
      }


      /* Catches every pointer while open so nothing underneath reacts. */
      .quick-menu {
        position: fixed;
        inset: 0;
        z-index: 25;
        touch-action: none;
      }

      .qm-svg {
        position: absolute;
        overflow: visible;
        filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.18));
      }

      /* Transforms are driven every pointer move by proximity; the short
         transition just smooths over gaps between events. */
      .qm-item {
        transform-box: fill-box;
        transform-origin: center;
        transition: transform 0.07s linear;
      }

      .qm-arc {
        fill: var(--panel);
        stroke: var(--line);
        stroke-width: 1;
        transition: fill 0.1s, stroke 0.1s, stroke-width 0.1s;
      }

      .qm-icon {
        fill: none;
        stroke: var(--ink);
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .qm-sub {
        transform-box: view-box;
        transform-origin: 50% 50%;
        transition: opacity 0.1s linear, transform 0.1s linear;
      }

      .qm-colors.expanded .qm-arc {
        stroke: var(--ink);
        stroke-width: 2.5;
      }

      .qm-flex .qm-arc {
        stroke-dasharray: 3 3;
      }

      .qm-item.current .qm-arc {
        stroke: var(--ink);
        stroke-width: 1.5;
      }

      .qm-item.empty {
        opacity: 0.35;
      }

      .qm-item.hot .qm-arc {
        stroke: var(--ink);
        stroke-width: 2.5;
      }

      .qm-tool.hot .qm-arc {
        fill: var(--ink);
      }

      .qm-tool.hot .qm-icon {
        stroke: var(--panel);
      }

      .qm-center {
        position: absolute;
        display: grid;
        place-items: center;
        border: 1px dashed var(--line);
        border-radius: 50%;
        background: var(--panel);
        color: var(--muted);
        font-size: 10px;
        line-height: 1.1;
        text-align: center;
        overflow: hidden;
      }

      .palette-slot[data-index] {
        transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
      }

      /* Hover (mouse only; iPadOS keeps :hover stuck after a tap): same
         border cue as tools, plus a slight lift hinting it can be dragged. */
      @media (hover: hover) and (pointer: fine) {
        .palette-slot[data-index]:hover:not(.active):not(.placeholder) {
          border-color: var(--muted);
        }

        .palette-slot[data-index]:hover:not(.placeholder) {
          transform: translateY(-1px);
          box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
          cursor: grab;
        }
      }

      .palette-slot.placeholder {
        opacity: 0.25;
      }

      .palette-slot.placeholder.discarding {
        display: none;
      }

      .palette-ghost {
        position: fixed;
        z-index: 30;
        margin: 0;
        pointer-events: none;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        transform: scale(1.08);
        transition: transform 0.12s, opacity 0.12s;
      }

      .palette-ghost.discard {
        opacity: 0.4;
        transform: scale(0.8) rotate(-8deg);
      }

      .palette-slot.typed::after {
        content: "";
        position: absolute;
        right: 2px;
        bottom: 2px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ink);
        box-shadow: 0 0 0 1px var(--panel);
      }

      .type-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px;
        margin-top: 8px;
      }

      #scheme-row[hidden] {
        display: none;
      }

      #edit-scheme,
      .settings-select {
        margin: 0;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--bg0);
        color: var(--ink);
        font: inherit;
        font-size: 11px;
      }

      .qm-order {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin: 2px 0 0;
        padding: 0;
        list-style: none;
      }

      .qm-order li {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: center;
        gap: 3px;
        font-size: 11px;
      }

      .qm-order li.off {
        color: var(--muted);
        opacity: 0.6;
      }

      .qm-order button {
        width: 22px;
        height: 20px;
        margin: 0;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--bg0);
        color: var(--ink);
        font: inherit;
        font-size: 10px;
        cursor: pointer;
      }

      .qm-order button:disabled {
        opacity: 0.3;
      }

      .type-row[hidden] {
        display: none;
      }

      .color-popover #cp-type {
        text-transform: none;
      }

      .type-row select {
        margin: 0;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--bg0);
        color: var(--ink);
        font: inherit;
        font-size: 11px;
      }

      .hud-status {
        top: calc(16px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: calc(100vw - 32px);
        padding: 6px 10px;
        font-size: 12px;
        white-space: nowrap;
        overflow-x: auto;
      }

      .hud-status[hidden],
      .link-action[hidden],
      .legacy-dialog[hidden] {
        display: none;
      }

      .status-tap {
        cursor: pointer;
        text-decoration: underline dotted;
        text-underline-offset: 3px;
      }

      .hud-status button,
      .settings-btn,
      .link-action {
        margin: 0;
        padding: 3px 8px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--bg0);
        color: var(--ink);
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }

      .link-action {
        position: fixed;
        z-index: 30;
        transform: translate(-50%, -50%);
        min-width: 28px;
        min-height: 28px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      }

      .legacy-dialog {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 70;
        flex-direction: column;
        width: min(420px, calc(100vw - 32px));
        padding: 12px;
      }

      .legacy-dialog textarea {
        box-sizing: border-box;
        width: 100%;
        margin: 6px 0;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--bg0);
        color: var(--ink);
        font: 11px ui-monospace, Menlo, monospace;
      }

      .legacy-dialog pre {
        margin: 0 0 8px;
        font-size: 11px;
        white-space: pre-wrap;
        color: var(--muted);
      }

      .legacy-actions {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
      }

      .palette-slot.copied {
        outline: 2px solid #3a9d5d;
        outline-offset: 1px;
      }

      /* Active swatch: a ring drawn on its own layer inside the swatch, so it
         isn't clipped at panel edges and hover styles can't replace it. */
      .palette-slot.active::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        border-radius: inherit;
        box-shadow: inset 0 0 0 2px var(--ink), inset 0 0 0 3px var(--panel);
        pointer-events: none;
      }

      .palette-slot .idx {
        position: absolute;
        left: 4px;
        top: 3px;
        z-index: 1;
        font-size: 11px;
        line-height: 1;
        color: #fff;
        mix-blend-mode: difference;
        pointer-events: none;
      }

      /* Palettes button: a mini 2×2 of the active palette's first colors. */
      .palette-slot.palette-menu {
        display: grid;
        grid-template: 1fr 1fr / 1fr 1fr;
        gap: 0;
        padding: 0;
        background: var(--line);
      }

      .palette-menu span {
        border-radius: 0;
        min-width: 0;
        min-height: 0;
      }

      .export-menu {
        z-index: 45;
        flex-direction: column;
        gap: 4px;
        min-width: 200px;
        padding: 6px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
      }

      .export-menu[hidden] {
        display: none;
      }

      .export-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        height: 40px;
        margin: 0;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--bg0);
        color: var(--ink);
        font: inherit;
        font-size: 12px;
        text-align: left;
        cursor: pointer;
      }

      .export-item:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .export-item svg {
        flex: none;
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .palettes-dialog {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 55;
        display: flex;
        flex-direction: column;
        width: min(420px, calc(100vw - 32px));
        max-height: calc(100vh - 48px);
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      }

      .palettes-dialog[hidden] {
        display: none;
      }

      .palettes-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 14px;
        overflow: auto;
      }

      .pal-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 2px;
        cursor: pointer;
      }

      .pal-row.active {
        border-color: var(--ink);
        box-shadow: inset 3px 0 0 var(--ink);
      }

      .pal-row.drop {
        background: var(--line);
      }

      .pal-head {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px;
        align-items: center;
      }

      .pal-name {
        min-width: 0;
        margin: 0;
        padding: 4px 6px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--bg0);
        color: var(--ink);
        font: inherit;
        font-size: 12px;
      }

      .pal-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        min-height: 26px;
      }

      .pal-swatch {
        width: 26px;
        height: 26px;
        border: 1px solid var(--line);
        border-radius: 2px;
        cursor: grab;
        touch-action: none;
      }

      .pal-ghost {
        position: fixed;
        z-index: 80;
        width: 30px;
        height: 30px;
        border: 2px solid #fff;
        border-radius: 2px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        pointer-events: none;
        transform: translate(-50%, -50%);
      }

      .palettes-foot {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 14px;
        border-top: 1px solid var(--line);
      }

      .palettes-hint {
        flex: 1;
        color: var(--muted);
        font-size: 10px;
      }

      .palette-slot.palette-add {
        display: grid;
        place-items: center;
        background: transparent;
        border-style: dashed;
        color: var(--muted);
        font-size: 22px;
        line-height: 1;
        font-weight: 400;
      }

      .palette-slot.palette-add:hover {
        border-color: var(--ink);
        color: var(--ink);
      }

      .palette-slot.palette-add .idx {
        display: none;
      }


      .settings-block {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .settings-row {
        display: grid;
        grid-template-columns: 64px 1fr;
        align-items: center;
        gap: 8px;
      }

      .settings-row.wide {
        grid-template-columns: 1fr;
      }

      .settings-row label {
        color: var(--muted);
        font-size: 11px;
      }

      .settings-row input[type="number"],
      .settings-row input[type="text"] {
        width: 100%;
        min-width: 0;
        margin: 0;
        padding: 7px 8px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--bg0);
        color: var(--ink);
        font: inherit;
        font-size: 12px;
        -moz-appearance: textfield;
      }

      .settings-row input[type="number"]::-webkit-outer-spin-button,
      .settings-row input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .color-field {
        height: 30px;
      }

      .color-swatch {
        display: block;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 2px;
        cursor: pointer;
        background: #888;
      }

      .color-swatch:hover {
        border-color: var(--muted);
      }

      .color-popover {
        position: fixed;
        z-index: 60; /* above the settings window */
        display: none;
        flex-direction: column;
        gap: 10px;
        width: 200px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--panel);
        color: var(--ink);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      }

      .color-popover.open {
        display: flex;
      }

      .color-popover .sv-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        border: 1px solid var(--line);
        border-radius: 2px;
        cursor: crosshair;
        touch-action: none;
      }

      .color-popover .sv-wrap canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .color-popover .sv-cursor {
        position: absolute;
        width: 12px;
        height: 12px;
        margin: -6px 0 0 -6px;
        border: 2px solid #fff;
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55);
        pointer-events: none;
      }

      .color-popover .slider-stack {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .color-popover .slider-row {
        display: grid;
        grid-template-columns: 28px 1fr 40px;
        gap: 8px;
        align-items: center;
      }

      .color-popover .slider-row label {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .color-popover .slider-wrap {
        position: relative;
        height: 14px;
        border: 1px solid var(--line);
        border-radius: 2px;
        cursor: pointer;
        touch-action: none;
      }

      .color-popover .hue-wrap {
        background: linear-gradient(
          to right,
          #ff0000,
          #ffff00,
          #00ff00,
          #00ffff,
          #0000ff,
          #ff00ff,
          #ff0000
        );
      }

      .color-popover .slider-cursor {
        position: absolute;
        top: 50%;
        width: 10px;
        height: 18px;
        margin: -9px 0 0 -5px;
        border: 2px solid #fff;
        border-radius: 2px;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55);
        pointer-events: none;
        background: transparent;
      }

      .color-popover .hex-row {
        display: grid;
        grid-template-columns: 28px 1fr;
        gap: 8px;
        align-items: center;
      }

      .color-popover .hex-preview {
        width: 28px;
        height: 28px;
        border: 1px solid var(--line);
        border-radius: 2px;
      }

      .color-popover .num-input {
        width: 100%;
        margin: 0;
        padding: 2px 4px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--bg0);
        color: var(--ink);
        font: inherit;
        font-size: 11px;
        text-align: right;
        -moz-appearance: textfield;
      }

      .color-popover .num-input::-webkit-inner-spin-button,
      .color-popover .num-input::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .color-popover .hex-input {
        width: 100%;
        min-width: 0;
        margin: 0;
        padding: 7px 8px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--bg0);
        color: var(--ink);
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .grid-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 11px;
        cursor: pointer;
      }

      .grid-toggle input {
        accent-color: var(--ink);
      }

      .export-link.tool {
        text-decoration: none;
        color: inherit;
      }

      .export-link[hidden],
      #export-copied[hidden] {
        display: none;
      }

      #export-copied:disabled {
        opacity: 1;
        cursor: default;
      }

      #export-copied.active-ok {
        color: var(--ink);
      }

    </style>
  </head>

    <div class="hud hud-settings" id="settings-panel" role="dialog" aria-label="Settings" hidden>
      <div class="settings-head">
        <span class="settings-title">Settings</span>
        <button type="button" class="settings-close" id="settings-close" aria-label="Close settings">×</button>
      </div>
      <div class="settings-body">
        <details class="settings-section" data-section="canvas" open>
          <summary class="panel-label">Canvas</summary>
          <div class="settings-block">
            <label class="grid-toggle">
              <input type="checkbox" id="follow-system" />

            </label>
            <div class="settings-row" id="scheme-row" hidden>

                <option value="light">light mode colors</option>
                <option value="dark">dark mode colors</option>
              </select>
            </div>
            <div class="settings-row">
              <label for="bg-color">bg</label>
              <div class="color-field">
                <button type="button" class="color-swatch" id="bg-color" data-color="#f2f2f2" style="background:#f2f2f2" aria-label="Background color"></button>

            </div>
            <div class="settings-row">
              <label for="accent-color">acc</label>

                <button type="button" class="color-swatch" id="accent-color" data-color="#1a1a1a" style="background:#1a1a1a" aria-label="Accent color"></button>

            </div>
          </div>

              <input type="checkbox" id="pixel-grid-enabled" checked />

              <label for="pixel-grid-color">col</label>
              <div class="color-field">
                <button type="button" class="color-swatch" id="pixel-grid-color" data-color="#d0d0d0" style="background:#d0d0d0" aria-label="Pixel grid color"></button>

            </div>
          </div>
        </details>

        <details class="settings-section" data-section="pixel-labels" open>
          <summary class="panel-label">Pixel labels</summary>
          <div class="settings-block">
            <label class="grid-toggle">
              <input type="checkbox" id="hue-labels-enabled" />
              hue
            </label>
            <label class="grid-toggle">
              <input type="checkbox" id="sat-labels-enabled" />
              sat
            </label>

        <details class="settings-section" data-section="panels" open>
          <summary class="panel-label">Panels</summary>

            <div class="settings-row">
              <label for="hud-snap" title="Panels snap flush to the screen edge when this close (0 = off)">snap px</label>
              <input id="hud-snap" type="number" inputmode="numeric" min="0" max="80" step="1" value="16" />
            </div>
          </div>

        <details class="settings-section" data-section="eyedropper" open>
          <summary class="panel-label" id="settings-eyedropper">Eyedropper</summary>
          <div class="settings-block">
            <div class="settings-row">
              <label for="loupe-zoom" title="Magnifier zoom, relative to the current view">zoom ×</label>
              <input id="loupe-zoom" type="number" inputmode="decimal" min="1" max="8" step="0.5" value="3" />
            </div>
            <div class="settings-row">
              <label for="loupe-size" title="Magnifier diameter in points">size</label>
              <input id="loupe-size" type="number" inputmode="numeric" min="60" max="300" step="4" value="112" />
            </div>
            <div class="settings-row">
              <label for="loupe-mode" title="Where the magnifier appears">place</label>
              <select id="loupe-mode" class="settings-select">
                <option value="follow">follow cursor</option>
                <option value="pin">pin top right</option>
              </select>
            </div>
            <div class="settings-row">
              <label for="loupe-hold" title="How long to hold before the magnifier appears (ms)">hold</label>
              <input id="loupe-hold" type="number" inputmode="numeric" min="0" max="2000" step="50" value="250" />

        <details class="settings-section" data-section="quick-menu" open>
          <summary class="panel-label" id="settings-quickmenu">Quick menu</summary>
          <div class="settings-block">
            <div class="settings-row">

        </details>

        <details class="settings-section" data-section="map" open>
          <summary class="panel-label" id="settings-map">Map</summary>

            <label class="grid-toggle">
              <input type="checkbox" id="show-links-outside" checked />

            <label class="grid-toggle">
              <input type="checkbox" id="show-unknown-outside" checked />

            </label>
            <button type="button" class="settings-btn" id="btn-legacy">convert legacy links…</button>

        <details class="settings-section" data-section="major-grid" open>

              <input id="grid-x" type="number" inputmode="numeric" min="1" max="512" step="1" value="8" />
            </div>
            <div class="settings-row">
              <label for="grid-y">y</label>
              <input id="grid-y" type="number" inputmode="numeric" min="1" max="512" step="1" value="8" />

            <div class="settings-row">
              <label for="grid-color">col</label>
              <div class="color-field">
                <button type="button" class="color-swatch" id="grid-color" data-color="#b0b0b0" style="background:#b0b0b0" aria-label="Major grid color"></button>
              </div>
            </div>
            <div class="settings-row">
              <label for="grid-thick">w</label>
              <input id="grid-thick" type="number" inputmode="decimal" min="0.5" max="8" step="0.5" value="1" />
            </div>
          </div>
        </details>
      </div>
    </div>

    <div class="hud hud-palette" id="hud-palette" aria-label="Color palette">
      <div class="hud-grip" data-hud="palette" title="Drag to move · double-tap to reset" aria-label="Move palette"></div>
      <div class="palette-grid" id="palette"></div>
      <div class="hud-grip bottom" data-hud="palette" title="Drag to move · double-tap to reset" aria-label="Move palette"></div>
      <div class="hud-resize" data-corner="br" data-hud="palette" title="Drag to resize · double-tap to reset" aria-label="Resize palette"></div>
    </div>

    <div class="hud hud-size" id="size-hud" aria-label="Brush size">
      <div class="hud-grip" data-hud="size" title="Drag to move · double-tap to reset" aria-label="Move size bar"></div>

      <div class="hud-grip bottom" data-hud="size" title="Drag to move · double-tap to reset" aria-label="Move size bar"></div>
      <div class="hud-resize" data-corner="br" data-hud="size" title="Drag to resize · double-tap to reset" aria-label="Resize size bar"></div>
    </div>

    <div class="quick-menu" id="quick-menu" hidden></div>

      <div class="sv-wrap" id="cp-sv">
        <canvas id="cp-sv-canvas" width="180" height="180"></canvas>
        <div class="sv-cursor" id="cp-sv-cursor"></div>
      </div>
      <div class="slider-stack">
        <div class="slider-row">
          <label for="cp-hue">hue</label>
          <div class="slider-wrap hue-wrap" id="cp-hue">
            <div class="slider-cursor" id="cp-hue-cursor"></div>
          </div>
          <input class="num-input" id="cp-hue-num" type="number" min="0" max="360" step="1" inputmode="numeric" aria-label="hue value" />
        </div>
        <div class="slider-row">
          <label for="cp-sat">sat</label>
          <div class="slider-wrap" id="cp-sat">
            <div class="slider-cursor" id="cp-sat-cursor"></div>
          </div>
          <input class="num-input" id="cp-sat-num" type="number" min="0" max="100" step="1" inputmode="numeric" aria-label="sat value" />

        <div class="slider-row">
          <label for="cp-bri">bri</label>
          <div class="slider-wrap" id="cp-bri">
            <div class="slider-cursor" id="cp-bri-cursor"></div>
          </div>
          <input class="num-input" id="cp-bri-num" type="number" min="0" max="100" step="1" inputmode="numeric" aria-label="bri value" />

        <button type="button" class="settings-btn" id="legacy-cancel">cancel</button>
        <button type="button" class="settings-btn" id="legacy-apply">apply</button>
      </div>
    </div>

    <script>
      (() => {

          cap && typeof cap.isNativePlatform === "function" && cap.isNativePlatform()

        // iOS can clear a web view's localStorage when storage is low, so the

        function writeNativeSettings(json) {
          if (!native || !native.Filesystem) return;
          native.Filesystem.writeFile({
            path: NATIVE_SETTINGS_FILE,
            data: json,
            directory: "DATA",
            encoding: "utf8",
          }).catch(() => {});
        }

        async function readNativeSettings() {
          if (!native || !native.Filesystem) return;

            const res = await native.Filesystem.readFile({
              path: NATIVE_SETTINGS_FILE,

              encoding: "utf8",
            });
            if (typeof res.data === "string" && res.data) {

        }
        const DEFAULT_PALETTE = [

        const state = {

          palettes: [],

          tileTypes: {}, // hex → { type, role? }
          links: [],

          linkSel: null, // selected source tile (Link tool)
          linkSelLink: null, // selected link id (Link tool)
          linkFlash: null,
          eyeHold: null, // { id, x, y, active, touch } while pressing with the eyedropper
          linkDrag: null, // { from, sx, sy, cx, cy, moved, wasSel } while dragging a link
          toast: null,

        // Capture can throw (e.g. the pointer already ended); never let it
        // abort the rest of an input handler.
        function capturePointer(el, id) {
          try {
            el.setPointerCapture(id);
          } catch (_) {}
        }

        function key(x, y) {
          return x + "," + y;
        }

        function parseKey(k) {
          const comma = k.indexOf(",");
          return { x: +k.slice(0, comma), y: +k.slice(comma + 1) };
        }

        
        function prefersDark() {
          return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        }

        function currentScheme() {
          return prefersDark() ? "dark" : "light";
        }

        function applySchemeCanvasDefaults() {
          Object.assign(state, SCHEME_DEFAULTS[currentScheme()]);
        }

        // With "match system" on, the live canvas colors follow the system
        // appearance; otherwise they're the single fixed set.
        function applySystemScheme() {
          if (!state.followSystem) return;
          Object.assign(state, state.schemeColors[currentScheme()]);
          syncSettingsUi();
          saveSettings();
          state.needsDraw = true;
        }

        function normalizeHex(c) {
          const s = String(c || "").trim().toLowerCase();
          if (/^#[0-9a-f]{6}$/.test(s)) return s;
          if (/^#[0-9a-f]{3}$/.test(s)) {
            return "#" + s[1] + s[1] + s[2] + s[2] + s[3] + s[3];
          }
          return s;
        }

        function hexToRgb(hex) {
          const h = normalizeHex(hex);
          if (!/^#[0-9a-f]{6}$/.test(h)) return { r: 0, g: 0, b: 0 };
          return {
            r: parseInt(h.slice(1, 3), 16),
            g: parseInt(h.slice(3, 5), 16),
            b: parseInt(h.slice(5, 7), 16),
          };
        }

        function rgbToHex(r, g, b) {
          const to = (n) =>
            Math.max(0, Math.min(255, Math.round(n)))
              .toString(16)
              .padStart(2, "0");
          return "#" + to(r) + to(g) + to(b);
        }

        function rgbToHsv(r, g, b) {
          r /= 255;
          g /= 255;
          b /= 255;
          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);
          const d = max - min;
          let h = 0;
          if (d) {
            if (max === r) h = ((g - b) / d) % 6;
            else if (max === g) h = (b - r) / d + 2;
            else h = (r - g) / d + 4;
            h *= 60;
            if (h < 0) h += 360;
          }
          return { h, s: max === 0 ? 0 : d / max, v: max };
        }

        function hsvToRgb(h, s, v) {
          const c = v * s;
          const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
          const m = v - c;
          let r = 0, g = 0, b = 0;
          if (h < 60) [r, g, b] = [c, x, 0];
          else if (h < 120) [r, g, b] = [x, c, 0];
          else if (h < 180) [r, g, b] = [0, c, x];
          else if (h < 240) [r, g, b] = [0, x, c];
          else if (h < 300) [r, g, b] = [x, 0, c];
          else [r, g, b] = [c, 0, x];
          return { r: (r + m) * 255, g: (g + m) * 255, b: (b + m) * 255 };
        }

        function hsvToHex(h, s, v) {
          const { r, g, b } = hsvToRgb(h, s, v);
          return rgbToHex(r, g, b);
        }

        function setSwatchEl(el, hex) {
          if (!el) return;
          const h = normalizeHex(hex);
          el.dataset.color = h;
          el.style.background = h;
        }

        function getSwatchEl(el) {
          return normalizeHex(el && (el.dataset.color || ""));
        }

        function withAlpha(hex, alpha) {
          const h = normalizeHex(hex);
          if (!/^#[0-9a-f]{6}$/.test(h)) return hex;
          const r = parseInt(h.slice(1, 3), 16);
          const g = parseInt(h.slice(3, 5), 16);
          const b = parseInt(h.slice(5, 7), 16);
          return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
        }

        function clampInt(n, lo, hi, fallback) {
          if (n === "" || n == null) return fallback;
          const v = Math.round(Number(n));
          if (!Number.isFinite(v)) return fallback;
          return Math.max(lo, Math.min(hi, v));
        }

        function clampFloat(n, lo, hi, fallback) {
          if (n === "" || n == null) return fallback;
          const v = Number(n);
          if (!Number.isFinite(v)) return fallback;
          return Math.max(lo, Math.min(hi, v));
        }

                let saveTimer = null;
        let hasSavedCamera = false;

        function serializePixelMap(map) {
          const out = [];
          if (!map) return out;
          for (const [k, c] of map) out.push(k + "|" + c);
          return out;
        }

        function deserializePixelMap(entries) {
          const map = new Map();
          if (!Array.isArray(entries)) return map;
          for (const entry of entries) {
            if (typeof entry === "string") {
              const sep = entry.indexOf("|");
              if (sep < 0) continue;
              map.set(entry.slice(0, sep), entry.slice(sep + 1));
            } else if (Array.isArray(entry) && entry.length >= 2) {
              map.set(String(entry[0]), String(entry[1]));
            }
          }
          return map;
        }


        function cloneSelection(sel) {
          return sel ? { x: sel.x, y: sel.y, w: sel.w, h: sel.h } : null;
        }

        function cloneFloat(flt) {
          if (!flt) return null;
          return {
            x: flt.x,
            y: flt.y,
            w: flt.w,
            h: flt.h,
            pixels: new Map(flt.pixels),
          };
        }

        // Palette is only captured for palette edits, so undoing a stroke
        // never reverts color changes made since.
        function captureHistory(withPalette) {
          const snap = {
            pixels: new Map(pixels),
            float: cloneFloat(state.float),
            selection: cloneSelection(state.selection),
            links: cloneLinks(state.links),
            nextLinkId: state.nextLinkId,
          };
          if (withPalette) {
            syncActivePalette();
            snap.palettes = state.palettes.map((p) => ({ ...p, colors: p.colors.slice() }));
            snap.activePalette = state.activePalette;
            snap.palette = state.palette.slice();
            snap.paletteIndex = state.paletteIndex;
            snap.tileTypes = JSON.parse(JSON.stringify(state.tileTypes));
          }
          return snap;
        }

        function applyHistory(snap) {
          pixels.clear();
          for (const [k, c] of snap.pixels) pixels.set(k, c);
          state.float = snap.float;
          state.selection = snap.selection;
          state.links = snap.links;
          state.nextLinkId = Math.max(state.nextLinkId, snap.nextLinkId);
          state.linkSel = null;
          state.linkSelLink = null;
          if (snap.palette) {
            if (snap.palettes) {
              state.palettes = snap.palettes;
              state.activePalette = snap.activePalette;
            }
            state.palette = snap.palette;
            state.paletteIndex = snap.paletteIndex;
            syncActivePalette();
            if (palettesDialog && !palettesDialog.hidden) renderPalettesDialog();
            state.tileTypes = snap.tileTypes;
            state.color = state.palette[state.paletteIndex];
            closeColorPicker();
            buildPalette();
          }
          state.drawing = false;
          state.lining = false;
          state.lineStart = null;
          state.lineEnd = null;
          state.selecting = false;
          state.moving = false;
          state.moveGrab = null;
          state.lastWorld = null;
          state.selectAnchor = null;
          canvas.classList.remove("panning");
          canvas.classList.remove("moving");
          syncActionButtons();
          saveSettings();
          state.needsDraw = true;
        }

        function pushUndo(withPalette) {
          undoStack.push(captureHistory(withPalette));
          if (undoStack.length > UNDO_LIMIT) undoStack.shift();
          redoStack.length = 0;
          syncActionButtons();
        }

        function undo() {
          if (!undoStack.length) return;
          const snap = undoStack.pop();
          redoStack.push(captureHistory(!!snap.palette));
          if (redoStack.length > UNDO_LIMIT) redoStack.shift();
          applyHistory(snap);
        }

        function redo() {
          if (!redoStack.length) return;
          const snap = redoStack.pop();
          undoStack.push(captureHistory(!!snap.palette));
          if (undoStack.length > UNDO_LIMIT) undoStack.shift();
          applyHistory(snap);
        }

        function saveSettings(immediate) {
          const write = () => {
            saveTimer = null;
            checkLinks();
            try {
              const json = JSON.stringify({
                  v: 2,
                  palette: state.palette,
                  paletteIndex: state.paletteIndex,
                  palettes: (syncActivePalette(), state.palettes),
                  activePalette: state.activePalette,
                  bgColor: state.bgColor,
                  accentColor: state.accentColor,
                  pixelGridEnabled: state.pixelGridEnabled,
                  hueLabelsEnabled: state.hueLabelsEnabled,
                  hudSnap: state.hudSnap,
                  settingsCollapsed: state.settingsCollapsed,
                  qmScale: state.qmScale,
                  qmToolOrder: state.qmToolOrder,
                  qmToolCount: state.qmToolCount,
                  qmColorCount: state.qmColorCount,
                  hudLayout: state.hudLayout,
                  loupeZoom: state.loupeZoom,
                  loupeSize: state.loupeSize,
                  loupeMode: state.loupeMode,
                  loupeHoldMs: state.loupeHoldMs,
                  showLinksOutside: state.showLinksOutside,
                  showUnknownOutside: state.showUnknownOutside,
                  followSystem: state.followSystem,
                  schemeColors: state.schemeColors,
                  tileTypes: state.tileTypes,
                  links: serializeLinks(),
                  nextLinkId: state.nextLinkId,
                  mapName: state.mapName,
                  legacyConfig: state.legacyConfig,
                  satLabelsEnabled: state.satLabelsEnabled,
                  pixelGridColor: state.pixelGridColor,
                  pixelGridThick: state.pixelGridThick,
                  gridEnabled: state.gridEnabled,
                  gridCellX: state.gridCellX,
                  gridCellY: state.gridCellY,
                  gridColor: state.gridColor,
                  gridThick: state.gridThick,
                  tool: state.tool,
                  brushSize: state.brushSize,
                  scale: state.scale,
                  camX: state.camX,
                  camY: state.camY,
                  pixels: serializePixelMap(pixels),
                  selection: state.selection,
                  lastPublishSelection: state.lastPublishSelection,
                  clipboard: state.clipboard
                    ? {
                        w: state.clipboard.w,
                        h: state.clipboard.h,
                        pixels: serializePixelMap(state.clipboard.pixels),
                      }
                    : null,
                });
              writeNativeSettings(json);
              localStorage.setItem(STORAGE_KEY, json);
            } catch (_) {}
          };
          if (immediate) {
            if (saveTimer) clearTimeout(saveTimer);
            write();
            return;
          }
          if (saveTimer) clearTimeout(saveTimer);
          saveTimer = setTimeout(write, 300);
        }

        function loadSettings() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return;
            const data = JSON.parse(raw);
            if (Array.isArray(data.palette) && data.palette.length > 0) {
              const next = data.palette
                .slice(0, MAX_PALETTE_SIZE)
                .map((c) => normalizeHex(c))
                .filter((c) => /^#[0-9a-f]{6}$/.test(c));
              if (next.length > 0) state.palette = next;
            }
            if (
              data.paletteIndex >= 0 &&
              data.paletteIndex < state.palette.length
            ) {
              state.paletteIndex = data.paletteIndex | 0;
            } else {
              state.paletteIndex = 0;
            }
            if (Array.isArray(data.palettes) && data.palettes.length) {
              const list = [];
              for (const pal of data.palettes) {
                if (!pal || !Array.isArray(pal.colors)) continue;
                const colors = pal.colors
                  .slice(0, MAX_PALETTE_SIZE)
                  .map((c) => normalizeHex(c))
                  .filter((c) => /^#[0-9a-f]{6}$/.test(c));
                if (!colors.length) continue;
                list.push({
                  name: typeof pal.name === "string" && pal.name.trim() ? pal.name.trim().slice(0, 40) : "Palette " + (list.length + 1),
                  colors,
                  index: clampInt(pal.index, 0, colors.length - 1, 0),
                  ...(pal.master && !list.some((x) => x.master) ? { master: true } : {}),
                });
              }
              if (list.length) {
                state.palettes = list;
                state.activePalette = clampInt(data.activePalette, 0, list.length - 1, 0);
                const act = list[state.activePalette];
                state.palette = act.colors;
                state.paletteIndex = act.index;
              }
            }
            if (data.bgColor) state.bgColor = normalizeHex(data.bgColor);
            if (data.accentColor) state.accentColor = normalizeHex(data.accentColor);
            if (typeof data.pixelGridEnabled === "boolean") {
              state.pixelGridEnabled = data.pixelGridEnabled;
            }
            state.tileTypes = sanitizeTileTypes(data.tileTypes);
            state.links = deserializeLinks(data.links);
            state.nextLinkId = nextLinkIdFor(state.links, data.nextLinkId);
            if (typeof data.mapName === "string" && data.mapName) state.mapName = data.mapName;
            if (data.legacyConfig) {
              const lc = readLegacyConfig(JSON.stringify(data.legacyConfig));
              if (lc.config) state.legacyConfig = lc.config;
            }
            if (typeof data.followSystem === "boolean") state.followSystem = data.followSystem;
            if (data.schemeColors) {
              for (const sch of ["light", "dark"]) {
                for (const k of CANVAS_COLOR_KEYS) {
                  const v = data.schemeColors[sch] && normalizeHex(data.schemeColors[sch][k]);
                  if (/^#[0-9a-f]{6}$/.test(v || "")) state.schemeColors[sch][k] = v;
                }
              }
            }
            if (typeof data.showLinksOutside === "boolean") state.showLinksOutside = data.showLinksOutside;
            if (typeof data.showUnknownOutside === "boolean") {
              state.showUnknownOutside = data.showUnknownOutside;
            }
            if (Number.isFinite(data.loupeZoom)) state.loupeZoom = Math.min(8, Math.max(1, data.loupeZoom));
            if (data.loupeSize != null) state.loupeSize = clampInt(data.loupeSize, 60, 300, 112);
            if (data.loupeMode === "follow" || data.loupeMode === "pin") state.loupeMode = data.loupeMode;
            if (data.loupeHoldMs != null) state.loupeHoldMs = clampInt(data.loupeHoldMs, 0, 2000, 250);
            if (data.hudLayout && typeof data.hudLayout === "object") {
              for (const name of ["tools", "palette", "size"]) {
                const L = data.hudLayout[name];
                if (!L) continue;
                const num = (v) => (Number.isFinite(v) ? v : null);
                const sized = num(L.w) != null && num(L.h) != null;
                state.hudLayout[name] = {
                  x: num(L.x),
                  y: num(L.x) == null ? null : num(L.y),
                  w: sized ? num(L.w) : null,
                  h: sized ? num(L.h) : null,
                };
              }
            }
            if (Number.isFinite(data.qmScale)) state.qmScale = Math.min(2, Math.max(0.6, data.qmScale));
            if (Array.isArray(data.qmToolOrder)) {
              // Keep known tools once each, then append any new ones.
              const order = data.qmToolOrder.filter((t, i, a) => QM_ALL_TOOLS.includes(t) && a.indexOf(t) === i);
              for (const t of QM_ALL_TOOLS) if (!order.includes(t)) order.push(t);
              state.qmToolOrder = order;
            }
            if (data.qmToolCount != null) state.qmToolCount = clampInt(data.qmToolCount, 1, QM_ALL_TOOLS.length, 6);
            if (data.qmColorCount != null) state.qmColorCount = clampInt(data.qmColorCount, 1, MAX_PALETTE_SIZE, MAX_PALETTE_SIZE);
            if (Array.isArray(data.settingsCollapsed)) {
              state.settingsCollapsed = data.settingsCollapsed.filter((k) => typeof k === "string");
            }
            if (data.hudSnap != null) state.hudSnap = clampInt(data.hudSnap, 0, 80, 16);
            if (typeof data.hueLabelsEnabled === "boolean") {
              state.hueLabelsEnabled = data.hueLabelsEnabled;
            }
            if (typeof data.satLabelsEnabled === "boolean") {
              state.satLabelsEnabled = data.satLabelsEnabled;
            }
            if (data.pixelGridColor) {
              state.pixelGridColor = normalizeHex(data.pixelGridColor);
            }
            if (data.pixelGridThick != null) {
              state.pixelGridThick = clampFloat(data.pixelGridThick, 0.5, 8, 1);
            }
            if (typeof data.gridEnabled === "boolean") {
              state.gridEnabled = data.gridEnabled;
            }
            if (data.gridCellX != null) {
              state.gridCellX = clampInt(data.gridCellX, 1, 512, 8);
            }
            if (data.gridCellY != null) {
              state.gridCellY = clampInt(data.gridCellY, 1, 512, 8);
            }
            if (data.gridColor) state.gridColor = normalizeHex(data.gridColor);
            if (data.gridThick != null) {
              state.gridThick = clampFloat(data.gridThick, 0.5, 8, 1);
            }
            if (
              data.tool === "brush" ||
              data.tool === "eraser" ||
              data.tool === "line" ||
              data.tool === "select" ||
              data.tool === "eyedropper" ||
              data.tool === "link"
            ) {
              state.tool = data.tool;
            }
            if (data.brushSize != null) {
              state.brushSize = clampInt(data.brushSize, 1, 32, 1);
            }
            if (Number.isFinite(data.scale)) {
              state.scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, data.scale));
            }
            if (Number.isFinite(data.camX) && Number.isFinite(data.camY)) {
              state.camX = data.camX;
              state.camY = data.camY;
              hasSavedCamera = true;
            }
            if (data.pixels) {
              const loaded = deserializePixelMap(data.pixels);
              pixels.clear();
              for (const [k, c] of loaded) pixels.set(k, c);
            }
            if (
              data.selection &&
              Number.isFinite(data.selection.x) &&
              Number.isFinite(data.selection.y) &&
              Number.isFinite(data.selection.w) &&
              Number.isFinite(data.selection.h)
            ) {
              state.selection = {
                x: data.selection.x | 0,
                y: data.selection.y | 0,
                w: Math.max(1, data.selection.w | 0),
                h: Math.max(1, data.selection.h | 0),
              };
            }
            if (
              data.lastPublishSelection &&
              Number.isFinite(data.lastPublishSelection.x) &&
              Number.isFinite(data.lastPublishSelection.y) &&
              Number.isFinite(data.lastPublishSelection.w) &&
              Number.isFinite(data.lastPublishSelection.h)
            ) {
              state.lastPublishSelection = {
                x: data.lastPublishSelection.x | 0,
                y: data.lastPublishSelection.y | 0,
                w: Math.max(1, data.lastPublishSelection.w | 0),
                h: Math.max(1, data.lastPublishSelection.h | 0),
              };
            }
            if (data.clipboard && data.clipboard.pixels) {
              state.clipboard = {
                w: Math.max(1, data.clipboard.w | 0),
                h: Math.max(1, data.clipboard.h | 0),
                pixels: deserializePixelMap(data.clipboard.pixels),
              };
            }
          } catch (_) {}
        }

        function syncSettingsUi() {
          state.color = state.palette[state.paletteIndex];
          followSystemInput.checked = state.followSystem;
          schemeRow.hidden = !state.followSystem;
          editSchemeInput.value = editedScheme();
          setSwatchEl(bgColorInput, shownCanvasColor("bgColor"));
          setSwatchEl(accentColorInput, shownCanvasColor("accentColor"));
          canvas.style.background = state.bgColor;
          pixelGridEnabledInput.checked = state.pixelGridEnabled;
          hueLabelsEnabledInput.checked = state.hueLabelsEnabled;
          document.getElementById("hud-snap").value = String(state.hudSnap);
          qmScaleInput.value = String(Math.round(state.qmScale * 100));
          qmToolCountInput.value = String(state.qmToolCount);
          qmColorCountInput.value = String(state.qmColorCount);
          buildQmOrder();
          loupeZoomInput.value = String(state.loupeZoom);
          loupeSizeInput.value = String(state.loupeSize);
          loupeModeInput.value = state.loupeMode;
          loupeHoldInput.value = String(state.loupeHoldMs);
          showLinksOutsideInput.checked = state.showLinksOutside;
          showUnknownOutsideInput.checked = state.showUnknownOutside;
          satLabelsEnabledInput.checked = state.satLabelsEnabled;
          setSwatchEl(pixelGridColorInput, shownCanvasColor("pixelGridColor"));
          pixelGridThickInput.value = String(state.pixelGridThick);
          gridEnabledInput.checked = state.gridEnabled;
          gridXInput.value = String(state.gridCellX);
          gridYInput.value = String(state.gridCellY);
          setSwatchEl(gridColorInput, shownCanvasColor("gridColor"));
          gridThickInput.value = String(state.gridThick);
        }

        function screenToWorld(sx, sy) {
          return {
            x: Math.floor((sx - state.camX) / state.scale),
            y: Math.floor((sy - state.camY) / state.scale),
          };
        }

        function normRect(a, b) {
          const x0 = Math.min(a.x, b.x);
          const y0 = Math.min(a.y, b.y);
          const x1 = Math.max(a.x, b.x);
          const y1 = Math.max(a.y, b.y);
          return { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
        }

        /** Selection covering whole major-grid cells from point a through b. */
        function majorGridRect(a, b) {
          const gx = Math.max(1, state.gridCellX | 0);
          const gy = Math.max(1, state.gridCellY | 0);
          const ax0 = Math.floor(a.x / gx) * gx;
          const ay0 = Math.floor(a.y / gy) * gy;
          const bx0 = Math.floor(b.x / gx) * gx;
          const by0 = Math.floor(b.y / gy) * gy;
          const left = Math.min(ax0, bx0);
          const top = Math.min(ay0, by0);
          const right = Math.max(ax0 + gx, bx0 + gx);
          const bottom = Math.max(ay0 + gy, by0 + gy);
          return { x: left, y: top, w: right - left, h: bottom - top };
        }

        function selectionRectFromDrag(a, b, snapMajor) {
          return snapMajor ? majorGridRect(a, b) : normRect(a, b);
        }

        function refreshSelectingRect(snapMajor) {
          if (!state.selecting || !state.selectAnchor) return;
          const end = state.hover || state.selectAnchor;
          state.selection = selectionRectFromDrag(
            state.selectAnchor,
            end,
            snapMajor
          );
          syncActionButtons();
          state.needsDraw = true;
        }

        function cloneRect(rect) {
          if (!rect) return null;
          return {
            x: rect.x | 0,
            y: rect.y | 0,
            w: Math.max(1, rect.w | 0),
            h: Math.max(1, rect.h | 0),
          };
        }

        function pointInRect(p, r) {
          return (
            r &&
            p.x >= r.x &&
            p.y >= r.y &&
            p.x < r.x + r.w &&
            p.y < r.y + r.h
          );
        }

        function constrainLineEnd(start, end) {
          if (!snapHeld() || !start) return end;
          const dx = end.x - start.x;
          const dy = end.y - start.y;
          const adx = Math.abs(dx);
          const ady = Math.abs(dy);
          if (adx === 0 && ady === 0) return end;
          const sx = dx === 0 ? 0 : dx > 0 ? 1 : -1;
          const sy = dy === 0 ? 0 : dy > 0 ? 1 : -1;
          if (adx * 2 < ady) return { x: start.x, y: end.y };
          if (ady * 2 < adx) return { x: end.x, y: start.y };
          const d = Math.max(adx, ady);
          return { x: start.x + sx * d, y: start.y + sy * d };
        }

        function extractRect(rect, remove) {
          const out = new Map();
          for (let y = rect.y; y < rect.y + rect.h; y++) {
            for (let x = rect.x; x < rect.x + rect.w; x++) {
              const k = key(x, y);
              if (!pixels.has(k)) continue;
              out.set(key(x - rect.x, y - rect.y), pixels.get(k));
              if (remove) pixels.delete(k);
            }
          }
          return { w: rect.w, h: rect.h, pixels: out };
        }

        function stampClip(clip, ox, oy) {
          for (const [k, color] of clip.pixels) {
            const p = parseKey(k);
            pixels.set(key(p.x + ox, p.y + oy), color);
          }
          state.needsDraw = true;
          saveSettings();
        }

        function clearRect(rect) {
          for (let y = rect.y; y < rect.y + rect.h; y++) {
            for (let x = rect.x; x < rect.x + rect.w; x++) {
              pixels.delete(key(x, y));
            }
          }
          state.needsDraw = true;
          saveSettings();
        }

        function commitFloat() {
          if (!state.float) return;
          landLinks();
          stampClip(state.float, state.float.x, state.float.y);
          state.selection = {
            x: state.float.x,
            y: state.float.y,
            w: state.float.w,
            h: state.float.h,
          };
          state.float = null;
          state.moving = false;
          state.moveGrab = null;
          canvas.classList.remove("moving");
          syncActionButtons();
          state.needsDraw = true;
        }

        function syncSizeHud() {
          const active =
            state.tool === "brush" ||
            state.tool === "eraser" ||
            state.tool === "line";
          sizeControls.classList.toggle("inactive", !active);
          brushSizeInput.value = String(state.brushSize);
          brushSizeVal.textContent = String(state.brushSize);
          sizeControls.setAttribute("aria-valuenow", String(state.brushSize));
          // Lighter fill up to the current size: from the bottom when the bar is
          // portrait, from the left otherwise.
          const pct = ((state.brushSize - 1) / (BRUSH_MAX - 1)) * 100 + "%";
          const portrait = sizeHud.classList.contains("portrait");
          sizeFill.style.width = portrait ? "100%" : pct;
          sizeFill.style.height = portrait ? pct : "100%";
        }

        function setBrushSize(n) {
          const next = clampInt(n, 1, 32, state.brushSize);
          if (next === state.brushSize) {
            syncSizeHud();
            return;
          }
          state.brushSize = next;
          syncSizeHud();
          saveSettings();
          state.needsDraw = true;
        }

        function setTool(tool) {
          if (tool !== state.tool) state.prevTool = state.tool;
          if (state.float && tool !== "select") {
            pushUndo();
            commitFloat();
          }
          state.tool = tool;
          state.lining = false;
          state.lineStart = null;
          state.lineEnd = null;
          brushBtn.classList.toggle("active", tool === "brush");
          eraserBtn.classList.toggle("active", tool === "eraser");
          lineBtn.classList.toggle("active", tool === "line");
          selectBtn.classList.toggle("active", tool === "select");
          eyedropperBtn.classList.toggle("active", tool === "eyedropper");
          brushBtn.setAttribute("aria-pressed", tool === "brush" ? "true" : "false");
          eraserBtn.setAttribute("aria-pressed", tool === "eraser" ? "true" : "false");
          lineBtn.setAttribute("aria-pressed", tool === "line" ? "true" : "false");
          selectBtn.setAttribute("aria-pressed", tool === "select" ? "true" : "false");
          eyedropperBtn.setAttribute("aria-pressed", tool === "eyedropper" ? "true" : "false");
          linkBtn.classList.toggle("active", tool === "link");
          linkBtn.setAttribute("aria-pressed", tool === "link" ? "true" : "false");
          if (tool !== "link") {
            state.linkSel = null;
            state.linkSelLink = null;
          }
          if (tool !== "select") {
            state.selection = null;
            state.selecting = false;
          }
          canvas.style.cursor =
            tool === "eyedropper" ? "copy" : tool === "link" ? "pointer" : "crosshair";
          syncSizeHud();
          syncActionButtons();
          state.needsDraw = true;
          saveSettings();
        }

        // Any change of the drawing color switches to the brush.
        function useBrush() {
          if (state.tool !== "brush") setTool("brush");
        }

        function selectPaletteIndex(index) {
          if (index < 0 || index >= state.palette.length) return;
          state.paletteIndex = index;
          state.color = state.palette[index];
          syncPaletteActive();
          useBrush();
          saveSettings();
        }

        function setSlotColor(index, color) {
          const hex = normalizeHex(color);
          if (!/^#[0-9a-f]{6}$/.test(hex)) return;
          if (index < 0 || index >= state.palette.length) return;
          if (!retypeSwatchColor(index, state.palette[index], hex)) return;
          state.palette[index] = hex;
          const slot = paletteEl.querySelector(
            '.palette-slot[data-index="' + index + '"]'
          );
          if (slot) {
            slot.style.background = hex;
            slot.dataset.color = hex;
            slot.title =
              index + 1 + ": " + hex + " · click select/edit · drag to reorder · drag off to delete";
          }
          if (state.paletteIndex === index) {
            state.color = hex;
            useBrush();
          }
          saveSettings();
          state.needsDraw = true;
        }

        function addPaletteSlot(color) {
          if (state.palette.length >= MAX_PALETTE_SIZE) return;
          const hex =
            normalizeHex(color) ||
            state.color ||
            DEFAULT_PALETTE[0];
          state.palette.push(/^#[0-9a-f]{6}$/.test(hex) ? hex : DEFAULT_PALETTE[0]);
          state.paletteIndex = state.palette.length - 1;
          state.color = state.palette[state.paletteIndex];
          buildPalette();
          useBrush();
          saveSettings();
          state.needsDraw = true;
        }

        function removePaletteSlot(index) {
          if (state.palette.length <= 1) return;
          if (index < 0 || index >= state.palette.length) return;
          const removedHex = state.palette[index];
          if (activeIsMaster() && state.tileTypes[removedHex]) {
            showToast("The Master palette keeps every tile type — clear the type first");
            buildPalette();
            return;
          }
          pushUndo(true);
          state.palette.splice(index, 1);
          if (state.paletteIndex > index) state.paletteIndex -= 1;
          if (state.paletteIndex >= state.palette.length) {
            state.paletteIndex = state.palette.length - 1;
          }
          state.color = state.palette[state.paletteIndex];
          closeColorPicker();
          buildPalette();
          saveSettings();
          state.needsDraw = true;
        }

        function sampleColorAt(wx, wy) {
          if (state.float) {
            const fx = wx - state.float.x;
            const fy = wy - state.float.y;
            if (
              fx >= 0 &&
              fy >= 0 &&
              fx < state.float.w &&
              fy < state.float.h
            ) {
              const floated = state.float.pixels.get(key(fx, fy));
              if (floated) return normalizeHex(floated) || floated;
            }
          }
          const painted = pixels.get(key(wx, wy));
          if (painted) return normalizeHex(painted) || painted;
          return null; // empty canvas: nothing to pick
        }

        // Eyedropper press-and-hold: a loupe shows the pixels under the pointer,
        // ringed with the color that releasing will pick. It appears after the
        // hold time (Settings › Eyedropper); a finger has to hold still for it
        // (or it pans), while moving a Pencil/mouse shows it straight away.

        function startEyeHold(e, touch) {
          const h = { id: e.pointerId, x: e.clientX, y: e.clientY, active: false, touch };
          state.eyeHold = h;
          setTimeout(() => {
            if (state.eyeHold !== h) return;
            h.active = true;
            state.needsDraw = true;
          }, state.loupeHoldMs);
        }

        function eyeHoldCell(h) {
          const r = canvas.getBoundingClientRect();
          return screenToWorld(h.x - r.left, h.y - r.top);
        }

        // Pick where the pointer was released; a cancelled touch picks nothing.
        function finishEyeHold(pick) {
          const h = state.eyeHold;
          state.eyeHold = null;
          state.needsDraw = true;
          if (!h || !pick) return;
          const w = eyeHoldCell(h);
          applyEyedropperAt(w.x, w.y);
        }

        function drawEyeLoupe(s) {
          const h = state.eyeHold;
          if (!h || !h.active) return;
          const r = canvas.getBoundingClientRect();
          const px = h.x - r.left;
          const py = h.y - r.top;
          const cell = screenToWorld(px, py);
          const picked = sampleColorAt(cell.x, cell.y);
          const R = state.loupeSize / 2;
          // Follow: centred on the pointer. Pin: fixed in the top-right corner.
          const pinned = state.loupeMode === "pin";
          const cx = pinned ? window.innerWidth - R - 24 : px;
          const cy = pinned ? R + 24 : py;
          // Magnify relative to the view: tiles in the loupe are loupeZoom × their
          // on-canvas size (kept between 3px and the loupe radius), centred on the
          // exact pointer position so it glides rather than jumps cell to cell.
          const cellPx = Math.max(3, Math.min(R, s * state.loupeZoom));
          const wx = (px - state.camX) / s;
          const wy = (py - state.camY) / s;
          const span = R / cellPx;
          const gx0 = Math.floor(wx - span);
          const gx1 = Math.ceil(wx + span);
          const gy0 = Math.floor(wy - span);
          const gy1 = Math.ceil(wy + span);
          const toX = (x) => cx + (x - wx) * cellPx;
          const toY = (y) => cy + (y - wy) * cellPx;

          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, R, 0, Math.PI * 2);
          ctx.clip();
          for (let y = gy0; y <= gy1; y++) {
            for (let x = gx0; x <= gx1; x++) {
              ctx.fillStyle = sampleColorAt(x, y) || state.bgColor;
              ctx.fillRect(toX(x), toY(y), cellPx + 0.5, cellPx + 0.5);
            }
          }
          if (cellPx >= 6) {
            ctx.strokeStyle = withAlpha(state.pixelGridColor, 0.6);
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = gx0; x <= gx1 + 1; x++) {
              ctx.moveTo(toX(x), cy - R);
              ctx.lineTo(toX(x), cy + R);
            }
            for (let y = gy0; y <= gy1 + 1; y++) {
              ctx.moveTo(cx - R, toY(y));
              ctx.lineTo(cx + R, toY(y));
            }
            ctx.stroke();
          }
          // The cell that will be picked.
          const ox = toX(cell.x);
          const oy = toY(cell.y);
          ctx.lineWidth = 3;
          ctx.strokeStyle = "rgba(0,0,0,0.75)";
          ctx.strokeRect(ox, oy, cellPx, cellPx);
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = "#ffffff";
          ctx.strokeRect(ox, oy, cellPx, cellPx);
          ctx.restore();

          // Ring in the color that will be picked, with thin halos so it reads on any background.
          ctx.save();
          ctx.lineWidth = 12;
          ctx.strokeStyle = "rgba(0,0,0,0.5)";
          ctx.beginPath();
          ctx.arc(cx, cy, R + 5, 0, Math.PI * 2);
          ctx.stroke();
          ctx.lineWidth = 9;
          if (picked) {
            ctx.strokeStyle = picked;
          } else {
            // Empty canvas: nothing will be picked, so a dashed neutral ring.
            ctx.strokeStyle = state.bgColor;
            ctx.stroke();
            ctx.setLineDash([6, 6]);
            ctx.strokeStyle = withAlpha(state.accentColor, 0.6);
          }
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.lineWidth = 1;
          ctx.strokeStyle = "rgba(255,255,255,0.7)";
          ctx.beginPath();
          ctx.arc(cx, cy, R + 0.5, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        function applyEyedropperAt(wx, wy) {
          const hex = sampleColorAt(wx, wy);
          if (!/^#[0-9a-f]{6}$/.test(hex)) return;
          const existing = state.palette.findIndex((c) => c === hex);
          if (existing >= 0) {
            selectPaletteIndex(existing);
          } else if (state.palette.length < MAX_PALETTE_SIZE) {
            addPaletteSlot(hex);
          } else {
            setSlotColor(state.paletteIndex, hex);
          }
          setTool("brush");
        }

        function syncPaletteActive() {
          for (const btn of paletteEl.querySelectorAll(".palette-slot[data-index]")) {
            const idx = +btn.dataset.index;
            btn.classList.toggle("active", idx === state.paletteIndex);
          }
        }
