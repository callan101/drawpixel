          state.touchGesture.maxCount = Math.max(
            state.touchGesture.maxCount,
            state.pointers.size
          );
          state.pinch = null;
          if (state.pointers.size === 2) startPinch();
        }

        function touchMove(e) {
          const pt = state.pointers.get(e.pointerId);
          if (!pt) return;
          const dx = e.clientX - pt.x;
          const dy = e.clientY - pt.y;
          pt.x = e.clientX;
          pt.y = e.clientY;
          const g = state.touchGesture;
          if (g && Math.hypot(pt.x - pt.sx, pt.y - pt.sy) > TAP_MAX_MOVE) g.moved = true;

          if (state.pointers.size === 1) {
            state.camX += dx;
            state.camY += dy;
            state.needsDraw = true;
          } else if (state.pointers.size === 2 && state.pinch) {
            const pts = [...state.pointers.values()];
            const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) || 1;
            const midX = (pts[0].x + pts[1].x) / 2;
            const midY = (pts[0].y + pts[1].y) / 2;
            const r = canvas.getBoundingClientRect();
            zoomAt(midX - r.left, midY - r.top, state.pinch.scale * (dist / state.pinch.dist));
            state.camX += midX - state.pinch.midX;
            state.camY += midY - state.pinch.midY;
            state.pinch.midX = midX;
            state.pinch.midY = midY;
            state.needsDraw = true;
          }
        }

        function touchUp(e) {
          if (!state.pointers.delete(e.pointerId)) return;
          state.pinch = null;
          if (state.pointers.size === 2) startPinch();
          if (state.pointers.size > 0) return;
          const g = state.touchGesture;
          state.touchGesture = null;
          if (g && !g.moved && performance.now() - g.start < TAP_MAX_MS) {
            if (g.maxCount === 2) undo();
            else if (g.maxCount === 3) redo();
          }
          saveSettings();
        }

        canvas.addEventListener("pointerdown", (e) => {
          // While the quick menu is open the canvas only aims, never draws.
          if (quickMenu.open) {
            if (e.pointerType !== "touch") updateQuickMenuHot(e.clientX, e.clientY);
            return;
          }
          if (e.pointerType === "touch") {
            touchDown(e);
            return;
          }
          // Right mouse button = squeeze.
          if (e.pointerType === "mouse" && e.button === 2) {
            openQuickMenu(e.pointerId, { x: e.clientX, y: e.clientY });
            return;
          }
          // Pen or mouse cancels any finger gesture (e.g. a resting palm).
          cancelTouchGesture();
          capturePointer(canvas, e.pointerId);
          state.penId = e.pointerId;

          const p = clientPos(e);
          const world = screenToWorld(p.x, p.y);
          state.hover = world;
          state.hoverVisible = true;

          if (wantsPan(e)) {
            state.panning = true;
            state.drawing = false;
            state.lining = false;
            state.selecting = false;
            canvas.classList.add("panning");
            e.preventDefault();
            return;
          }

          if (e.button !== 0) return;

          if (state.tool === "eyedropper") {
            applyEyedropperAt(world.x, world.y);
            return;
          }

          if (state.tool === "satsync" || state.tool === "huesync") {
            const target = state.tool === "satsync" ? state.syncSat : state.syncHue;
            if (e.shiftKey || target == null) {
              sampleSyncAt(world.x, world.y);
              return;
            }
            pushUndo();
            if (state.float) commitFloat();
            state.syncing = true;
            applySyncAt(world.x, world.y);
            return;
          }

          if (state.tool === "brush" || state.tool === "eraser") {
            pushUndo();
            if (state.float) commitFloat();
            if (e.shiftKey && state.lastPainted) {
              const color = state.tool === "eraser" ? null : state.color;
              paintBrushLine(
                state.lastPainted.x,
                state.lastPainted.y,
                world.x,
                world.y,
                color
              );
              state.lastPainted = { x: world.x, y: world.y };
              state.drawing = false;
              state.lastWorld = null;
              state.needsDraw = true;
              saveSettings();
              return;
            }
            state.drawing = true;
            state.lastWorld = null;
            state.strokeStart = world;
            state.strokeBase = undoStack[undoStack.length - 1].pixels;
            restartHoldTimer(e.clientX, e.clientY);
            paintAt(p.x, p.y);
            return;
          }

          if (state.tool === "line") {
            pushUndo();
            if (state.float) commitFloat();
            state.lining = true;
            state.lineErase = false;
            state.lineStart = world;
            state.lineEnd = world;
            state.needsDraw = true;
            return;
          }

          if (state.tool === "select") {
            const live = state.float
              ? {
                  x: state.float.x,
                  y: state.float.y,
                  w: state.float.w,
                  h: state.float.h,
                }
              : state.selection;
            if (live && pointInRect(world, live)) {
              beginMove(world);
              return;
            }
            if (state.float) {
              pushUndo();
              commitFloat();
            }
            state.selecting = true;
            state.selectAnchor = world;
            state.selection = selectionRectFromDrag(
              world,
              world,
              e.shiftKey || state.shiftDown || state.snap
            );
            syncActionButtons();
            state.needsDraw = true;
          }
        });

        canvas.addEventListener("pointermove", (e) => {
          if (e.pointerType === "touch") {
            touchMove(e);
            return;
          }
          if (state.penId != null && e.pointerId !== state.penId) return;

          // Also fires while a Pencil hovers, so the brush outline follows it.
          state.lastCanvasClient = { x: e.clientX, y: e.clientY };
          const p = clientPos(e);
          const cell = screenToWorld(p.x, p.y);
          if (!state.hoverVisible || cell.x !== state.hover.x || cell.y !== state.hover.y) {
            state.hover = cell;
            state.hoverVisible = true;
            state.needsDraw = true;
          }

          if (state.panning) {
            state.camX += e.movementX;
            state.camY += e.movementY;
            state.needsDraw = true;
            return;
          }

          if (state.syncing) {
            applySyncAt(cell.x, cell.y);
            return;
          }

          if (state.moving && state.float && state.moveGrab) {
            state.float.x = cell.x - state.moveGrab.dx;
            state.float.y = cell.y - state.moveGrab.dy;
            state.selection = {
              x: state.float.x,
              y: state.float.y,
              w: state.float.w,
              h: state.float.h,
            };
            state.needsDraw = true;
            return;
          }

          if (state.selecting && state.selectAnchor) {
            state.selection = selectionRectFromDrag(
              state.selectAnchor,
              cell,
              e.shiftKey || state.shiftDown || state.snap
            );
            syncActionButtons();
            state.needsDraw = true;
            return;
          }

          if (state.lining && state.lineStart) {
            state.lineEnd = cell;
            state.needsDraw = true;
            return;
          }

          if (state.drawing) {
            if (
              !state.holdPos ||
              Math.hypot(e.clientX - state.holdPos.x, e.clientY - state.holdPos.y) > QS_STILL_PX
            ) {
              restartHoldTimer(e.clientX, e.clientY);
            }
            paintAt(p.x, p.y);
          }

          if (state.tool === "select" && !state.panning && !state.moving) {
            const live = state.float
              ? {
                  x: state.float.x,
                  y: state.float.y,
                  w: state.float.w,
                  h: state.float.h,
                }
              : state.selection;
            canvas.style.cursor = pointInRect(cell, live) ? "move" : "crosshair";
          }
        });

        function endPointer(e) {
          if (e.pointerType === "touch") {
            touchUp(e);
            return;
          }
          if (e.pointerId !== state.penId) return;
          state.penId = null;
          state.syncing = false;
          clearHoldTimer();
          {
            if (state.lining && state.lineStart && state.lineEnd) {
              const end = constrainLineEnd(state.lineStart, state.lineEnd);
              paintBrushLine(
                state.lineStart.x,
                state.lineStart.y,
                end.x,
                end.y,
                state.lineErase ? null : state.color
              );
              state.lastPainted = { x: end.x, y: end.y };
            }
            if (state.moving && state.float) commitFloat();
            state.drawing = false;
            state.lining = false;
            state.lineStart = null;
            state.lineEnd = null;
            state.panning = false;
            state.selecting = false;
            state.moving = false;
            state.moveGrab = null;
            state.lastWorld = null;
            state.selectAnchor = null;
            canvas.classList.remove("panning");
            canvas.classList.remove("moving");
            syncActionButtons();
            state.needsDraw = true;
            saveSettings();
          }
        }

        canvas.addEventListener("pointerup", endPointer);
        canvas.addEventListener("pointercancel", endPointer);
        canvas.addEventListener("pointerleave", (e) => {
          if (e.pointerType === "touch" || state.penId != null) return;
          state.hoverVisible = false;
          state.needsDraw = true;
        });

        function syncSnapUi() {
          snapBtn.classList.toggle("active", state.snap);
          snapBtn.setAttribute("aria-pressed", state.snap ? "true" : "false");
        }

        // Quick menu: a ring of tools plus a "colours" item whose swatches open
        // as an outer ring when it's hovered. Opened by holding the squeeze
        // button (stand-in for Pencil Pro squeeze) or the right mouse button.
        // Hold mode: whatever is hovered when the button is released is picked.
        // If the button is released quickly, with nothing hovered, on the
        // colours item, or iOS cancels the held touch, the menu stays open
        // (sticky) and the next tap picks; tapping the centre/outside cancels.
        const QM_TOOLS = ["brush", "line", "flex", "eyedropper", "eraser"];
        const QM_R = 72; // mid radius of the main ring
        const QM_BAND = 52; // main ring thickness
        const QM_SUB_GAP = 6; // gap between main ring and swatch ring
        const QM_SUB_BAND = 40; // swatch ring thickness
        const QM_SUB_ARC = 40; // arc length per swatch at the swatch ring's mid radius
        const QM_ARC_GAP = 2; // px gap between neighbouring arcs
        const QM_ICON = 22;
        const QM_HOT_PUSH = 8; // an arc slides outward up to this much as you near it
        const QM_PROX_SCALE = 0.1; // ...and grows up to this fraction
        const QM_SUB_MIN_SCALE = 0.8; // swatch ring scale when barely expanded
        const QM_CENTER_R = 30; // centre = cancel
        const QM_OUTER_SLOP = 40; // px past the outermost ring that still counts
        const QM_QUICK_MS = 300; // shorter hold = sticky
        const SVG_NS = "http://www.w3.org/2000/svg";

        const quickMenuEl = document.getElementById("quick-menu");
        const quickMenu = {
          open: false,
          pointerId: null, // pointer holding the menu open (hold mode)
          sticky: false,
          tapId: null, // pointer picking an item in sticky mode
          openedAt: 0,
          cx: 0,
          cy: 0,
          outer: 0, // outer edge of the main ring
          subOuter: 0, // outer edge of the swatch ring
          items: [], // main ring
          sub: [], // swatches
          subEl: null,
          subOpen: false,
          colorsItem: null,
          hot: null,
          label: null,
        };

        function toolIconPaths(name) {
          const btn = document.getElementById("tool-" + name);
          const svg = btn && btn.querySelector("svg");
          return svg ? svg.innerHTML : "";
        }

        // Annular sector between radii r0 < r1 and angles a0 < a1, centred on 0,0.
        function arcPath(r0, r1, a0, a1) {
          const large = a1 - a0 > Math.PI ? 1 : 0;
          const pt = (rad, a) => (rad * Math.cos(a)).toFixed(2) + " " + (rad * Math.sin(a)).toFixed(2);
          return (
            "M" + pt(r1, a0) +
            " A" + r1 + " " + r1 + " 0 " + large + " 1 " + pt(r1, a1) +
            " L" + pt(r0, a1) +
            " A" + r0 + " " + r0 + " 0 " + large + " 0 " + pt(r0, a0) +
            "Z"
          );
        }

        function placeQuickMenuEl(el, size) {
          el.style.width = size + "px";
          el.style.height = size + "px";
          el.style.left = quickMenu.cx - size / 2 + "px";
          el.style.top = quickMenu.cy - size / 2 + "px";
          quickMenuEl.appendChild(el);
        }

        // Builds one arc item into `parent` and returns its hit-test record.
        function addArcItem(parent, it, r0, r1, angle, halfStep) {
          const mid = (r0 + r1) / 2;
          const pad = QM_ARC_GAP / 2 / mid;
          const g = document.createElementNS(SVG_NS, "g");
          g.setAttribute(
            "class",
            "qm-item qm-" + it.kind +
              (it.flex ? " qm-flex" : "") +
              (it.current ? " current" : "") +
              (it.apply || it.submenu ? "" : " empty")
          );
          const arc = document.createElementNS(SVG_NS, "path");
          arc.setAttribute("class", "qm-arc");
          arc.setAttribute("d", arcPath(r0, r1, angle - halfStep + pad, angle + halfStep - pad));
          if (it.color) arc.style.fill = it.color;
          g.appendChild(arc);
          if (it.tool) {
            const icon = document.createElementNS(SVG_NS, "g");
            icon.setAttribute("class", "qm-icon");
            const x = mid * Math.cos(angle) - QM_ICON / 2;
            const y = mid * Math.sin(angle) - QM_ICON / 2;
            icon.setAttribute("transform", "translate(" + x + " " + y + ") scale(" + QM_ICON / 24 + ")");
            icon.innerHTML = toolIconPaths(it.tool);
            g.appendChild(icon);
          }
          parent.appendChild(g);
          return {
            el: g,
            angle,
            halfStep,
            label: it.label,
            apply: it.apply || null,
            submenu: !!it.submenu,
          };
        }

        function openQuickMenu(pointerId, anchor) {
          closeColorPicker();
          const main = [];
          for (const slot of QM_TOOLS) {
            const tool = slot === "flex" ? state.prevTool : slot;
            main.push({
              kind: "tool",
              flex: slot === "flex",
              tool,
              label: tool ? (slot === "flex" ? "last: " : "") + tool : "no previous tool",
              current: tool === state.tool,
              apply: tool ? () => setTool(tool) : null,
            });
          }
          main.push({ kind: "colors", color: state.color, label: "colors", submenu: true });

          const inner = QM_R - QM_BAND / 2;
          const outer = QM_R + QM_BAND / 2;
          const subInner = outer + QM_SUB_GAP;
          const subOuter = subInner + QM_SUB_BAND;
          const reach = subOuter + QM_HOT_PUSH + 4;
          const at = anchor ||
            state.lastCanvasClient || { x: window.innerWidth / 2, y: window.innerHeight / 2 };
          const fit = (v, max) => {
            const m = Math.min(reach, max / 2);
            return Math.max(m, Math.min(max - m, v));
          };
          quickMenu.cx = fit(at.x, window.innerWidth);
          quickMenu.cy = fit(at.y, window.innerHeight);
          quickMenu.inner = inner;
          quickMenu.outer = outer;
          quickMenu.subInner = subInner;
          quickMenu.subOuter = subOuter;
          quickMenu.items = [];
          quickMenu.sub = [];
          quickMenu.hot = null;
          quickMenuEl.innerHTML = "";

          const size = 2 * reach;
          const svg = document.createElementNS(SVG_NS, "svg");
          svg.setAttribute("class", "qm-svg");
          svg.setAttribute("viewBox", -size / 2 + " " + -size / 2 + " " + size + " " + size);
          placeQuickMenuEl(svg, size);

          const center = document.createElement("div");
          center.className = "qm-center";
          placeQuickMenuEl(center, QM_CENTER_R * 2);
          quickMenu.label = center;

          const step = (2 * Math.PI) / main.length;
          main.forEach((it, k) => {
            const item = addArcItem(svg, it, inner, outer, -Math.PI / 2 + k * step, step / 2);
            quickMenu.items.push(item);
            if (item.submenu) quickMenu.colorsItem = item;
          });

          // Swatch ring: a fan centred on the colours item, or the full circle
          // when there are too many swatches to fan.
          const subEl = document.createElementNS(SVG_NS, "g");
          subEl.setAttribute("class", "qm-sub");
          svg.insertBefore(subEl, svg.firstChild);
          const n = state.palette.length;
          const subMid = (subInner + subOuter) / 2;
          const subStep = Math.min(QM_SUB_ARC / subMid, (2 * Math.PI) / n);
          const start = quickMenu.colorsItem.angle - ((n - 1) * subStep) / 2;
          state.palette.forEach((color, k) => {
            quickMenu.sub.push(
              addArcItem(
                subEl,
                {
                  kind: "swatch",
                  color,
                  label: color,
                  current: k === state.paletteIndex,
                  apply: () => {
                    selectPaletteIndex(k);
                    if (state.tool !== "brush" && state.tool !== "line") setTool("brush");
                  },
                },
                subInner,
                subOuter,
                start + k * subStep,
                subStep / 2
              )
            );
          });
          quickMenu.subEl = subEl;
          setQuickMenuSub(false);
          applyQuickMenuProximity(null);

          quickMenu.open = true;
          quickMenu.pointerId = pointerId;
          quickMenu.sticky = false;
          quickMenu.tapId = null;
          quickMenu.openedAt = performance.now();
          quickMenu.entered = false;
          quickMenuEl.hidden = false;
          setQuickMenuHot(null);
          state.needsDraw = true;
        }

        function setQuickMenuSub(open) {
          quickMenu.subOpen = open;
          quickMenu.subEl.classList.toggle("open", open);
          quickMenu.colorsItem.el.classList.toggle("expanded", open);
        }

        function angleDiff(a, b) {
          let d = Math.abs(a - b) % (2 * Math.PI);
          return d > Math.PI ? 2 * Math.PI - d : d;
        }

        function nearestByAngle(list, angle) {
          let best = null;
          let bestDiff = Infinity;
          for (const it of list) {
            const diff = angleDiff(angle, it.angle);
            if (diff < bestDiff) {
              bestDiff = diff;
              best = it;
            }
          }
          return { item: best, diff: bestDiff };
        }

        // Distance picks the ring, angle picks the item, so a rough move
        // toward an item is enough. Returns undefined for the centre.
        // The item in a direction: a swatch if the swatch ring is open and the
        // angle falls inside its fan, otherwise the main item. `inFan` tells
        // the caller which ring answered.
        function quickMenuItemInDirection(angle) {
          if (quickMenu.subOpen) {
            const hit = nearestByAngle(quickMenu.sub, angle);
            if (hit.item && hit.diff <= hit.item.halfStep) return { item: hit.item, inFan: true };
          }
          const best = nearestByAngle(quickMenu.items, angle).item;
          return { item: best && (best.apply || best.submenu) ? best : null, inFan: false };
        }

        // Distance picks the ring, angle picks the item, so a rough move toward
        // an item is enough. Returns undefined for the centre; `beyond` is set
        // once the pointer has left the menu in that direction.
        function quickMenuItemAt(x, y) {
          const dx = x - quickMenu.cx;
          const dy = y - quickMenu.cy;
          const d = Math.hypot(dx, dy);
          if (d < QM_CENTER_R) return { item: undefined, beyond: false };
          if (!quickMenu.subOpen || d <= quickMenu.outer + QM_SUB_GAP / 2) {
            const main = nearestByAngle(quickMenu.items, Math.atan2(dy, dx)).item;
            return {
              item: main && (main.apply || main.submenu) ? main : null,
              beyond: d > quickMenu.outer + QM_OUTER_SLOP,
            };
          }
          const hit = quickMenuItemInDirection(Math.atan2(dy, dx));
          const edge = (hit.inFan ? quickMenu.subOuter : quickMenu.outer) + QM_OUTER_SLOP;
          return { item: hit.item, beyond: d > edge };
        }

        function setQuickMenuHot(hot) {
          const prev = quickMenu.hot;
          if (prev && prev !== hot) prev.el.classList.remove("hot");
          if (hot) {
            hot.el.classList.add("hot");
            hot.el.parentNode.appendChild(hot.el); // paint above neighbours
          }
          quickMenu.hot = hot;
          if (quickMenu.label) quickMenu.label.textContent = hot ? hot.label : "×";
        }

        function updateQuickMenuHot(x, y) {
          const at = quickMenuItemAt(x, y);
          const hot = at.item || null;
          // Leaving the menu picks whatever is in that direction and closes it
          // (leaving through colours just opens the swatch ring). Only once the
          // pointer has been inside, so one that starts outside (a mouse on
          // the squeeze button) doesn't pick on its way in.
          if (!at.beyond) quickMenu.entered = true;
          if (at.beyond && quickMenu.entered && hot && hot.apply) {
            setQuickMenuHot(hot);
            closeQuickMenu(true);
            return;
          }
          // Colours opens the swatch ring once the pointer reaches its arc (before
          // that the ring only previews, scaled by proximity); another main item
          // or the centre closes it.
          const d = Math.hypot(x - quickMenu.cx, y - quickMenu.cy);
          if (hot && hot.submenu) {
            if (d >= quickMenu.inner) setQuickMenuSub(true);
          } else if (at.item === undefined || (hot && quickMenu.items.includes(hot))) {
            setQuickMenuSub(false);
          }
          if (hot !== quickMenu.hot) setQuickMenuHot(hot);
          applyQuickMenuProximity({ x, y });
        }

        function smoothstep(t) {
          if (t <= 0) return 0;
          if (t >= 1) return 1;
          return t * t * (3 - 2 * t);
        }

        // Every arc slides out and grows with how close the pointer is (by
        // angle and by distance from its ring), and the swatch ring expands as
        // the pointer nears the colours item, fully once colours is hovered.
        function applyQuickMenuProximity(pt) {
          let d = 0;
          let angle = 0;
          if (pt) {
            d = Math.hypot(pt.x - quickMenu.cx, pt.y - quickMenu.cy);
            angle = Math.atan2(pt.y - quickMenu.cy, pt.x - quickMenu.cx);
          }
          // 1 inside [r0, r1], easing to 0 toward `from` and past r1.
          const radial = (from, r0, r1) => {
            if (!pt) return 0;
            if (d < r0) return smoothstep((d - from) / (r0 - from));
            if (d <= r1) return 1;
            return smoothstep(1 - (d - r1) / QM_OUTER_SLOP);
          };
          const near = (it, spread) => smoothstep(1 - angleDiff(angle, it.angle) / (it.halfStep * spread));
          const style = (it, prox) => {
            const push = QM_HOT_PUSH * prox;
            it.el.style.transform =
              "translate(" + push * Math.cos(it.angle) + "px, " + push * Math.sin(it.angle) + "px)" +
              " scale(" + (1 + QM_PROX_SCALE * prox) + ")";
          };

          const mainR = radial(QM_CENTER_R, quickMenu.inner, quickMenu.outer);
          for (const it of quickMenu.items) style(it, pt && (it.apply || it.submenu) ? near(it, 3) * mainR : 0);

          const colors = quickMenu.colorsItem;
          const level = quickMenu.subOpen
            ? 1
            : pt
              ? near(colors, 3) * radial(QM_CENTER_R, quickMenu.inner, quickMenu.subOuter)
              : 0;
          quickMenu.subEl.style.opacity = level;
          quickMenu.subEl.style.transform = "scale(" + (QM_SUB_MIN_SCALE + (1 - QM_SUB_MIN_SCALE) * level) + ")";
          quickMenu.subEl.style.visibility = level > 0.01 ? "visible" : "hidden";

          const subR = radial(quickMenu.outer, quickMenu.subInner, quickMenu.subOuter) * level;
          for (const it of quickMenu.sub) style(it, pt ? near(it, 2.5) * subR : 0);
        }

        function closeQuickMenu(apply) {
          if (!quickMenu.open) return;
          const hot = quickMenu.hot;
          quickMenu.open = false;
          quickMenu.pointerId = null;
          quickMenu.sticky = false;
          quickMenu.tapId = null;
          quickMenu.hot = null;
          quickMenu.items = [];
          quickMenu.sub = [];
          quickMenu.subEl = null;
          quickMenu.colorsItem = null;
          quickMenu.label = null;
          quickMenuEl.hidden = true;
          quickMenuEl.innerHTML = "";
          state.needsDraw = true;
          if (apply && hot && hot.apply) hot.apply();
        }

        function makeQuickMenuSticky() {
          quickMenu.sticky = true;
          quickMenu.pointerId = null;
          quickMenu.tapId = null;
        }

        quickMenuEl.addEventListener("contextmenu", (e) => e.preventDefault());

        // Sticky mode: any pointer (Pencil, finger, mouse) taps to pick.
        window.addEventListener("pointerdown", (e) => {
          if (!quickMenu.open || !quickMenu.sticky || quickMenu.tapId != null) return;
          quickMenu.tapId = e.pointerId;
          updateQuickMenuHot(e.clientX, e.clientY);
        });

        // Aim: Pencil (hovering or touching) and mouse always; a finger only
        // when it's the one tapping in sticky mode (otherwise it's the one
        // holding the squeeze button).
        window.addEventListener("pointermove", (e) => {
          if (!quickMenu.open) return;
          if (e.pointerType === "touch" && e.pointerId !== quickMenu.tapId) return;
          updateQuickMenuHot(e.clientX, e.clientY);
        });

        // `id` is a pointerId, or NATIVE_SQUEEZE_ID for the Pencil's squeeze;
        // `released` is false when the hold was cancelled.
        function endQuickMenuHold(id, released) {
          if (!quickMenu.open) return;
          const hot = quickMenu.hot;
          if (quickMenu.sticky) {
            if (id !== quickMenu.tapId) return;
            if (released && hot && hot.submenu) {
              quickMenu.tapId = null; // tapped colours: wait for a swatch tap
              return;
            }
            closeQuickMenu(released);
            return;
          }
          if (id !== quickMenu.pointerId) return;
          if (released && hot) {
            if (hot.submenu) makeQuickMenuSticky();
            else closeQuickMenu(true);
            return;
          }
          const quick = performance.now() - quickMenu.openedAt < QM_QUICK_MS;
          if (!released || quick) {
            makeQuickMenuSticky();
            return;
          }
          closeQuickMenu(false); // held, then released over the centre/outside
        }
        const endQuickMenuPointer = (e) => endQuickMenuHold(e.pointerId, e.type === "pointerup");
        window.addEventListener("pointerup", endQuickMenuPointer);
        window.addEventListener("pointercancel", endQuickMenuPointer);

        // Native Apple Pencil events (Capacitor plugin "PencilSqueeze").
        // Squeeze drives the quick menu exactly like holding the squeeze
        // button; its hover location (if the Pencil is hovering) anchors the
        // menu, and hovering aims as usual. Double-tap swaps to the previous tool.
        const NATIVE_SQUEEZE_ID = "native-squeeze";

        function nativeSqueeze(ev) {
          const pt =
            ev && Number.isFinite(ev.x) && Number.isFinite(ev.y) ? { x: ev.x, y: ev.y } : null;
          if (ev.phase === "began") {
            if (quickMenu.open) {
              closeQuickMenu(false); // squeezing again closes a sticky menu
              return;
            }
            if (pt) state.lastCanvasClient = pt;
            openQuickMenu(NATIVE_SQUEEZE_ID, pt);
          } else if (ev.phase === "changed") {
            if (pt && quickMenu.open) updateQuickMenuHot(pt.x, pt.y);
          } else if (ev.phase === "ended" || ev.phase === "cancelled") {
            endQuickMenuHold(NATIVE_SQUEEZE_ID, ev.phase === "ended");
          }
        }

        function nativePencilDoubleTap() {
          if (quickMenu.open) return;
          setTool(state.prevTool || (state.tool === "eraser" ? "brush" : "eraser"));
        }

        if (native && native.PencilSqueeze) {
          native.PencilSqueeze.addListener("squeeze", nativeSqueeze);
          native.PencilSqueeze.addListener("doubleTap", nativePencilDoubleTap);
        }
        // Same entry points for testing from the console / web inspector.
        window.drawApp = { squeeze: nativeSqueeze, doubleTap: nativePencilDoubleTap };

        function setSnap(on) {
          state.snap = on;
          syncSnapUi();
          if (state.lining) state.needsDraw = true;
          if (state.selecting) refreshSelectingRect(on || state.shiftDown);
          saveSettings();
        }

        canvas.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            if (e.shiftKey) {
              const delta = e.deltaY !== 0 ? e.deltaY : e.deltaX;
              state._sizeWheelAcc = (state._sizeWheelAcc || 0) + delta;
              while (state._sizeWheelAcc <= -40) {
                state._sizeWheelAcc += 40;
                setBrushSize(state.brushSize + 1);
              }
              while (state._sizeWheelAcc >= 40) {
                state._sizeWheelAcc -= 40;
                setBrushSize(state.brushSize - 1);
              }
              return;
            }
            if (e.ctrlKey || e.metaKey) {
              const p = clientPos(e);
              zoomAt(p.x, p.y, state.scale * Math.exp(-e.deltaY * 0.01));
              return;
            }
            state.camX -= e.deltaX;
            state.camY -= e.deltaY;
            state.needsDraw = true;
            saveSettings();
          },
          { passive: false }
        );

        function isTypingTarget(el) {
          if (!el || el === document.body) return false;
          const tag = el.tagName;
          return tag === "INPUT" || tag === "TEXTAREA" || el.isContentEditable;
        }

        window.addEventListener("keydown", (e) => {
          if (e.key === "Shift") {
            state.shiftDown = true;
            if (state.lining) state.needsDraw = true;
            if (state.selecting) refreshSelectingRect(true);
          }
          if (isTypingTarget(e.target)) return;

          if (e.code === "Space" && !e.repeat) {
            state.spaceDown = true;
            e.preventDefault();
            return;
          }

          if (!e.metaKey && !e.ctrlKey && !e.altKey && /^[1-9]$/.test(e.key)) {
            const index = +e.key - 1;
            if (index < state.palette.length) {
              e.preventDefault();
              selectPaletteIndex(index);
              setTool("brush");
            }
            return;
          }

          const mod = e.metaKey || e.ctrlKey;
          if (mod && (e.key === "z" || e.key === "Z") && !e.shiftKey) {
            e.preventDefault();
            undo();
            return;
          }
          if (mod && (e.key === "z" || e.key === "Z") && e.shiftKey) {
            e.preventDefault();
            redo();
            return;
          }
          if (mod && (e.key === "c" || e.key === "C")) {
            e.preventDefault();
            copySelection();
            return;
          }
          if (mod && (e.key === "x" || e.key === "X")) {
            e.preventDefault();
            cutSelection();
            return;
          }
          if (mod && (e.key === "v" || e.key === "V")) {
            e.preventDefault();
            pasteFromUser();
            return;
          }
          if (e.key === "Escape") {
            e.preventDefault();
            if (quickMenu.open) {
              closeQuickMenu(false);
              return;
            }
            if (colorPicker.open) {
              closeColorPicker();
              return;
            }
            clearSelection();
            return;
          }
          if (e.key === "Delete" || e.key === "Backspace" || ((!e.metaKey && !e.ctrlKey && !e.altKey) && (e.key === "x" || e.key === "X"))) {
            if (state.selection || state.float) {
              e.preventDefault();
              deleteSelection();
            }
            return;
          }
          if (!mod && (e.key === "b" || e.key === "B")) {
            setTool("brush");
            return;
          }
          if (!mod && (e.key === "e" || e.key === "E")) {
            setTool("eraser");
            return;
          }
          if (!mod && (e.key === "l" || e.key === "L")) {
            setTool("line");
            return;
          }
          if (!mod && (e.key === "s" || e.key === "S")) {
            setTool("select");
            return;
          }
          if (!mod && (e.key === "i" || e.key === "I")) {
            setTool("eyedropper");
            return;
          }
          if (
            !mod &&
            (state.tool === "satsync" || state.tool === "huesync") &&
            (e.key === "-" || e.key === "_" || e.key === "=" || e.key === "+")
          ) {
            e.preventDefault();
            if (state.hoverVisible) {
              const dir = e.key === "-" || e.key === "_" ? -1 : 1;
              nudgeSyncAt(state.hover.x, state.hover.y, dir, e.shiftKey);
            }
            return;
          }
          if (!mod && e.key === "Tab") {
            e.preventDefault();
            const tools = ["brush", "eraser", "line", "select", "eyedropper", "satsync", "huesync"];
            const idx = tools.indexOf(state.tool);
            const next = e.shiftKey
              ? tools[(idx <= 0 ? tools.length : idx) - 1]
              : tools[(idx + 1) % tools.length];
            setTool(next);
          }
        });

        window.addEventListener("keyup", (e) => {
          if (e.key === "Shift") {
            state.shiftDown = false;
            if (state.lining) state.needsDraw = true;
            if (state.selecting) refreshSelectingRect(state.snap);
          }
          if (e.code === "Space") {
            state.spaceDown = false;
            if (!state.pointers.size) {
              state.panning = false;
              canvas.classList.remove("panning");
            }
          }
        });

        bgColorInput.addEventListener("click", () => {
          openColorPicker(bgColorInput, state.bgColor, (hex) => {
            state.bgColor = hex;
            setSwatchEl(bgColorInput, hex);
            canvas.style.background = hex;
            saveSettings();
            state.needsDraw = true;
          });
        });

        accentColorInput.addEventListener("click", () => {
          openColorPicker(accentColorInput, state.accentColor, (hex) => {
            state.accentColor = hex;
            setSwatchEl(accentColorInput, hex);
            saveSettings();
            state.needsDraw = true;
          });
        });

        hueLabelsEnabledInput.addEventListener("change", () => {
          state.hueLabelsEnabled = hueLabelsEnabledInput.checked;
          saveSettings();
          state.needsDraw = true;
        });
        satLabelsEnabledInput.addEventListener("change", () => {
          state.satLabelsEnabled = satLabelsEnabledInput.checked;
          saveSettings();
          state.needsDraw = true;
        });
        pixelGridEnabledInput.addEventListener("change", () => {
          state.pixelGridEnabled = pixelGridEnabledInput.checked;
          saveSettings();
          state.needsDraw = true;
        });
        pixelGridColorInput.addEventListener("click", () => {
          openColorPicker(pixelGridColorInput, state.pixelGridColor, (hex) => {
            state.pixelGridColor = hex;
            setSwatchEl(pixelGridColorInput, hex);
            saveSettings();
            state.needsDraw = true;
          });
        });

        gridEnabledInput.addEventListener("change", () => {
          state.gridEnabled = gridEnabledInput.checked;
          saveSettings();
          state.needsDraw = true;
        });
        gridColorInput.addEventListener("click", () => {
          openColorPicker(gridColorInput, state.gridColor, (hex) => {
            state.gridColor = hex;
            setSwatchEl(gridColorInput, hex);
            saveSettings();
            state.needsDraw = true;
          });
        });

        bindOptionalNumber(gridXInput, {
          get: () => state.gridCellX,
          set: (v) => {
            state.gridCellX = v;
          },
          parse: (raw, fallback) => clampInt(raw, 1, 512, fallback),
          onChange: () => {
            saveSettings();
            state.needsDraw = true;
          },
        });
        bindOptionalNumber(gridYInput, {
          get: () => state.gridCellY,
          set: (v) => {
            state.gridCellY = v;
          },
          parse: (raw, fallback) => clampInt(raw, 1, 512, fallback),
          onChange: () => {
            saveSettings();
            state.needsDraw = true;
          },
        });
        bindOptionalNumber(gridThickInput, {
          get: () => state.gridThick,
          set: (v) => {
            state.gridThick = v;
          },
          parse: (raw, fallback) => clampFloat(raw, 0.5, 8, fallback),
          onChange: () => {
            saveSettings();
            state.needsDraw = true;
          },
        });
        bindOptionalNumber(pixelGridThickInput, {
          get: () => state.pixelGridThick,
          set: (v) => {
            state.pixelGridThick = v;
          },
          parse: (raw, fallback) => clampFloat(raw, 0.5, 8, fallback),
          onChange: () => {
            saveSettings();
            state.needsDraw = true;
          },
        });

        const settingsBtn = document.getElementById("btn-settings");
        const settingsPanel = document.getElementById("settings-panel");
        settingsBtn.addEventListener("click", () => {
          const open = settingsPanel.classList.toggle("open");
          settingsPanel.hidden = !open;
          settingsBtn.classList.toggle("active", open);
          settingsBtn.setAttribute("aria-pressed", open ? "true" : "false");
        });

        brushSizeInput.addEventListener("input", () => {
          setBrushSize(+brushSizeInput.value);
        });

        brushBtn.addEventListener("click", () => setTool("brush"));
        eraserBtn.addEventListener("click", () => setTool("eraser"));
        lineBtn.addEventListener("click", () => setTool("line"));
        selectBtn.addEventListener("click", () => setTool("select"));
        eyedropperBtn.addEventListener("click", () => setTool("eyedropper"));
        satSyncBtn.addEventListener("click", () => setTool("satsync"));
        hueSyncBtn.addEventListener("click", () => setTool("huesync"));
        undoBtn.addEventListener("click", () => undo());
        redoBtn.addEventListener("click", () => redo());
        snapBtn.addEventListener("click", () => setSnap(!state.snap));
        deleteBtn.addEventListener("click", () => deleteSelection());
        cutBtn.addEventListener("click", () => cutSelection());
        copyBtn.addEventListener("click", () => copySelection());
        pasteBtn.addEventListener("click", () => pasteFromUser());
        importBtn.addEventListener("click", () => importFile.click());
        importFile.addEventListener("change", () => {
          const file = importFile.files && importFile.files[0];
          importFile.value = "";
          if (file) importImageFile(file);
        });
        downloadBtn.addEventListener("click", () => downloadSelectionPng());
        publishBtn.addEventListener("click", () => publishSelectionPng());

        window.addEventListener("paste", (e) => {
          if (isTypingTarget(e.target)) return;
          const file = imageFileFromClipboardData(e.clipboardData);
          if (!file) return;
          e.preventDefault();
          importImageFile(file, {
            maxDim: PASTE_MAX_DIM,
            maxBytes: PASTE_MAX_BYTES,
          });
        });

        window.addEventListener("dragenter", (e) => {
          if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) {
            e.preventDefault();
          }
        });
        window.addEventListener("dragover", (e) => {
          if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) {
            e.preventDefault();
            e.dataTransfer.dropEffect = "copy";
          }
        });
        window.addEventListener("drop", (e) => {
          const file =
            e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
          if (!file) return;
          e.preventDefault();
          // Place under drop cursor
          const p = clientPos(e);
          state.hover = screenToWorld(p.x, p.y);
          importImageFile(file);
        });

        canvas.addEventListener("auxclick", (e) => e.preventDefault());
        canvas.addEventListener("contextmenu", (e) => e.preventDefault());
        window.addEventListener("resize", resize);

        function startApp() {
          applySchemeCanvasDefaults();
          loadSettings();
          syncSettingsUi();
          syncSizeHud();
          syncSnapUi();
          buildPalette();
          // Apply tool UI without wiping restored selection
          brushBtn.classList.toggle("active", state.tool === "brush");
          eraserBtn.classList.toggle("active", state.tool === "eraser");
          lineBtn.classList.toggle("active", state.tool === "line");
          selectBtn.classList.toggle("active", state.tool === "select");
          eyedropperBtn.classList.toggle("active", state.tool === "eyedropper");
          brushBtn.setAttribute("aria-pressed", state.tool === "brush" ? "true" : "false");
          eraserBtn.setAttribute("aria-pressed", state.tool === "eraser" ? "true" : "false");
          lineBtn.setAttribute("aria-pressed", state.tool === "line" ? "true" : "false");
          selectBtn.setAttribute("aria-pressed", state.tool === "select" ? "true" : "false");
          eyedropperBtn.setAttribute("aria-pressed", state.tool === "eyedropper" ? "true" : "false");
          syncSyncToolUi();
          canvas.style.cursor = state.tool === "eyedropper" ? "copy" : "crosshair";
          resize();
          if (!hasSavedCamera) {
            state.camX = window.innerWidth / 2;
            state.camY = window.innerHeight / 2;
          }
          syncActionButtons();
          setExportMessage("");
          state.needsDraw = true;
          window.addEventListener("beforeunload", () => saveSettings(true));
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "hidden") saveSettings(true);
          });
          frame(0);
        }

        // In the app, restore the saved file into localStorage before loading.
        readNativeSettings().then(startApp);
      })();
    </script>
  </body>
</html>
