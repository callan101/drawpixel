      :root {
        --bg0: #f2f2f2;
        --panel: #ffffff;
        --ink: #1a1a1a;
        --muted: #6a6a6a;
        --line: #c8c8c8;
        --accent: #1a1a1a;
        --hud: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg0: #141414;
          --panel: #1c1c1c;
          --ink: #ececec;
          --muted: #8a8a8a;
          --line: #3a3a3a;
          --accent: #ececec;
          --hud: #1c1c1c;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg0);
        color: var(--ink);
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      #stage {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
        background: var(--bg0);
      }

      #stage.panning,
      #stage.moving {
        cursor: grabbing;
      }

      .hud {
        position: fixed;
        z-index: 2;
        display: flex;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--panel);
      }

      .hud-tools {
        top: 50%;
        left: calc(16px + env(safe-area-inset-left));
        transform: translateY(-50%);
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        padding: 10px;
        width: 66px;
        max-height: calc(100vh - 32px);
        overflow: auto;
      }

      .hud-palette {
        top: 50%;
        right: calc(16px + env(safe-area-inset-right));
        transform: translateY(-50%);
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        padding: 10px;
        width: 64px;
        max-height: calc(100vh - 32px);
        overflow: auto;
      }

      .hud-size {
        left: 50%;
        bottom: calc(16px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .hud-size .size-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .hud-size .size-controls.inactive {
        opacity: 0.45;
      }

      .hud-size .tool {
        width: 36px;
        height: 36px;
      }

      .hud-size input[type="range"] {
        width: 140px;
        margin: 0;
        accent-color: var(--ink);
        cursor: pointer;
      }

      .hud-size #brush-size-val {
        min-width: 1.5em;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .tool-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .tool-group.icons {
        flex-direction: column;
        flex-wrap: nowrap;
        width: auto;
      }

      .panel-label {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .tool.tool-text {
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .tool {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        margin: 0;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--panel);
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }

      .tool svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .tool.active {
        border-color: var(--ink);
        background: var(--ink);
        color: var(--panel);
      }

      .tool:hover:not(:disabled):not(.active) {
        border-color: var(--muted);
      }

      .tool:disabled {
        opacity: 0.35;
        cursor: default;
      }

      .hud-settings {
        top: 50%;
        left: calc(90px + env(safe-area-inset-left));
        transform: translateY(-50%);
        display: none;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        width: 176px;
        padding: 10px;
        max-height: calc(100vh - 32px);
        overflow: auto;
      }

      .hud-settings.open {
        display: flex;
      }

      .palette-grid {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .palette-slot {
        position: relative;
        display: block;
        width: 100%;
        aspect-ratio: 1;
        margin: 0;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 2px;
        cursor: pointer;
        overflow: hidden;
        background: #ddd;
        font: inherit;
        color: inherit;
        appearance: none;
        -webkit-appearance: none;
        /* Swatches are draggable (reorder / drag off to delete). */
        touch-action: none;
      }


      /* Catches every pointer while open so nothing underneath reacts. */
      .quick-menu {
        position: fixed;
        inset: 0;
        z-index: 25;
        touch-action: none;
      }

      .qm-svg {
        position: absolute;
        overflow: visible;
        filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.18));
      }

      /* Transforms are driven every pointer move by proximity; the short
         transition just smooths over gaps between events. */
      .qm-item {
        transform-box: fill-box;
        transform-origin: center;
        transition: transform 0.07s linear;
      }

      .qm-arc {
        fill: var(--panel);
        stroke: var(--line);
        stroke-width: 1;
        transition: fill 0.1s, stroke 0.1s, stroke-width 0.1s;
      }

      .qm-icon {
        fill: none;
        stroke: var(--ink);
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .qm-sub {
        transform-box: view-box;
        transform-origin: 50% 50%;
        transition: opacity 0.1s linear, transform 0.1s linear;
      }

      .qm-colors.expanded .qm-arc {
        stroke: var(--ink);
        stroke-width: 2.5;
      }

      .qm-flex .qm-arc {
        stroke-dasharray: 3 3;
      }

      .qm-item.current .qm-arc {
        stroke: var(--ink);
        stroke-width: 1.5;
      }

      .qm-item.empty {
        opacity: 0.35;
      }

      .qm-item.hot .qm-arc {
        stroke: var(--ink);
        stroke-width: 2.5;
      }

      .qm-tool.hot .qm-arc {
        fill: var(--ink);
      }

      .qm-tool.hot .qm-icon {
        stroke: var(--panel);
      }

      .qm-center {
        position: absolute;
        display: grid;
        place-items: center;
        border: 1px dashed var(--line);
        border-radius: 50%;
        background: var(--panel);
        color: var(--muted);
        font-size: 10px;
        line-height: 1.1;
        text-align: center;
        overflow: hidden;
      }

      .palette-slot[data-index] {
        transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
      }

      /* Hover: same border cue as tools, plus a slight lift hinting it can be dragged. */
      .palette-slot[data-index]:hover:not(.active):not(.placeholder) {
        border-color: var(--muted);
      }

      .palette-slot[data-index]:hover:not(.placeholder) {
        transform: translateY(-1px);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
        cursor: grab;
      }

      .palette-slot.placeholder {
        opacity: 0.25;
      }

      .palette-slot.placeholder.discarding {
        display: none;
      }

      .palette-ghost {
        position: fixed;
        z-index: 30;
        margin: 0;
        pointer-events: none;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        transform: scale(1.08);
        transition: transform 0.12s, opacity 0.12s;
      }

      .palette-ghost.discard {
        opacity: 0.4;
        transform: scale(0.8) rotate(-8deg);
      }

      .palette-slot.copied {
        outline: 2px solid #3a9d5d;
        outline-offset: 1px;
      }

      .palette-slot.active {
        outline: 1px solid var(--ink);
        outline-offset: 1px;
      }

      .palette-slot .idx {
        position: absolute;
        left: 4px;
        top: 3px;
        z-index: 1;
        font-size: 11px;
        line-height: 1;
        color: #fff;
        mix-blend-mode: difference;
        pointer-events: none;
      }

      .palette-slot.palette-add {
        display: grid;
        place-items: center;
        background: transparent;
        border-style: dashed;
        color: var(--muted);
        font-size: 22px;
        line-height: 1;
        font-weight: 400;
      }

      .palette-slot.palette-add:hover {
        border-color: var(--ink);
        color: var(--ink);
      }

      .palette-slot.palette-add .idx {
        display: none;
      }


      .settings-block {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .settings-row {
        display: grid;
        grid-template-columns: 32px 1fr;
        align-items: center;
        gap: 8px;
      }

      .settings-row.wide {
        grid-template-columns: 1fr;
      }

      .settings-row label {
        color: var(--muted);
        font-size: 11px;
      }

      .settings-row input[type="number"],
      .settings-row input[type="text"] {
        width: 100%;
        min-width: 0;
        margin: 0;
        padding: 7px 8px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--bg0);
        color: var(--ink);
        font: inherit;
        font-size: 12px;
        -moz-appearance: textfield;
      }

      .settings-row input[type="number"]::-webkit-outer-spin-button,
      .settings-row input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .color-field {
        height: 30px;
      }

      .color-swatch {
        display: block;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 2px;
        cursor: pointer;
        background: #888;
      }

      .color-swatch:hover {
        border-color: var(--muted);
      }

      .color-popover {
        position: fixed;
        z-index: 20;
        display: none;
        flex-direction: column;
        gap: 10px;
        width: 200px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--panel);
        color: var(--ink);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      }

      .color-popover.open {
        display: flex;
      }

      .color-popover .sv-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        border: 1px solid var(--line);
        border-radius: 2px;
        cursor: crosshair;
        touch-action: none;
      }

      .color-popover .sv-wrap canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .color-popover .sv-cursor {
        position: absolute;
        width: 12px;
        height: 12px;
        margin: -6px 0 0 -6px;
        border: 2px solid #fff;
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55);
        pointer-events: none;
      }

      .color-popover .slider-stack {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .color-popover .slider-row {
        display: grid;
        grid-template-columns: 28px 1fr 40px;
        gap: 8px;
        align-items: center;
      }

      .color-popover .slider-row label {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .color-popover .slider-wrap {
        position: relative;
        height: 14px;
        border: 1px solid var(--line);
        border-radius: 2px;
        cursor: pointer;
        touch-action: none;
      }

      .color-popover .hue-wrap {
        background: linear-gradient(
          to right,
          #ff0000,
          #ffff00,
          #00ff00,
          #00ffff,
          #0000ff,
          #ff00ff,
          #ff0000
        );
      }

      .color-popover .slider-cursor {
        position: absolute;
        top: 50%;
        width: 10px;
        height: 18px;
        margin: -9px 0 0 -5px;
        border: 2px solid #fff;
        border-radius: 2px;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55);
        pointer-events: none;
        background: transparent;
      }

      .color-popover .hex-row {
        display: grid;
        grid-template-columns: 28px 1fr;
        gap: 8px;
        align-items: center;
      }

      .color-popover .hex-preview {
        width: 28px;
        height: 28px;
        border: 1px solid var(--line);
        border-radius: 2px;
      }

      .color-popover .num-input {
        width: 100%;
        margin: 0;
        padding: 2px 4px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--bg0);
        color: var(--ink);
        font: inherit;
        font-size: 11px;
        text-align: right;
        -moz-appearance: textfield;
      }

      .color-popover .num-input::-webkit-inner-spin-button,
      .color-popover .num-input::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .color-popover .hex-input {
        width: 100%;
        min-width: 0;
        margin: 0;
        padding: 7px 8px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--bg0);
        color: var(--ink);
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .grid-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 11px;
        cursor: pointer;
      }

      .grid-toggle input {
        accent-color: var(--ink);
      }

      .export-link.tool {
        text-decoration: none;
        color: inherit;
      }

      .export-link[hidden],
      #export-copied[hidden] {
        display: none;
      }

      #export-copied:disabled {
        opacity: 1;
        cursor: default;
      }

      #export-copied.active-ok {
        color: var(--ink);
      }

    </style>
  </head>

    <script>
      (() => {
        const STORAGE_KEY = "draw.settings.v1";

        // Native (Capacitor) app: `native` holds its plugins. In a browser it's
        // null and everything behaves exactly as on the web.
        const cap = window.Capacitor;
        const native =
          cap && typeof cap.isNativePlatform === "function" && cap.isNativePlatform()
            ? cap.Plugins || {}
            : null;
        // iOS can clear a web view's localStorage when storage is low, so the
        // app also keeps settings + drawing in a file.
        const NATIVE_SETTINGS_FILE = "draw-settings.json";

        function writeNativeSettings(json) {
          if (!native || !native.Filesystem) return;
          native.Filesystem.writeFile({
            path: NATIVE_SETTINGS_FILE,
            data: json,
            directory: "DATA",
            encoding: "utf8",
          }).catch(() => {});
        }

        async function readNativeSettings() {
          if (!native || !native.Filesystem) return;
          try {
            const res = await native.Filesystem.readFile({
              path: NATIVE_SETTINGS_FILE,
              directory: "DATA",
              encoding: "utf8",
            });
            if (typeof res.data === "string" && res.data) {
              localStorage.setItem(STORAGE_KEY, res.data);
            }
          } catch (_) {
            /* first run, or no file yet */
          }
        }
        const DEFAULT_PALETTE = [
          "#f4f0e6",
          "#d6ff3c",
          "#5ac8ff",
          "#ff6b4a",
          "#1a1e27",
        ];
        const MAX_PALETTE_SIZE = 32;
        const DISCARD_MARGIN = 24; // px outside the palette bar that deletes on drop
        const TAP_MAX_MS = 300;
        const TAP_MAX_MOVE = 10;
        // QuickShape: hold still at the end of a brush/eraser stroke to snap it
        // into a straight line from where the stroke started.
        const QS_HOLD_MS = 500;
        const QS_STILL_PX = 6; // movement under this (screen px) counts as still

        const canvas = document.getElementById("stage");
        const ctx = canvas.getContext("2d", { alpha: false });
        const paletteEl = document.getElementById("palette");
        const brushBtn = document.getElementById("tool-brush");
        const eraserBtn = document.getElementById("tool-eraser");
        const lineBtn = document.getElementById("tool-line");
        const selectBtn = document.getElementById("tool-select");
        const eyedropperBtn = document.getElementById("tool-eyedropper");
        const satSyncBtn = document.getElementById("tool-satsync");
        const hueSyncBtn = document.getElementById("tool-huesync");
        const sizeControls = document.getElementById("size-controls");

        function normalizeHex(c) {

        function hexToRgb(hex) {

        function rgbToHex(r, g, b) {

        function rgbToHsv(r, g, b) {
          r /= 255;
          g /= 255;
          b /= 255;
          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);
          const d = max - min;
          let h = 0;
          if (d) {
            if (max === r) h = ((g - b) / d) % 6;
            else if (max === g) h = (b - r) / d + 2;
            else h = (r - g) / d + 4;
            h *= 60;
            if (h < 0) h += 360;
          }
          return { h, s: max === 0 ? 0 : d / max, v: max };

        function hsvToRgb(h, s, v) {
          const c = v * s;
          const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
          const m = v - c;
          let r = 0, g = 0, b = 0;
          if (h < 60) [r, g, b] = [c, x, 0];
          else if (h < 120) [r, g, b] = [x, c, 0];
          else if (h < 180) [r, g, b] = [0, c, x];
          else if (h < 240) [r, g, b] = [0, x, c];
          else if (h < 300) [r, g, b] = [x, 0, c];
          else [r, g, b] = [c, 0, x];
          return { r: (r + m) * 255, g: (g + m) * 255, b: (b + m) * 255 };
        }

        function hsvToHex(h, s, v) {
          const { r, g, b } = hsvToRgb(h, s, v);

        function setSwatchEl(el, hex) {

        function clampInt(n, lo, hi, fallback) {

          return Math.max(lo, Math.min(hi, v));
        }

        function clampFloat(n, lo, hi, fallback) {
          if (n === "" || n == null) return fallback;
          const v = Number(n);

        function serializePixelMap(map) {
          const out = [];

        function deserializePixelMap(entries) {
          const map = new Map();
          if (!Array.isArray(entries)) return map;
          for (const entry of entries) {
            if (typeof entry === "string") {
              const sep = entry.indexOf("|");
              if (sep < 0) continue;
              map.set(entry.slice(0, sep), entry.slice(sep + 1));
            } else if (Array.isArray(entry) && entry.length >= 2) {
              map.set(String(entry[0]), String(entry[1]));
            }
          }
          return map;
        }

          if (withPalette) {

            snap.paletteIndex = state.paletteIndex;

          return snap;

        function applyHistory(snap) {
          pixels.clear();
          for (const [k, c] of snap.pixels) pixels.set(k, c);
          state.float = snap.float;
          state.selection = snap.selection;

        function loadSettings() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);

            const data = JSON.parse(raw);

                .filter((c) => /^#[0-9a-f]{6}$/.test(c));

        function normRect(a, b) {
          const x0 = Math.min(a.x, b.x);

          const y1 = Math.max(a.y, b.y);

        /** Selection covering whole major-grid cells from point a through b. */

          const gx = Math.max(1, state.gridCellX | 0);

          const ax0 = Math.floor(a.x / gx) * gx;
          const ay0 = Math.floor(a.y / gy) * gy;
          const bx0 = Math.floor(b.x / gx) * gx;
          const by0 = Math.floor(b.y / gy) * gy;
          const left = Math.min(ax0, bx0);
          const top = Math.min(ay0, by0);
          const right = Math.max(ax0 + gx, bx0 + gx);
          const bottom = Math.max(ay0 + gy, by0 + gy);
          return { x: left, y: top, w: right - left, h: bottom - top };

        function constrainLineEnd(start, end) {

        function extractRect(rect, remove) {
          const out = new Map();
          for (let y = rect.y; y < rect.y + rect.h; y++) {

              const k = key(x, y);
              if (!pixels.has(k)) continue;
              out.set(key(x - rect.x, y - rect.y), pixels.get(k));

          return { w: rect.w, h: rect.h, pixels: out };

        function stampClip(clip, ox, oy) {

            "Hue Sync" +
            (state.syncHue == null ? "" : " · " + Math.round(state.syncHue) + "°") +
            " · shift-click a pixel to sample · - / = adjust";
        }

        // Saturation / Hue Sync: sample a target from a pixel, then apply it
        // to other pixels keeping their other HSV components.
        function pixelHsv(x, y) {
          const color = pixels.get(key(x, y));
          if (!color) return null;
          const { r, g, b } = hexToRgb(color);
          return rgbToHsv(r, g, b);
        }

        function sampleSyncAt(x, y) {
          const hsv = pixelHsv(x, y);
          if (!hsv) return;
          if (state.tool === "satsync") state.syncSat = hsv.s;
          else state.syncHue = hsv.h;
          syncSyncToolUi();
          saveSettings();
        }

        function applySyncAt(x, y) {
          const hsv = pixelHsv(x, y);
          if (!hsv) return;
          if (state.tool === "satsync") hsv.s = state.syncSat;
          else hsv.h = state.syncHue;
          setPixel(x, y, hsvToHex(hsv.h, hsv.s, hsv.v));
        }

        // `-` / `=`: nudge the hovered pixel's saturation (5%) or hue (5°);
        // hold Shift for steps of 1.
        function nudgeSyncAt(x, y, dir, fine) {
          const hsv = pixelHsv(x, y);
          if (!hsv) return;
          pushUndo();
          if (state.tool === "satsync") {
            hsv.s = Math.min(1, Math.max(0, hsv.s + (dir * (fine ? 1 : 5)) / 100));
          } else {
            hsv.h = (((hsv.h + dir * (fine ? 1 : 5)) % 360) + 360) % 360;
          }
          setPixel(x, y, hsvToHex(hsv.h, hsv.s, hsv.v));
        }

        function setTool(tool) {
          if (tool !== state.tool) state.prevTool = state.tool;
          if (state.float && tool !== "select") {
            pushUndo();
            commitFloat();
          }
          state.tool = tool;
          state.lining = false;
          state.lineStart = null;
          state.lineEnd = null;
          brushBtn.classList.toggle("active", tool === "brush");
          eraserBtn.classList.toggle("active", tool === "eraser");
          lineBtn.classList.toggle("active", tool === "line");
          selectBtn.classList.toggle("active", tool === "select");
          eyedropperBtn.classList.toggle("active", tool === "eyedropper");
          brushBtn.setAttribute("aria-pressed", tool === "brush" ? "true" : "false");
          eraserBtn.setAttribute("aria-pressed", tool === "eraser" ? "true" : "false");
          lineBtn.setAttribute("aria-pressed", tool === "line" ? "true" : "false");
          selectBtn.setAttribute("aria-pressed", tool === "select" ? "true" : "false");
          eyedropperBtn.setAttribute("aria-pressed", tool === "eyedropper" ? "true" : "false");
          syncSyncToolUi();
          if (tool !== "select") {
            state.selection = null;
            state.selecting = false;
          }
          canvas.style.cursor = tool === "eyedropper" ? "copy" : "crosshair";
          syncSizeHud();
          syncActionButtons();
          state.needsDraw = true;
          saveSettings();
        }

        function selectPaletteIndex(index) {
          if (index < 0 || index >= state.palette.length) return;
          state.paletteIndex = index;
          state.color = state.palette[index];
          syncPaletteActive();
          saveSettings();
        }

        function setSlotColor(index, color) {
          const hex = normalizeHex(color);
          if (!/^#[0-9a-f]{6}$/.test(hex)) return;
          if (index < 0 || index >= state.palette.length) return;
          state.palette[index] = hex;
          const slot = paletteEl.querySelector(
            '.palette-slot[data-index="' + index + '"]'
          );
          if (slot) {
            slot.style.background = hex;
            slot.dataset.color = hex;
            slot.title =
              index + 1 + ": " + hex + " · click select/edit · drag to reorder · drag off to delete";
          }
          if (state.paletteIndex === index) state.color = hex;
          saveSettings();
          state.needsDraw = true;
        }

        function addPaletteSlot(color) {
          if (state.palette.length >= MAX_PALETTE_SIZE) return;
          const hex =
            normalizeHex(color) ||
            state.color ||
            DEFAULT_PALETTE[0];
          state.palette.push(/^#[0-9a-f]{6}$/.test(hex) ? hex : DEFAULT_PALETTE[0]);
          state.paletteIndex = state.palette.length - 1;
          state.color = state.palette[state.paletteIndex];
          buildPalette();
          saveSettings();
          state.needsDraw = true;
        }

        function removePaletteSlot(index) {
          if (state.palette.length <= 1) return;
          if (index < 0 || index >= state.palette.length) return;
          pushUndo(true);
          state.palette.splice(index, 1);
          if (state.paletteIndex > index) state.paletteIndex -= 1;
          if (state.paletteIndex >= state.palette.length) {
            state.paletteIndex = state.palette.length - 1;
          }
          state.color = state.palette[state.paletteIndex];
          closeColorPicker();
          buildPalette();
          saveSettings();
          state.needsDraw = true;
        }

        function sampleColorAt(wx, wy) {
          if (state.float) {
            const fx = wx - state.float.x;
            const fy = wy - state.float.y;
            if (
              fx >= 0 &&
              fy >= 0 &&
              fx < state.float.w &&
              fy < state.float.h
            ) {
              const floated = state.float.pixels.get(key(fx, fy));
              if (floated) return normalizeHex(floated) || floated;
            }
          }
          const painted = pixels.get(key(wx, wy));
          if (painted) return normalizeHex(painted) || painted;
          return normalizeHex(state.bgColor) || state.bgColor;
        }

        function applyEyedropperAt(wx, wy) {
          const hex = sampleColorAt(wx, wy);
          if (!/^#[0-9a-f]{6}$/.test(hex)) return;
          const existing = state.palette.findIndex((c) => c === hex);
          if (existing >= 0) {
            selectPaletteIndex(existing);
          } else if (state.palette.length < MAX_PALETTE_SIZE) {
            addPaletteSlot(hex);
          } else {
            setSlotColor(state.paletteIndex, hex);
          }
          setTool("brush");
        }

        function syncPaletteActive() {
          for (const btn of paletteEl.querySelectorAll(".palette-slot[data-index]")) {
            const idx = +btn.dataset.index;
            btn.classList.toggle("active", idx === state.paletteIndex);
          }
        }

        const colorPopover = document.getElementById("color-popover");
        const cpSv = document.getElementById("cp-sv");
        const cpSvCanvas = document.getElementById("cp-sv-canvas");
        const cpSvCtx = cpSvCanvas.getContext("2d");
        const cpSvCursor = document.getElementById("cp-sv-cursor");
        const cpHue = document.getElementById("cp-hue");
        const cpHueCursor = document.getElementById("cp-hue-cursor");
        const cpSat = document.getElementById("cp-sat");
        const cpSatCursor = document.getElementById("cp-sat-cursor");
        const cpBri = document.getElementById("cp-bri");
        const cpBriCursor = document.getElementById("cp-bri-cursor");
        const cpPreview = document.getElementById("cp-preview");
        const cpHex = document.getElementById("cp-hex");
        // H/S/B number fields: [input, max]. Hue is degrees, sat/bri percent.
        const cpNums = {
          h: [document.getElementById("cp-hue-num"), 360],
          s: [document.getElementById("cp-sat-num"), 100],
          v: [document.getElementById("cp-bri-num"), 100],
        };

        const colorPicker = {
          open: false,
          h: 0,
          s: 1,
          v: 1,
          hex: "#ffffff",
          onChange: null,
          anchor: null,
          dragging: null,
          skipNextHexChange: false,
        };

        function paintSv() {
          const w = cpSvCanvas.width;
          const h = cpSvCanvas.height;
          const { r, g, b } = hsvToRgb(colorPicker.h, 1, 1);
          const pure = rgbToHex(r, g, b);
          const ctx = cpSvCtx;
          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = pure;
          ctx.fillRect(0, 0, w, h);
          const white = ctx.createLinearGradient(0, 0, w, 0);
          white.addColorStop(0, "#ffffff");
          white.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = white;
          ctx.fillRect(0, 0, w, h);
          const black = ctx.createLinearGradient(0, 0, 0, h);
          black.addColorStop(0, "rgba(0,0,0,0)");
          black.addColorStop(1, "#000000");
          ctx.fillStyle = black;
          ctx.fillRect(0, 0, w, h);
        }

        function paintSatBriSliders() {
          const h = colorPicker.h;
          const s = colorPicker.s;
          const v = colorPicker.v;
          const satLeft = hsvToHex(h, 0, v);
          const satRight = hsvToHex(h, 1, v);
          cpSat.style.background =
            "linear-gradient(to right, " + satLeft + ", " + satRight + ")";
          const briLeft = "#000000";
          const briRight = hsvToHex(h, s, 1);
          cpBri.style.background =
            "linear-gradient(to right, " + briLeft + ", " + briRight + ")";
        }

        function syncPickerUi(preserveHexField) {
          // colorPicker.hex is authoritative. HSV is only for the sliders;
          // converting HSV→RGB can drift by 1 (e.g. #6410ff ↔ #6310ff).
          const hex = colorPicker.hex || hsvToHex(colorPicker.h, colorPicker.s, colorPicker.v);
          cpPreview.style.background = hex;
          if (!preserveHexField) cpHex.value = hex;
          cpSvCursor.style.left = colorPicker.s * 100 + "%";
          cpSvCursor.style.top = (1 - colorPicker.v) * 100 + "%";
          cpHueCursor.style.left = (colorPicker.h / 360) * 100 + "%";
          cpHueCursor.style.background = hsvToHex(colorPicker.h, 1, 1);
          cpSatCursor.style.left = colorPicker.s * 100 + "%";
          cpSatCursor.style.background = hex;
          cpBriCursor.style.left = colorPicker.v * 100 + "%";
          cpBriCursor.style.background = hex;
          for (const k in cpNums) {
            const [input, max] = cpNums[k];
            // Don't rewrite the field being typed in.
            if (document.activeElement === input) continue;
            input.value = String(Math.round(k === "h" ? colorPicker.h : colorPicker[k] * max));
          }
          paintSatBriSliders();
          paintSv();
          if (colorPicker.onChange) colorPicker.onChange(hex);
        }

        function setPickerFromHex(hex) {
          const h = normalizeHex(hex);
          if (!/^#[0-9a-f]{6}$/.test(h)) return false;
          const rgb = hexToRgb(h);
          const hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
          colorPicker.h = hsv.h;
          colorPicker.s = hsv.s;
          colorPicker.v = hsv.v;
          colorPicker.hex = h;
          return true;
        }

        for (const k in cpNums) {
          const [input, max] = cpNums[k];
          input.addEventListener("input", () => {
            const n = parseFloat(input.value);
            if (!Number.isFinite(n)) return;
            const c = Math.min(max, Math.max(0, n));
            colorPicker[k] = k === "h" ? c : c / max;
            setPickerFromHsv();
            syncPickerUi(false);
          });
          input.addEventListener("blur", () => syncPickerUi(false));
          input.addEventListener("keydown", (e) => {
            e.stopPropagation(); // keep tool shortcuts out of the field
            if (e.key === "Enter") input.blur();
          });
        }

        function setPickerFromHsv() {
          colorPicker.hex = hsvToHex(colorPicker.h, colorPicker.s, colorPicker.v);
        }

        function placePopover(anchor) {
          colorPopover.hidden = false;
          colorPopover.classList.add("open");
          const ar = anchor.getBoundingClientRect();
          const pr = colorPopover.getBoundingClientRect();
          let left = ar.right + 8;
          let top = ar.top;
          if (left + pr.width > window.innerWidth - 8) {
            left = ar.left - pr.width - 8;
          }
          if (left < 8) left = 8;
          if (top + pr.height > window.innerHeight - 8) {
            top = window.innerHeight - pr.height - 8;
          }
          if (top < 8) top = 8;
          colorPopover.style.left = left + "px";
          colorPopover.style.top = top + "px";
        }

        // paletteSlot: index of the swatch being edited, or null for other swatches.
        function openColorPicker(anchor, hex, onChange, paletteSlot) {
          colorPicker.anchor = anchor;
          colorPicker.paletteSlot = paletteSlot == null ? null : paletteSlot;
          colorPicker.onChange = onChange;
          setPickerFromHex(hex || "#ffffff");
          colorPicker.open = true;
          syncPickerUi(false);
          placePopover(anchor);
        }

        function closeColorPicker() {
          if (!colorPicker.open) return;
          colorPicker.open = false;
          colorPicker.onChange = null;
          colorPicker.anchor = null;
          colorPicker.paletteSlot = null;
          colorPicker.dragging = null;
          colorPopover.classList.remove("open");
          colorPopover.hidden = true;
        }

        function svFromEvent(e) {
          const rect = cpSv.getBoundingClientRect();
          const x = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
          const y = Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height));
          colorPicker.s = x;
          colorPicker.v = 1 - y;
          setPickerFromHsv();
          syncPickerUi(false);
        }

        function sliderXFromEvent(el, e) {
          const rect = el.getBoundingClientRect();
          return Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
        }

        function hueFromEvent(e) {
          colorPicker.h = sliderXFromEvent(cpHue, e) * 360;
          setPickerFromHsv();
          syncPickerUi(false);
        }

        function satFromEvent(e) {
          colorPicker.s = sliderXFromEvent(cpSat, e);
          setPickerFromHsv();
          syncPickerUi(false);
        }

        function briFromEvent(e) {
          colorPicker.v = sliderXFromEvent(cpBri, e);
          setPickerFromHsv();
          syncPickerUi(false);
        }

        function bindSlider(el, key, handler) {
          el.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            el.setPointerCapture(e.pointerId);
            colorPicker.dragging = key;
            handler(e);
          });
          el.addEventListener("pointermove", (e) => {
            if (colorPicker.dragging === key) handler(e);
          });
          el.addEventListener("pointerup", () => {
            colorPicker.dragging = null;
          });
        }

        cpSv.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          cpSv.setPointerCapture(e.pointerId);
          colorPicker.dragging = "sv";
          svFromEvent(e);
        });
        cpSv.addEventListener("pointermove", (e) => {
          if (colorPicker.dragging === "sv") svFromEvent(e);
        });
        cpSv.addEventListener("pointerup", () => {
          colorPicker.dragging = null;
        });

        bindSlider(cpHue, "hue", hueFromEvent);
        bindSlider(cpSat, "sat", satFromEvent);
        bindSlider(cpBri, "bri", briFromEvent);

        function readHexInputValue() {
          let v = cpHex.value.trim();
          if (v && v[0] !== "#") v = "#" + v;
          return normalizeHex(v);
        }

        function commitHexInput() {
          const v = readHexInputValue();
          if (!setPickerFromHex(v)) {
            return false;
          }
          cpHex.value = v;
          syncPickerUi(true);
          return true;
        }

        cpHex.addEventListener("input", () => {
          const v = readHexInputValue();
          // Keep the field as typed while incomplete; only lock when valid.
          if (setPickerFromHex(v)) syncPickerUi(true);
        });
        cpHex.addEventListener("change", () => {
          if (colorPicker.skipNextHexChange) {
            colorPicker.skipNextHexChange = false;
            return;
          }
          if (!colorPicker.open) return;
          if (!commitHexInput()) {
            // Revert invalid text to the last locked hex.
            cpHex.value = colorPicker.hex;
            syncPickerUi(false);
          }
        });
        // Capture phase: the fields stop propagation of their own keys.
        colorPopover.addEventListener(
          "keydown",
          (e) => {
            if (e.key !== "Escape") return;
            e.preventDefault();
            e.stopPropagation();
            // Drop a half-typed hex rather than applying it on blur.
            if (document.activeElement === cpHex) colorPicker.skipNextHexChange = true;
            closeColorPicker();
          },
          true
        );

        cpHex.addEventListener("keydown", (e) => {
          if (e.key !== "Enter") return;
          e.preventDefault();
          e.stopPropagation();
          commitHexInput();
          colorPicker.skipNextHexChange = true;
          closeColorPicker();
        });

        document.addEventListener("pointerdown", (e) => {
          if (!colorPicker.open) return;
          if (colorPopover.contains(e.target)) return;
          if (colorPicker.anchor && colorPicker.anchor.contains(e.target)) return;
          // Tapping another swatch retargets the picker (handled in its click).
          if (
            colorPicker.paletteSlot != null &&
            e.target.closest &&
            e.target.closest(".palette-slot[data-index]")
          ) {
            return;
          }
          closeColorPicker();
        });

        // Drag a swatch to reorder it; drop it off the palette bar to delete it.
        // A press that doesn't move falls through to the normal click.
        const paletteHud = paletteEl.parentElement;
        let paletteDrag = null;

        function swatchTap(slot, i, shiftKey) {
          if (shiftKey) {
            removePaletteSlot(i);
            return;
          }
          const pickerOnSwatch = colorPicker.open && colorPicker.paletteSlot != null;
          if (pickerOnSwatch && colorPicker.paletteSlot === i) {
            closeColorPicker();
          } else if (pickerOnSwatch || state.paletteIndex === i) {
            selectPaletteIndex(i);
            openColorPicker(slot, state.palette[i], (hex) => setSlotColor(i, hex), i);
          } else {
            selectPaletteIndex(i);
          }
        }

        // iOS can still claim a drag as a scroll; block that while a swatch is held.
        paletteHud.addEventListener(
          "touchmove",
          (e) => {
            if (paletteDrag) e.preventDefault();
          },
          { passive: false }
        );

        function paletteDragStart(slot, index, e) {
          if (paletteDrag) return;
          paletteDrag = {
            slot,
            from: index,
            id: e.pointerId,
            sx: e.clientX,
            sy: e.clientY,
            active: false,
            ghost: null,
            offX: 0,
            offY: 0,
            discard: false,
          };
        }

        // On window, not the swatch: reordering moves the swatch in the DOM,
        // which would drop pointer capture mid-drag.
        window.addEventListener("pointermove", paletteDragMove);
        window.addEventListener("pointerup", paletteDragEnd);
        window.addEventListener("pointercancel", paletteDragEnd);

        function paletteDragMove(e) {
          const d = paletteDrag;
          if (!d || e.pointerId !== d.id) return;
          if (!d.active) {
            if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < TAP_MAX_MOVE) return;
            d.active = true;
            closeColorPicker();
            const r = d.slot.getBoundingClientRect();
            d.offX = d.sx - r.left;
            d.offY = d.sy - r.top;
            d.ghost = d.slot.cloneNode(true);
            d.ghost.classList.add("palette-ghost");
            d.ghost.style.width = r.width + "px";
            d.ghost.style.height = r.height + "px";
            document.body.appendChild(d.ghost);
            d.slot.classList.add("placeholder");
          }
          d.ghost.style.left = e.clientX - d.offX + "px";
          d.ghost.style.top = e.clientY - d.offY + "px";

          const pr = paletteHud.getBoundingClientRect();
          const outside =
            e.clientX < pr.left - DISCARD_MARGIN ||
            e.clientX > pr.right + DISCARD_MARGIN ||
            e.clientY < pr.top - DISCARD_MARGIN ||
            e.clientY > pr.bottom + DISCARD_MARGIN;
          d.discard = outside && state.palette.length > 1;
          d.ghost.classList.toggle("discard", d.discard);
          d.slot.classList.toggle("discarding", d.discard);
          if (outside) return;

          // Live reorder preview: move the placeholder before the first swatch
          // whose midpoint is below the pointer.
          let before = paletteEl.querySelector(".palette-add");
          for (const s of paletteEl.querySelectorAll(".palette-slot[data-index]")) {
            if (s === d.slot) continue;
            const r = s.getBoundingClientRect();
            if (e.clientY < r.top + r.height / 2) {
              before = s;
              break;
            }
          }
          if (d.slot.nextSibling !== before) paletteEl.insertBefore(d.slot, before);
        }

        function paletteDragEnd(e) {
          const d = paletteDrag;
          if (!d || e.pointerId !== d.id) return;
          paletteDrag = null;
          if (!d.active) {
            if (e.type === "pointerup") swatchTap(d.slot, d.from, e.shiftKey);
            return;
          }
          d.ghost.remove();

          if (e.type === "pointerup" && d.discard) {
            removePaletteSlot(d.from);
            return;
          }
          const order = [...paletteEl.querySelectorAll(".palette-slot[data-index]")].map(
            (s) => +s.dataset.index
          );
          if (e.type === "pointerup" && order.some((k, pos) => k !== pos)) {
            pushUndo(true);
            const old = state.palette.slice();
            state.palette = order.map((k) => old[k]);
            state.paletteIndex = order.indexOf(state.paletteIndex);
            state.color = state.palette[state.paletteIndex];
            saveSettings();
          }
          buildPalette();
        }

        async function copySwatchColor(slot, hex) {
          try {
            await navigator.clipboard.writeText(hex);
          } catch (_) {
            return;
          }
          slot.classList.add("copied");
          setTimeout(() => slot.classList.remove("copied"), 700);
        }

        function buildPalette() {
          paletteEl.innerHTML = "";
          state.palette.forEach((color, i) => {
            const slot = document.createElement("button");
            slot.type = "button";
            slot.className = "palette-slot";
            slot.dataset.index = String(i);
            slot.dataset.color = color;
            slot.title =
              i + 1 + ": " + color + " · click select/edit · drag to reorder · drag off to delete";
            slot.style.background = color;
            slot.setAttribute("aria-label", "Palette color " + (i + 1));
            const idx = document.createElement("span");
            idx.className = "idx";
            idx.textContent = String(i + 1);
            slot.appendChild(idx);

            slot.addEventListener("pointerdown", (e) => {
              if (e.button === 0) paletteDragStart(slot, i, e);
            });
            slot.addEventListener("contextmenu", (e) => {
              e.preventDefault();
              copySwatchColor(slot, state.palette[i]);
            });

            // Pointer taps are handled on pointerup (iOS drops the click for
            // Pencil taps that move slightly); this only catches keyboard activation.
            slot.addEventListener("click", (e) => {
              if (e.detail !== 0) return;
              swatchTap(slot, i, e.shiftKey);
            });
            paletteEl.appendChild(slot);
          });

          const addBtn = document.createElement("button");
          addBtn.type = "button";
          addBtn.className = "palette-slot palette-add";
          addBtn.title = "Add color slot";
          addBtn.setAttribute("aria-label", "Add color slot");
          addBtn.textContent = "+";
          addBtn.disabled = state.palette.length >= MAX_PALETTE_SIZE;
          addBtn.addEventListener("click", () => {
            addPaletteSlot(state.color);
            const index = state.paletteIndex;
            const slot = paletteEl.querySelector(
              '.palette-slot[data-index="' + index + '"]'
            );
            if (slot) {
              openColorPicker(
                slot,
                state.palette[index],
                (hex) => setSlotColor(index, hex),
                index
              );
            }
          });
          paletteEl.appendChild(addBtn);
          syncPaletteActive();
        }
        function activeSelectionRect() {
          if (state.float) {
            return {
              x: state.float.x,
              y: state.float.y,
              w: state.float.w,
              h: state.float.h,
            };
          }
          return state.selection;
        }

        function ensureSelectionForExport() {
          const rect = activeSelectionRect();
          if (rect) return rect;
          setTool("select");
          setExportMessage("Select an area first");
          return null;
        }

        function buildSelectionPngBlob(rectOverride) {
          if (!rectOverride && state.float) commitFloat();
          const rect = rectOverride || activeSelectionRect();
          if (!rect || rect.w < 1 || rect.h < 1) return null;

          const off = document.createElement("canvas");
          off.width = rect.w;
          off.height = rect.h;
          const octx = off.getContext("2d", { alpha: true });
          octx.clearRect(0, 0, rect.w, rect.h);

          for (let y = 0; y < rect.h; y++) {
            for (let x = 0; x < rect.w; x++) {
              const color = pixels.get(key(rect.x + x, rect.y + y));
              if (!color) continue;
              octx.fillStyle = color;
              octx.fillRect(x, y, 1, 1);
            }
          }

          return new Promise((resolve) => {
            off.toBlob((blob) => resolve(blob), "image/png");
          });
        }

        function setExportMessage(message) {
          // Transient / error feedback lives on the publish control title (hover).
          if (message) {
            publishBtn.title = message;
            publishBtn.setAttribute("aria-label", message);
          } else if (state.lastPublishSelection && !(state.selection || state.float)) {
            publishBtn.title =
              "Copy last area (" +
              state.lastPublishSelection.w +
              "×" +
              state.lastPublishSelection.h +
              ")";
            publishBtn.setAttribute("aria-label", "Copy last area");
          } else {
            publishBtn.title = "Copy selection as image";
            publishBtn.setAttribute("aria-label", "Copy image");
          }
        }

        function clearExportFeedback() {
          exportFeedback.hidden = true;
          exportLink.hidden = true;
          exportCopied.hidden = true;
          exportLink.removeAttribute("href");
        }

        function showExportLink(url) {
          exportFeedback.hidden = false;
          exportLink.hidden = false;
          exportLink.href = url;
          exportLink.title = "Open public link";
          exportCopied.hidden = false;
          exportCopied.title = "Public link copied";
        }

        function rgbToHex(r, g, b) {
          return (
            "#" +
            ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1)
          );
        }

        function placeImportedPixels(map, w, h) {
          pushUndo();
          if (state.float) commitFloat();
          // Drop at hover so it lands under the cursor / drop point
          const ox = state.hover.x;
          const oy = state.hover.y;
          state.float = {
            x: ox,
            y: oy,
            w: w,
            h: h,
            pixels: map,
          };
          state.selection = { x: ox, y: oy, w: w, h: h };
          setTool("select");
          syncActionButtons();
          saveSettings();
          state.needsDraw = true;
        }

        function imageFileFromClipboardData(data) {
          if (!data) return null;
          const items = data.items;
          if (items && items.length) {
            for (let i = 0; i < items.length; i++) {
              const item = items[i];
              if (item && item.type && item.type.startsWith("image/")) {
                const file = item.getAsFile();
                if (file) return file;
              }
            }
          }
          const files = data.files;
          if (files && files.length) {
            for (let i = 0; i < files.length; i++) {
              const file = files[i];
              if (file && String(file.type || "").startsWith("image/")) return file;
            }
          }
          return null;
        }

        async function tryPasteSystemImage() {
          if (navigator.clipboard && typeof navigator.clipboard.read === "function") {
            try {
              const items = await navigator.clipboard.read();
              for (const item of items) {
                const type = (item.types || []).find((t) =>
                  String(t).startsWith("image/")
                );
                if (!type) continue;
                const blob = await item.getType(type);
                const file = new File(
                  [blob],
                  "paste." + (type.split("/")[1] || "png"),
                  { type: blob.type || type }
                );
                await importImageFile(file, {
                  maxDim: PASTE_MAX_DIM,
                  maxBytes: PASTE_MAX_BYTES,
                });
                return true;
              }
            } catch (_) {
              /* permission denied / empty clipboard */
            }
          }
          return false;
        }

        async function pasteFromUser() {
          if (await tryPasteSystemImage()) return;
          pasteClipboard();
        }

        async function importImageFile(file, opts) {
          if (!file) return;
          const options = opts || {};
          const maxBytes =
            options.maxBytes != null ? options.maxBytes : IMPORT_MAX_BYTES;
          const maxDim = options.maxDim != null ? options.maxDim : IMPORT_MAX_DIM;
          if (!String(file.type || "").startsWith("image/")) {
            setExportMessage("Not an image");
            return;
          }
          if (file.size > maxBytes) {
            setExportMessage(
              "Max " +
                (maxBytes >= 1024 * 1024
                  ? Math.round(maxBytes / (1024 * 1024)) + "MB"
                  : Math.round(maxBytes / 1024) + "KB") +
                " (" +
                (file.size >= 1024 * 1024
                  ? (file.size / (1024 * 1024)).toFixed(1) + "MB"
                  : Math.ceil(file.size / 1024) + "KB") +
                ")"
            );
            return;
          }

          setExportMessage("Importing…");
          try {
            let bitmap;
            if (typeof createImageBitmap === "function") {
              bitmap = await createImageBitmap(file);
            } else {
              bitmap = await new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                  URL.revokeObjectURL(url);
                  resolve(img);
                };
                img.onerror = () => {
                  URL.revokeObjectURL(url);
                  reject(new Error("decode failed"));
                };
                img.src = url;
              });
            }

            const w = bitmap.width | 0;
            const h = bitmap.height | 0;
            if (w < 1 || h < 1) {
              setExportMessage("Empty image");
              return;
            }
            if (w > maxDim || h > maxDim) {
              setExportMessage("Max " + maxDim + "×" + maxDim + "px");
              if (bitmap.close) bitmap.close();
              return;
            }

            const off = document.createElement("canvas");
            off.width = w;
            off.height = h;
            const octx = off.getContext("2d", { willReadFrequently: true });
            octx.clearRect(0, 0, w, h);
            octx.drawImage(bitmap, 0, 0);
            if (bitmap.close) bitmap.close();

            const data = octx.getImageData(0, 0, w, h).data;
            const map = new Map();
            for (let y = 0; y < h; y++) {
              for (let x = 0; x < w; x++) {
                const i = (y * w + x) * 4;
                const a = data[i + 3];
                if (a < 8) continue;
                map.set(key(x, y), rgbToHex(data[i], data[i + 1], data[i + 2]));
              }
            }

            if (!map.size) {
              setExportMessage("No opaque pixels");
              return;
            }

            placeImportedPixels(map, w, h);
            setExportMessage("");
          } catch (_) {
            setExportMessage("Import failed");
          }
        }

        /** Bounding box of every painted pixel, or null when the canvas is empty. */
        function contentBounds() {
          if (!pixels.size) return null;
          let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
          for (const k of pixels.keys()) {
            const p = parseKey(k);
            if (p.x < x0) x0 = p.x;
            if (p.y < y0) y0 = p.y;
            if (p.x > x1) x1 = p.x;
            if (p.y > y1) y1 = p.y;
          }
          return { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
        }

        // Artifact viewers block plain download links; use their downloads
        // capability when present, else fall back to an <a download>.
        const downloadsReady =
          window.claude && typeof window.claude.use === "function"
            ? window.claude.use("downloads").catch(() => null)
            : Promise.resolve(null);

        function blobToBase64(blob) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
            reader.onerror = () => reject(reader.error);
            reader.readAsDataURL(blob);
          });
        }

        async function saveBlob(blob, filename) {
          // App: hand the file to the iOS share sheet (Photos, Files, AirDrop…).
          if (native && native.Filesystem && native.Share) {
            const { uri } = await native.Filesystem.writeFile({
              path: filename,
              data: await blobToBase64(blob),
              directory: "CACHE",
            });
            await native.Share.share({ title: filename, files: [uri] });
            return;
          }
          const downloads = await downloadsReady;
          if (downloads) {
            await downloads.save({ filename, data: blob });
            return;
          }
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        }

        async function downloadSelectionPng() {
          // No selection: export everything drawn, without showing a selection.
          const hasSel = !!activeSelectionRect();
          const rect = hasSel ? activeSelectionRect() : contentBounds();
          if (!rect) {
            setExportMessage("Nothing to export");
            return;
          }
          setExportMessage("Rendering…");
          const blob = await buildSelectionPngBlob(hasSel ? undefined : rect);
          if (!blob) {
            setExportMessage("Nothing to export");
            return;
          }
          try {
            await saveBlob(blob, "draw-" + rect.w + "x" + rect.h + ".png");
            setExportMessage("Downloaded " + rect.w + "×" + rect.h);
          } catch (err) {
            setExportMessage(
              err && (err.code === "declined" || /cancel/i.test(err.message || ""))
                ? "Download cancelled"
                : "Download failed"
            );
          }
        }

        async function publishSelectionPng() {
          // Only touch canvas state when there is a live selection/float.
          if (state.float) commitFloat();
          const rect = activeSelectionRect() || cloneRect(state.lastPublishSelection);
          if (!rect) {
            setExportMessage("Select an area first");
            return;
          }
          setExportMessage("Copying…");
          publishBtn.disabled = true;
          try {
            // Explicit rect: last-publish fallback does not create a selection.
            // Hand ClipboardItem a promise so Safari keeps the user gesture.
            const blobPromise = buildSelectionPngBlob(rect).then((blob) => {
              if (!blob) throw new Error("empty");
              return blob;
            });
            await navigator.clipboard.write([new ClipboardItem({ "image/png": blobPromise })]);
            state.lastPublishSelection = cloneRect(rect);
            saveSettings();
            setExportMessage("");
            exportFeedback.hidden = false;
            exportLink.hidden = true;
            exportCopied.title = "Image copied";
            exportCopied.setAttribute("aria-label", "Image copied");
            exportCopied.hidden = false;
          } catch (err) {
            setExportMessage(err && err.message === "empty" ? "Nothing to export" : "Copy failed");
          } finally {
            syncActionButtons();
          }
        }

        function syncActionButtons() {
          const hasSel = !!(state.selection || state.float);
          const canPublish = hasSel || !!state.lastPublishSelection;
          cutBtn.disabled = !hasSel;
          copyBtn.disabled = !hasSel;
          deleteBtn.disabled = !hasSel;
          undoBtn.disabled = !undoStack.length;
          redoBtn.disabled = !redoStack.length;
          // Always allow paste — may pull an image from the system clipboard.
          pasteBtn.disabled = false;
          pasteBtn.title = state.clipboard
            ? "Paste (⌘/Ctrl+V)"
            : "Paste image or selection (⌘/Ctrl+V)";
          downloadBtn.disabled = !hasSel && pixels.size === 0;
          downloadBtn.title = hasSel ? "Download selection PNG" : "Download drawing PNG";
          publishBtn.disabled = !canPublish;
          const title = publishBtn.title || "";
          if (
            !title ||
            title === "Copy selection as image" ||
            title.startsWith("Copy last area")
          ) {
            setExportMessage("");
          }
        }

        function copySelection() {
          const rect = state.float
            ? { x: state.float.x, y: state.float.y, w: state.float.w, h: state.float.h }
            : state.selection;
          if (!rect) return;
          if (state.float) {
            state.clipboard = {
              w: state.float.w,
              h: state.float.h,
              pixels: new Map(state.float.pixels),
            };
          } else {
            state.clipboard = extractRect(rect, false);
          }
          syncActionButtons();
          saveSettings();
        }

        function cutSelection() {
          if (!state.float && !state.selection) return;
          pushUndo();
          if (state.float) {
            state.clipboard = {
              w: state.float.w,
              h: state.float.h,
              pixels: new Map(state.float.pixels),
            };
            state.float = null;
            state.selection = null;
            state.moving = false;
            state.moveGrab = null;
            canvas.classList.remove("moving");
          } else if (state.selection) {
            state.clipboard = extractRect(state.selection, true);
            state.selection = null;
          } else {
            return;
          }
          syncActionButtons();
          state.needsDraw = true;
          saveSettings();
        }

        function pasteClipboard() {
          if (!state.clipboard) return;
          pushUndo();
          if (state.float) commitFloat();
          const ox = state.hover.x;
          const oy = state.hover.y;
          state.float = {
            x: ox,
            y: oy,
            w: state.clipboard.w,
            h: state.clipboard.h,
            pixels: new Map(state.clipboard.pixels),
          };
          state.selection = {
            x: ox,
            y: oy,
            w: state.clipboard.w,
            h: state.clipboard.h,
          };
          setTool("select");
          syncActionButtons();
          state.needsDraw = true;
          saveSettings();
        }

        function deleteSelection() {
          if (!state.float && !state.selection) return;
          pushUndo();
          if (state.float) {
            state.float = null;
            state.selection = null;
            state.moving = false;
            state.moveGrab = null;
            canvas.classList.remove("moving");
          } else if (state.selection) {
            clearRect(state.selection);
            state.selection = null;
          }
          syncActionButtons();
          state.needsDraw = true;
          saveSettings();
        }

        function clearSelection() {
          if (state.float || state.selection) pushUndo();
          if (state.float) commitFloat();
          state.selection = null;
          state.selecting = false;
          state.lining = false;
          state.lineStart = null;
          state.lineEnd = null;
          syncActionButtons();
          state.needsDraw = true;
          saveSettings();
        }

        function resize() {
          state.dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
          const w = window.innerWidth;
          const h = window.innerHeight;
          canvas.width = Math.round(w * state.dpr);
          canvas.height = Math.round(h * state.dpr);
          canvas.style.width = w + "px";
          canvas.style.height = h + "px";
          ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
          state.needsDraw = true;
        }

        function zoomAt(sx, sy, nextScale) {
          const clamped = Math.max(MIN_SCALE, Math.min(MAX_SCALE, nextScale));
          const wx = (sx - state.camX) / state.scale;
          const wy = (sy - state.camY) / state.scale;
          state.scale = clamped;
          state.camX = sx - wx * state.scale;
          state.camY = sy - wy * state.scale;
          state.needsDraw = true;
          saveSettings();
        }

        function setPixel(x, y, color) {
          const k = key(x, y);
          if (pixels.get(k) === color) return;
          pixels.set(k, color);
          state.needsDraw = true;
          saveSettings();
        }

        function erasePixel(x, y) {
          const k = key(x, y);
          if (!pixels.has(k)) return;
          pixels.delete(k);
          state.needsDraw = true;
          saveSettings();
        }

        function applyPixel(x, y, color) {
          if (color == null) erasePixel(x, y);
          else setPixel(x, y, color);
        }

        function applyBrush(cx, cy, color) {
          const size = Math.max(1, state.brushSize | 0);
          if (size === 1) {
            applyPixel(cx, cy, color);
            return;
          }
          const start = -Math.floor((size - 1) / 2);
          for (let dy = 0; dy < size; dy++) {
            for (let dx = 0; dx < size; dx++) {
              applyPixel(cx + start + dx, cy + start + dy, color);
            }
          }
        }

        function paintBrushLine(x0, y0, x1, y1, color) {
          forEachLineCell(x0, y0, x1, y1, (x, y) => applyBrush(x, y, color));
        }

        function paintLine(x0, y0, x1, y1, color) {
          let dx = Math.abs(x1 - x0);
          let dy = -Math.abs(y1 - y0);
          const sx = x0 < x1 ? 1 : -1;
          const sy = y0 < y1 ? 1 : -1;
          let err = dx + dy;
          let x = x0;
          let y = y0;
          for (;;) {
            applyPixel(x, y, color);
            if (x === x1 && y === y1) break;
            const e2 = 2 * err;
            if (e2 >= dy) {
              err += dy;
              x += sx;
            }
            if (e2 <= dx) {
              err += dx;
              y += sy;
            }
          }
        }
        function forEachLineCell(x0, y0, x1, y1, fn) {
          let dx = Math.abs(x1 - x0);
          let dy = -Math.abs(y1 - y0);
          const sx = x0 < x1 ? 1 : -1;
          const sy = y0 < y1 ? 1 : -1;
          let err = dx + dy;
          let x = x0;
          let y = y0;
          for (;;) {
            fn(x, y);
            if (x === x1 && y === y1) break;
            const e2 = 2 * err;
            if (e2 >= dy) {
              err += dy;
              x += sx;
            }
            if (e2 <= dx) {
              err += dx;
              y += sy;
            }
          }
        }

        function paintAt(sx, sy) {
          const w = screenToWorld(sx, sy);
          const color = state.tool === "eraser" ? null : state.color;
          if (state.lastWorld) {
            paintBrushLine(state.lastWorld.x, state.lastWorld.y, w.x, w.y, color);
          } else {
            applyBrush(w.x, w.y, color);
          }
          state.lastWorld = w;
          state.lastPainted = { x: w.x, y: w.y };
        }

                function drawClipPixels(clip, ox, oy, s) {
          for (const [k, color] of clip.pixels) {
            const p = parseKey(k);
            ctx.fillStyle = color;
            ctx.fillRect(
              state.camX + (p.x + ox) * s,
              state.camY + (p.y + oy) * s,
              s,
              s
            );
          }
        }

        function drawMarchingAnts(rect, s) {
          const x = state.camX + rect.x * s;
          const y = state.camY + rect.y * s;
          const w = rect.w * s;
          const h = rect.h * s;
          ctx.save();
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 4]);
          ctx.lineDashOffset = -state.dashOffset;
          ctx.strokeStyle = "rgba(0,0,0,0.85)";
          ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
          ctx.lineDashOffset = -state.dashOffset + 5;
          ctx.strokeStyle = withAlpha(state.accentColor, 0.95);
          ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
          ctx.restore();
          ctx.fillStyle = withAlpha(state.accentColor, 0.08);
          ctx.fillRect(x, y, w, h);
        }

        function drawPixelGrid(x0, y0, x1, y1, s, viewW, viewH) {
          if (!state.pixelGridEnabled || s < 10) return;
          const alpha = Math.min(0.35, (s - 8) / 70);
          ctx.beginPath();
          ctx.strokeStyle = withAlpha(state.pixelGridColor, alpha);
          ctx.lineWidth = state.pixelGridThick;
          for (let x = x0; x <= x1; x++) {
            const sx = Math.round(state.camX + x * s) + 0.5;
            ctx.moveTo(sx, 0);
            ctx.lineTo(sx, viewH);
          }
          for (let y = y0; y <= y1; y++) {
            const sy = Math.round(state.camY + y * s) + 0.5;
            ctx.moveTo(0, sy);
            ctx.lineTo(viewW, sy);
          }
          ctx.stroke();
        }

        function drawMajorGrid(x0, y0, x1, y1, s, viewW, viewH) {
          if (!state.gridEnabled) return;
          const gx = state.gridCellX;
          const gy = state.gridCellY;
          if (gx < 1 || gy < 1) return;

          const startX = Math.floor(x0 / gx) * gx;
          const startY = Math.floor(y0 / gy) * gy;

          ctx.beginPath();
          ctx.strokeStyle = withAlpha(state.gridColor, 0.45);
          ctx.lineWidth = state.gridThick;
          for (let x = startX; x <= x1; x += gx) {
            const sx = Math.round(state.camX + x * s) + 0.5;
            ctx.moveTo(sx, 0);
            ctx.lineTo(sx, viewH);
          }
          for (let y = startY; y <= y1; y += gy) {
            const sy = Math.round(state.camY + y * s) + 0.5;
            ctx.moveTo(0, sy);
            ctx.lineTo(viewW, sy);
          }
          ctx.stroke();
        }

        // Per-colour label: hue in degrees ("–" for greys), saturation in
        // percent, and a legible ink.
        const pixelLabelCache = new Map();
        function pixelLabelFor(color) {
          let label = pixelLabelCache.get(color);
          if (!label) {
            const { r, g, b } = hexToRgb(color);
            const hsv = rgbToHsv(r, g, b);
            const luma = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            label = {
              hue: hsv.s === 0 ? "–" : String(Math.round(hsv.h) % 360),
              sat: String(Math.round(hsv.s * 100)),
              ink: luma > 0.55 ? "rgba(0,0,0,0.75)" : "rgba(255,255,255,0.85)",
            };
            pixelLabelCache.set(color, label);
          }
          return label;
        }

        function drawPixelLabels(x0, y0, x1, y1, s) {
          if (s < 16) return; // too small to read
          // Both on: hue above, saturation below.
          const both = state.hueLabelsEnabled && state.satLabelsEnabled;
          const size = Math.min(14, Math.floor(s * (both ? 0.3 : 0.38)));
          const lineOff = both ? size * 0.6 : 0;
          ctx.font = size + "px ui-monospace, Menlo, monospace";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          for (const [k, color] of pixels) {
            const p = parseKey(k);
            if (p.x < x0 || p.x > x1 || p.y < y0 || p.y > y1) continue;
            const label = pixelLabelFor(color);
            const cx = state.camX + (p.x + 0.5) * s;
            const cy = state.camY + (p.y + 0.5) * s;
            ctx.fillStyle = label.ink;
            if (state.hueLabelsEnabled) ctx.fillText(label.hue, cx, cy - lineOff);
            if (state.satLabelsEnabled) ctx.fillText(label.sat, cx, cy + lineOff);
          }
        }

        function draw() {
          const w = window.innerWidth;
          const h = window.innerHeight;
          const s = state.scale;

          ctx.fillStyle = state.bgColor;
          ctx.fillRect(0, 0, w, h);

          const x0 = Math.floor(-state.camX / s) - 1;
          const y0 = Math.floor(-state.camY / s) - 1;
          const x1 = Math.ceil((w - state.camX) / s) + 1;
          const y1 = Math.ceil((h - state.camY) / s) + 1;

          drawPixelGrid(x0, y0, x1, y1, s, w, h);
          drawMajorGrid(x0, y0, x1, y1, s, w, h);

          {
            const ox = state.camX;
            const oy = state.camY;
            ctx.strokeStyle = withAlpha(state.gridColor, 0.35);
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(ox, 0);
            ctx.lineTo(ox, h);
            ctx.moveTo(0, oy);
            ctx.lineTo(w, oy);
            ctx.stroke();
          }

          for (const [k, color] of pixels) {
            const p = parseKey(k);
            if (p.x < x0 || p.x > x1 || p.y < y0 || p.y > y1) continue;
            ctx.fillStyle = color;
            ctx.fillRect(state.camX + p.x * s, state.camY + p.y * s, s, s);
          }

          if (state.hueLabelsEnabled || state.satLabelsEnabled) {
            drawPixelLabels(x0, y0, x1, y1, s);
          }

          if (state.lining && state.lineStart && state.lineEnd) {
            const a = state.lineStart;
            const b = constrainLineEnd(a, state.lineEnd);
            const size = Math.max(1, state.brushSize | 0);
            const start = -Math.floor((size - 1) / 2);
            ctx.globalAlpha = 0.85;
            ctx.fillStyle = state.lineErase ? state.bgColor : state.color;
            forEachLineCell(a.x, a.y, b.x, b.y, (x, y) => {
              for (let dy = 0; dy < size; dy++) {
                for (let dx = 0; dx < size; dx++) {
                  const px = x + start + dx;
                  const py = y + start + dy;
                  ctx.fillRect(state.camX + px * s, state.camY + py * s, s, s);
                }
              }
            });
            ctx.globalAlpha = 1;
          }

          if (state.float) {
            drawClipPixels(state.float, state.float.x, state.float.y, s);
            drawMarchingAnts(
              {
                x: state.float.x,
                y: state.float.y,
                w: state.float.w,
                h: state.float.h,
              },
              s
            );
          } else if (state.selection) {
            drawMarchingAnts(state.selection, s);
          }

          if (
            state.hoverVisible &&
            !quickMenu.open &&
            (state.tool !== "select" || !state.selection)
          ) {
            const size =
              state.tool === "brush" ||
              state.tool === "eraser" ||
              state.tool === "line"
                ? Math.max(1, state.brushSize | 0)
                : 1;
            const start = -Math.floor((size - 1) / 2);
            const hx = state.camX + (state.hover.x + start) * s;
            const hy = state.camY + (state.hover.y + start) * s;
            ctx.strokeStyle = withAlpha(state.accentColor, 0.85);
            ctx.lineWidth = 2;
            ctx.strokeRect(hx + 1, hy + 1, size * s - 2, size * s - 2);
          }

        }

        function frame(now) {
          if (state.selection || state.float || state.selecting) {
            state.dashOffset = (now / 30) % 20;
            state.needsDraw = true;
          }
          if (state.needsDraw) {
            state.needsDraw = false;
            draw();
          }
          requestAnimationFrame(frame);
        }

        function clientPos(e) {
          const r = canvas.getBoundingClientRect();
          return { x: e.clientX - r.left, y: e.clientY - r.top };
        }

        function wantsPan(e) {
          return state.spaceDown || e.button === 1 || e.buttons === 4;
        }

        function beginMove(world) {
          const rect = state.float
            ? {
                x: state.float.x,
                y: state.float.y,
                w: state.float.w,
                h: state.float.h,
              }
            : state.selection;
          if (!rect || !pointInRect(world, rect)) return false;

          if (!state.float) {
            pushUndo();
            state.float = {
              x: rect.x,
              y: rect.y,
              w: rect.w,
              h: rect.h,
              pixels: extractRect(rect, true).pixels,
            };
          }
          state.moving = true;
          state.moveGrab = {
            dx: world.x - state.float.x,
            dy: world.y - state.float.y,
          };
          canvas.classList.add("moving");
          state.needsDraw = true;
          return true;
        }

        /** Number fields: allow empty while typing; commit on blur. */
        function bindOptionalNumber(input, opts) {
          const apply = (commit) => {
            const raw = input.value.trim();
            if (raw === "") {
              if (commit) input.value = String(opts.get());
              return;
            }
            const next = opts.parse(raw, opts.get());
            opts.set(next);
            if (commit) input.value = String(next);
            opts.onChange();
          };
          input.addEventListener("input", () => apply(false));
          input.addEventListener("change", () => apply(true));
          input.addEventListener("blur", () => apply(true));
        }

        function clearHoldTimer() {
          if (state.holdTimer) clearTimeout(state.holdTimer);
          state.holdTimer = null;
          state.holdPos = null;
        }

        function restartHoldTimer(x, y) {
          clearHoldTimer();
          state.holdPos = { x, y };
          state.holdTimer = setTimeout(snapStrokeToLine, QS_HOLD_MS);
        }

        // Replace the stroke so far with a straight line from its start to the
        // current cell, then keep adjusting the line end until lift (like the
        // line tool). Only for strokes that actually went somewhere.
        function snapStrokeToLine() {
          state.holdTimer = null;
          if (!state.drawing || !state.strokeStart || !state.strokeBase) return;
          const end = state.hover;
          if (end.x === state.strokeStart.x && end.y === state.strokeStart.y) return;
          pixels.clear();
          for (const [k, c] of state.strokeBase) pixels.set(k, c);
          state.drawing = false;
          state.lastWorld = null;
          state.lining = true;
          state.lineErase = state.tool === "eraser";
          state.lineStart = state.strokeStart;
          state.lineEnd = end;
          state.needsDraw = true;
        }

        // Pencil (and mouse) draws; fingers navigate. One finger pans, two
        // pinch-zoom, a quick two-finger tap undoes, three-finger tap redoes.
        function startPinch() {
          const pts = [...state.pointers.values()];
          const dx = pts[1].x - pts[0].x;
          const dy = pts[1].y - pts[0].y;
          state.pinch = {
            dist: Math.hypot(dx, dy) || 1,
            scale: state.scale,
            midX: (pts[0].x + pts[1].x) / 2,
            midY: (pts[0].y + pts[1].y) / 2,
          };
        }

        function cancelTouchGesture() {
          state.pointers.clear();
          state.pinch = null;
          state.touchGesture = null;
        }

        function touchDown(e) {
          if (state.penId != null) return; // palm resting while drawing
          capturePointer(canvas, e.pointerId);
          state.pointers.set(e.pointerId, {
            x: e.clientX,
            y: e.clientY,
            sx: e.clientX,
            sy: e.clientY,
          });
          if (!state.touchGesture) {
            state.touchGesture = { start: performance.now(), maxCount: 0, moved: false };
          }
