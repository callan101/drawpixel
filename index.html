        const colorPopover = document.getElementById("color-popover");
        const cpSv = document.getElementById("cp-sv");
        const cpSvCanvas = document.getElementById("cp-sv-canvas");
        const cpSvCtx = cpSvCanvas.getContext("2d");
        const cpSvCursor = document.getElementById("cp-sv-cursor");
        const cpHue = document.getElementById("cp-hue");
        const cpHueCursor = document.getElementById("cp-hue-cursor");
        const cpSat = document.getElementById("cp-sat");
        const cpSatCursor = document.getElementById("cp-sat-cursor");
        const cpBri = document.getElementById("cp-bri");
        const cpBriCursor = document.getElementById("cp-bri-cursor");
        const cpPreview = document.getElementById("cp-preview");
        const cpHex = document.getElementById("cp-hex");
        // H/S/B number fields: [input, max]. Hue is degrees, sat/bri percent.
        const cpNums = {
          h: [document.getElementById("cp-hue-num"), 360],
          s: [document.getElementById("cp-sat-num"), 100],
          v: [document.getElementById("cp-bri-num"), 100],
        };

        const colorPicker = {
          open: false,
          h: 0,
          s: 1,
          v: 1,
          hex: "#ffffff",
          onChange: null,
          anchor: null,
          dragging: null,
          skipNextHexChange: false,
        };

        function paintSv() {
          const w = cpSvCanvas.width;
          const h = cpSvCanvas.height;
          const { r, g, b } = hsvToRgb(colorPicker.h, 1, 1);
          const pure = rgbToHex(r, g, b);
          const ctx = cpSvCtx;
          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = pure;
          ctx.fillRect(0, 0, w, h);
          const white = ctx.createLinearGradient(0, 0, w, 0);
          white.addColorStop(0, "#ffffff");
          white.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = white;
          ctx.fillRect(0, 0, w, h);
          const black = ctx.createLinearGradient(0, 0, 0, h);
          black.addColorStop(0, "rgba(0,0,0,0)");
          black.addColorStop(1, "#000000");
          ctx.fillStyle = black;
          ctx.fillRect(0, 0, w, h);
        }

        function paintSatBriSliders() {
          const h = colorPicker.h;
          const s = colorPicker.s;
          const v = colorPicker.v;
          const satLeft = hsvToHex(h, 0, v);
          const satRight = hsvToHex(h, 1, v);
          cpSat.style.background =
            "linear-gradient(to right, " + satLeft + ", " + satRight + ")";
          const briLeft = "#000000";
          const briRight = hsvToHex(h, s, 1);
          cpBri.style.background =
            "linear-gradient(to right, " + briLeft + ", " + briRight + ")";
        }

        function syncPickerUi(preserveHexField) {
          // colorPicker.hex is authoritative. HSV is only for the sliders;
          // converting HSV→RGB can drift by 1 (e.g. #6410ff ↔ #6310ff).
          const hex = colorPicker.hex || hsvToHex(colorPicker.h, colorPicker.s, colorPicker.v);
          cpPreview.style.background = hex;
          if (!preserveHexField) cpHex.value = hex;
          cpSvCursor.style.left = colorPicker.s * 100 + "%";
          cpSvCursor.style.top = (1 - colorPicker.v) * 100 + "%";
          cpHueCursor.style.left = (colorPicker.h / 360) * 100 + "%";
          cpHueCursor.style.background = hsvToHex(colorPicker.h, 1, 1);
          cpSatCursor.style.left = colorPicker.s * 100 + "%";
          cpSatCursor.style.background = hex;
          cpBriCursor.style.left = colorPicker.v * 100 + "%";
          cpBriCursor.style.background = hex;
          for (const k in cpNums) {
            const [input, max] = cpNums[k];
            // Don't rewrite the field being typed in.
            if (document.activeElement === input) continue;
            input.value = String(Math.round(k === "h" ? colorPicker.h : colorPicker[k] * max));
          }
          paintSatBriSliders();
          paintSv();
          if (colorPicker.onChange) colorPicker.onChange(hex);
        }

        function setPickerFromHex(hex) {
          const h = normalizeHex(hex);
          if (!/^#[0-9a-f]{6}$/.test(h)) return false;
          const rgb = hexToRgb(h);
          const hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
          colorPicker.h = hsv.h;
          colorPicker.s = hsv.s;
          colorPicker.v = hsv.v;
          colorPicker.hex = h;
          return true;
        }

        for (const k in cpNums) {
          const [input, max] = cpNums[k];
          input.addEventListener("input", () => {
            const n = parseFloat(input.value);
            if (!Number.isFinite(n)) return;
            const c = Math.min(max, Math.max(0, n));
            colorPicker[k] = k === "h" ? c : c / max;
            setPickerFromHsv();
            syncPickerUi(false);
          });
          input.addEventListener("blur", () => syncPickerUi(false));
          input.addEventListener("keydown", (e) => {
            e.stopPropagation(); // keep tool shortcuts out of the field
            if (e.key === "Enter") input.blur();
          });
        }

        function setPickerFromHsv() {
          colorPicker.hex = hsvToHex(colorPicker.h, colorPicker.s, colorPicker.v);
        }

        function placePopover(anchor) {
          colorPopover.hidden = false;
          colorPopover.classList.add("open");
          const ar = anchor.getBoundingClientRect();
          const pr = colorPopover.getBoundingClientRect();
          let left = ar.right + 8;
          let top = ar.top;
          if (left + pr.width > window.innerWidth - 8) {
            left = ar.left - pr.width - 8;
          }
          if (left < 8) left = 8;
          if (top + pr.height > window.innerHeight - 8) {
            top = window.innerHeight - pr.height - 8;
          }
          if (top < 8) top = 8;
          colorPopover.style.left = left + "px";
          colorPopover.style.top = top + "px";
        }

        // paletteSlot: index of the swatch being edited, or null for other swatches.
        function openColorPicker(anchor, hex, onChange, paletteSlot) {
          colorPicker.anchor = anchor;
          colorPicker.paletteSlot = paletteSlot == null ? null : paletteSlot;
          colorPicker.onChange = onChange;
          colorPicker.typeUndo = false;
          syncTypeRow();
          setPickerFromHex(hex || "#ffffff");
          colorPicker.open = true;
          syncPickerUi(false);
          placePopover(anchor);
        }

        function closeColorPicker() {
          if (!colorPicker.open) return;
          colorPicker.open = false;
          colorPicker.onChange = null;
          colorPicker.anchor = null;
          colorPicker.paletteSlot = null;
          colorPicker.dragging = null;
          colorPopover.classList.remove("open");
          colorPopover.hidden = true;
        }

        function svFromEvent(e) {
          const rect = cpSv.getBoundingClientRect();
          const x = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
          const y = Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height));
          colorPicker.s = x;
          colorPicker.v = 1 - y;
          setPickerFromHsv();
          syncPickerUi(false);
        }

        function sliderXFromEvent(el, e) {
          const rect = el.getBoundingClientRect();
          return Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
        }

        function hueFromEvent(e) {
          colorPicker.h = sliderXFromEvent(cpHue, e) * 360;
          setPickerFromHsv();
          syncPickerUi(false);
        }

        function satFromEvent(e) {
          colorPicker.s = sliderXFromEvent(cpSat, e);
          setPickerFromHsv();
          syncPickerUi(false);
        }

        function briFromEvent(e) {
          colorPicker.v = sliderXFromEvent(cpBri, e);
          setPickerFromHsv();
          syncPickerUi(false);
        }

        function bindSlider(el, key, handler) {
          el.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            el.setPointerCapture(e.pointerId);
            colorPicker.dragging = key;
            handler(e);
          });
          el.addEventListener("pointermove", (e) => {
            if (colorPicker.dragging === key) handler(e);
          });
          el.addEventListener("pointerup", () => {
            colorPicker.dragging = null;
          });
        }

        cpSv.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          cpSv.setPointerCapture(e.pointerId);
          colorPicker.dragging = "sv";
          svFromEvent(e);
        });
        cpSv.addEventListener("pointermove", (e) => {
          if (colorPicker.dragging === "sv") svFromEvent(e);
        });
        cpSv.addEventListener("pointerup", () => {
          colorPicker.dragging = null;
        });

        bindSlider(cpHue, "hue", hueFromEvent);
        bindSlider(cpSat, "sat", satFromEvent);
        bindSlider(cpBri, "bri", briFromEvent);

        function readHexInputValue() {
          let v = cpHex.value.trim();
          if (v && v[0] !== "#") v = "#" + v;
          return normalizeHex(v);
        }

        function commitHexInput() {
          const v = readHexInputValue();
          if (!setPickerFromHex(v)) {
            return false;
          }
          cpHex.value = v;
          syncPickerUi(true);
          return true;
        }

        cpHex.addEventListener("input", () => {
          const v = readHexInputValue();
          // Keep the field as typed while incomplete; only lock when valid.
          if (setPickerFromHex(v)) syncPickerUi(true);
        });
        cpHex.addEventListener("change", () => {
          if (colorPicker.skipNextHexChange) {
            colorPicker.skipNextHexChange = false;
            return;
          }
          if (!colorPicker.open) return;
          if (!commitHexInput()) {
            // Revert invalid text to the last locked hex.
            cpHex.value = colorPicker.hex;
            syncPickerUi(false);
          }
        });
        // Capture phase: the fields stop propagation of their own keys.
        colorPopover.addEventListener(
          "keydown",
          (e) => {
            if (e.key !== "Escape") return;
            e.preventDefault();
            e.stopPropagation();
            // Drop a half-typed hex rather than applying it on blur.
            if (document.activeElement === cpHex) colorPicker.skipNextHexChange = true;
            closeColorPicker();
          },
          true
        );

        cpHex.addEventListener("keydown", (e) => {
          if (e.key !== "Enter") return;
          e.preventDefault();
          e.stopPropagation();
          commitHexInput();
          colorPicker.skipNextHexChange = true;
          closeColorPicker();
        });

        document.addEventListener("pointerdown", (e) => {
          if (!colorPicker.open) return;
          if (colorPopover.contains(e.target)) return;
          if (colorPicker.anchor && colorPicker.anchor.contains(e.target)) return;
          // Tapping another swatch retargets the picker (handled in its click).
          if (
            colorPicker.paletteSlot != null &&
            e.target.closest &&
            e.target.closest(".palette-slot[data-index]")
          ) {
            return;
          }
          closeColorPicker();
        });

        // Drag a swatch to reorder it; drop it off the palette bar to delete it.
        // A press that doesn't move falls through to the normal click.
        const paletteHud = paletteEl.parentElement;
        let paletteDrag = null;

        function swatchTap(slot, i, shiftKey) {
          if (shiftKey) {
            removePaletteSlot(i);
            return;
          }
          const pickerOnSwatch = colorPicker.open && colorPicker.paletteSlot != null;
          if (pickerOnSwatch && colorPicker.paletteSlot === i) {
            closeColorPicker();
          } else if (pickerOnSwatch || state.paletteIndex === i) {
            selectPaletteIndex(i);
            openColorPicker(slot, state.palette[i], (hex) => setSlotColor(i, hex), i);
          } else {
            selectPaletteIndex(i);
          }
        }

        // iOS can still claim a drag as a scroll; block that while a swatch is held.
        paletteHud.addEventListener(
          "touchmove",
          (e) => {
            if (paletteDrag) e.preventDefault();
          },
          { passive: false }
        );

        function paletteDragStart(slot, index, e) {
          if (paletteDrag) return;
          paletteDrag = {
            slot,
            from: index,
            id: e.pointerId,
            sx: e.clientX,
            sy: e.clientY,
            active: false,
            ghost: null,
            offX: 0,
            offY: 0,
            discard: false,
          };
        }

        // On window, not the swatch: reordering moves the swatch in the DOM,
        // which would drop pointer capture mid-drag.
        window.addEventListener("pointermove", paletteDragMove);
        window.addEventListener("pointerup", paletteDragEnd);
        window.addEventListener("pointercancel", paletteDragEnd);

        function paletteDragMove(e) {
          const d = paletteDrag;
          if (!d || e.pointerId !== d.id) return;
          if (!d.active) {
            if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < TAP_MAX_MOVE) return;
            d.active = true;
            closeColorPicker();
            const r = d.slot.getBoundingClientRect();
            d.offX = d.sx - r.left;
            d.offY = d.sy - r.top;
            d.ghost = d.slot.cloneNode(true);
            d.ghost.classList.add("palette-ghost");
            d.ghost.style.width = r.width + "px";
            d.ghost.style.height = r.height + "px";
            document.body.appendChild(d.ghost);
            d.slot.classList.add("placeholder");
          }
          d.ghost.style.left = e.clientX - d.offX + "px";
          d.ghost.style.top = e.clientY - d.offY + "px";

          const pr = paletteHud.getBoundingClientRect();
          const outside =
            e.clientX < pr.left - DISCARD_MARGIN ||
            e.clientX > pr.right + DISCARD_MARGIN ||
            e.clientY < pr.top - DISCARD_MARGIN ||
            e.clientY > pr.bottom + DISCARD_MARGIN;
          d.discard = outside && state.palette.length > 1;
          d.ghost.classList.toggle("discard", d.discard);
          d.slot.classList.toggle("discarding", d.discard);
          if (outside) return;

          // Live reorder preview: move the placeholder before the first swatch
          // whose midpoint is below the pointer.
          let before = paletteEl.querySelector(".palette-add");
          for (const s of paletteEl.querySelectorAll(".palette-slot[data-index]")) {
            if (s === d.slot) continue;
            const r = s.getBoundingClientRect();
            if (e.clientY < r.top + r.height / 2) {
              before = s;
              break;
            }
          }
          if (d.slot.nextSibling !== before) paletteEl.insertBefore(d.slot, before);
        }

        function paletteDragEnd(e) {
          const d = paletteDrag;
          if (!d || e.pointerId !== d.id) return;
          paletteDrag = null;
          if (!d.active) {
            if (e.type === "pointerup") swatchTap(d.slot, d.from, e.shiftKey);
            return;
          }
          d.ghost.remove();

          if (e.type === "pointerup" && d.discard) {
            removePaletteSlot(d.from);
            return;
          }
          const order = [...paletteEl.querySelectorAll(".palette-slot[data-index]")].map(
            (s) => +s.dataset.index
          );
          if (e.type === "pointerup" && order.some((k, pos) => k !== pos)) {
            pushUndo(true);
            const old = state.palette.slice();
            state.palette = order.map((k) => old[k]);
            state.paletteIndex = order.indexOf(state.paletteIndex);
            state.color = state.palette[state.paletteIndex];
            saveSettings();
          }
          buildPalette();
        }

        async function copySwatchColor(slot, hex) {
          try {
            await navigator.clipboard.writeText(hex);
          } catch (_) {
            return;
          }
          slot.classList.add("copied");
          setTimeout(() => slot.classList.remove("copied"), 700);
        }

        function buildPalette() {
          paletteEl.innerHTML = "";
          const menuBtn = document.createElement("button");
          menuBtn.type = "button";
          menuBtn.className = "palette-slot palette-menu";
          const pal = state.palettes[state.activePalette];
          menuBtn.title = "Palettes" + (pal ? " · " + pal.name : "");
          menuBtn.setAttribute("aria-label", menuBtn.title);
          for (let i = 0; i < 4; i++) {
            const dot = document.createElement("span");
            dot.style.background = state.palette[i] || "transparent";
            menuBtn.appendChild(dot);
          }
          menuBtn.addEventListener("click", () => openPalettesDialog());
          paletteEl.appendChild(menuBtn);
          state.palette.forEach((color, i) => {
            const slot = document.createElement("button");
            slot.type = "button";
            slot.className = "palette-slot";
            slot.dataset.index = String(i);
            slot.dataset.color = color;
            const tt = state.tileTypes[color];
            slot.title =
              i + 1 + ": " + color +
              (tt ? " · " + tt.type + (tt.role ? " (" + tt.role + ")" : "") : "") +
              " · click select/edit · drag to reorder · drag off to delete";
            slot.classList.toggle("typed", !!tt);
            slot.style.background = color;
            slot.setAttribute("aria-label", "Palette color " + (i + 1));
            const idx = document.createElement("span");
            idx.className = "idx";
            idx.textContent = String(i + 1);
            slot.appendChild(idx);

            slot.addEventListener("pointerdown", (e) => {
              if (e.button === 0) paletteDragStart(slot, i, e);
            });
            slot.addEventListener("contextmenu", (e) => {
              e.preventDefault();
              copySwatchColor(slot, state.palette[i]);
            });

            // Pointer taps are handled on pointerup (iOS drops the click for
            // Pencil taps that move slightly); this only catches keyboard activation.
            slot.addEventListener("click", (e) => {
              if (e.detail !== 0) return;
              swatchTap(slot, i, e.shiftKey);
            });
            paletteEl.appendChild(slot);
          });

          const addBtn = document.createElement("button");
          addBtn.type = "button";
          addBtn.className = "palette-slot palette-add";
          addBtn.title = "Add color slot";
          addBtn.setAttribute("aria-label", "Add color slot");
          addBtn.textContent = "+";
          addBtn.disabled = state.palette.length >= MAX_PALETTE_SIZE;
          addBtn.addEventListener("click", () => {
            addPaletteSlot(state.color);
            const index = state.paletteIndex;
            const slot = paletteEl.querySelector(
              '.palette-slot[data-index="' + index + '"]'
            );
            if (slot) {
              openColorPicker(
                slot,
                state.palette[index],
                (hex) => setSlotColor(index, hex),
                index
              );
            }
          });
          paletteEl.appendChild(addBtn);
          syncPaletteActive();
        }
        function activeSelectionRect() {
          if (state.float) {
            return {
              x: state.float.x,
              y: state.float.y,
              w: state.float.w,
              h: state.float.h,
            };
          }
          return state.selection;
        }

        function ensureSelectionForExport() {
          const rect = activeSelectionRect();
          if (rect) return rect;
          setTool("select");
          setExportMessage("Select an area first");
          return null;
        }

        function buildSelectionPngBlob(rectOverride) {
          if (!rectOverride && state.float) commitFloat();
          const rect = rectOverride || activeSelectionRect();
          if (!rect || rect.w < 1 || rect.h < 1) return null;

          const off = document.createElement("canvas");
          off.width = rect.w;
          off.height = rect.h;
          const octx = off.getContext("2d", { alpha: true });
          octx.clearRect(0, 0, rect.w, rect.h);

          for (let y = 0; y < rect.h; y++) {
            for (let x = 0; x < rect.w; x++) {
              const color = pixels.get(key(rect.x + x, rect.y + y));
              if (!color) continue;
              octx.fillStyle = color;
              octx.fillRect(x, y, 1, 1);
            }
          }

          return new Promise((resolve) => {
            off.toBlob((blob) => resolve(blob), "image/png");
          });
        }

        function setExportMessage(message) {
          if (message && !/…$/.test(message)) showToast(message);
          // Transient / error feedback lives on the publish control title (hover).
          if (message) {
            publishBtn.title = message;
            publishBtn.setAttribute("aria-label", message);
          } else if (state.lastPublishSelection && !(state.selection || state.float)) {
            publishBtn.title =
              "Copy last area (" +
              state.lastPublishSelection.w +
              "×" +
              state.lastPublishSelection.h +
              ")";
            publishBtn.setAttribute("aria-label", "Copy last area");
          } else {
            publishBtn.title = "Copy selection as image";
            publishBtn.setAttribute("aria-label", "Copy image");
          }
        }

        function clearExportFeedback() {
          exportFeedback.hidden = true;
          exportLink.hidden = true;
          exportCopied.hidden = true;
          exportLink.removeAttribute("href");
        }

        function showExportLink(url) {
          exportFeedback.hidden = false;
          exportLink.hidden = false;
          exportLink.href = url;
          exportLink.title = "Open public link";
          exportCopied.hidden = false;
          exportCopied.title = "Public link copied";
        }

        function rgbToHex(r, g, b) {
          return (
            "#" +
            ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1)
          );
        }

        function placeImportedPixels(map, w, h) {
          pushUndo();
          if (state.float) commitFloat();
          // Drop at hover so it lands under the cursor / drop point
          const ox = state.hover.x;
          const oy = state.hover.y;
          state.float = {
            x: ox,
            y: oy,
            w: w,
            h: h,
            pixels: map,
          };
          state.legacyOffer =
            legacyMatches(state.legacyConfig || DEFAULT_LEGACY_CONFIG, map).length > 0;
          state.selection = { x: ox, y: oy, w: w, h: h };
          setTool("select");
          syncActionButtons();
          saveSettings();
          state.needsDraw = true;
        }

        function imageFileFromClipboardData(data) {
          if (!data) return null;
          const items = data.items;
          if (items && items.length) {
            for (let i = 0; i < items.length; i++) {
              const item = items[i];
              if (item && item.type && item.type.startsWith("image/")) {
                const file = item.getAsFile();
                if (file) return file;
              }
            }
          }
          const files = data.files;
          if (files && files.length) {
            for (let i = 0; i < files.length; i++) {
              const file = files[i];
              if (file && String(file.type || "").startsWith("image/")) return file;
            }
          }
          return null;
        }

        async function tryPasteSystemImage() {
          if (navigator.clipboard && typeof navigator.clipboard.read === "function") {
            try {
              const items = await navigator.clipboard.read();
              for (const item of items) {
                const type = (item.types || []).find((t) =>
                  String(t).startsWith("image/")
                );
                if (!type) continue;
                const blob = await item.getType(type);
                const file = new File(
                  [blob],
                  "paste." + (type.split("/")[1] || "png"),
                  { type: blob.type || type }
                );
                await importImageFile(file, {
                  maxDim: PASTE_MAX_DIM,
                  maxBytes: PASTE_MAX_BYTES,
                });
                return true;
              }
            } catch (_) {
              /* permission denied / empty clipboard */
            }
          }
          return false;
        }

        async function pasteFromUser() {
          if (await tryPasteMapText()) return;
          if (await tryPasteSystemImage()) return;
          pasteClipboard();
        }

        async function importImageFile(file, opts) {
          if (!file) return;
          const options = opts || {};
          const maxBytes =
            options.maxBytes != null ? options.maxBytes : IMPORT_MAX_BYTES;
          const maxDim = options.maxDim != null ? options.maxDim : IMPORT_MAX_DIM;
          if (!String(file.type || "").startsWith("image/")) {
            setExportMessage("Not an image");
            return;
          }
          if (file.size > maxBytes) {
            setExportMessage(
              "Max " +
                (maxBytes >= 1024 * 1024
                  ? Math.round(maxBytes / (1024 * 1024)) + "MB"
                  : Math.round(maxBytes / 1024) + "KB") +
                " (" +
                (file.size >= 1024 * 1024
                  ? (file.size / (1024 * 1024)).toFixed(1) + "MB"
                  : Math.ceil(file.size / 1024) + "KB") +
                ")"
            );
            return;
          }

          setExportMessage("Importing…");
          try {
            let bitmap;
            if (typeof createImageBitmap === "function") {
              bitmap = await createImageBitmap(file);
            } else {
              bitmap = await new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                  URL.revokeObjectURL(url);
                  resolve(img);
                };
                img.onerror = () => {
                  URL.revokeObjectURL(url);
                  reject(new Error("decode failed"));
                };
                img.src = url;
              });
            }

            const w = bitmap.width | 0;
            const h = bitmap.height | 0;
            if (w < 1 || h < 1) {
              setExportMessage("Empty image");
              return;
            }
            if (w > maxDim || h > maxDim) {
              setExportMessage("Max " + maxDim + "×" + maxDim + "px");
              if (bitmap.close) bitmap.close();
              return;
            }

            const off = document.createElement("canvas");
            off.width = w;
            off.height = h;
            const octx = off.getContext("2d", { willReadFrequently: true });
            octx.clearRect(0, 0, w, h);
            octx.drawImage(bitmap, 0, 0);
            if (bitmap.close) bitmap.close();

            const data = octx.getImageData(0, 0, w, h).data;
            const map = new Map();
            for (let y = 0; y < h; y++) {
              for (let x = 0; x < w; x++) {
                const i = (y * w + x) * 4;
                const a = data[i + 3];
                if (a < 8) continue;
                map.set(key(x, y), rgbToHex(data[i], data[i + 1], data[i + 2]));
              }
            }

            if (!map.size) {
              setExportMessage("No opaque pixels");
              return;
            }

            placeImportedPixels(map, w, h);
            setExportMessage("");
          } catch (_) {
            setExportMessage("Import failed");
          }
        }

        /** Bounding box of every painted pixel, or null when the canvas is empty. */
        function contentBounds() {
          if (!pixels.size) return null;
          let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
          for (const k of pixels.keys()) {
            const p = parseKey(k);
            if (p.x < x0) x0 = p.x;
            if (p.y < y0) y0 = p.y;
            if (p.x > x1) x1 = p.x;
            if (p.y > y1) y1 = p.y;
          }
          return { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
        }

        // Artifact viewers block plain download links; use their downloads
        // capability when present, else fall back to an <a download>.
        const downloadsReady =
          window.claude && typeof window.claude.use === "function"
            ? window.claude.use("downloads").catch(() => null)
            : Promise.resolve(null);

        function blobToBase64(blob) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
            reader.onerror = () => reject(reader.error);
            reader.readAsDataURL(blob);
          });
        }

        async function saveBlob(blob, filename) {
          // App: hand the file to the iOS share sheet (Photos, Files, AirDrop…).
          if (native && native.Filesystem && native.Share) {
            const { uri } = await native.Filesystem.writeFile({
              path: filename,
              data: await blobToBase64(blob),
              directory: "CACHE",
            });
            await native.Share.share({ title: filename, files: [uri] });
            return;
          }
          const downloads = await downloadsReady;
          if (downloads) {
            await downloads.save({ filename, data: blob });
            return;
          }
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        }

        async function downloadSelectionPng() {
          // No selection: export everything drawn, without showing a selection.
          const hasSel = !!activeSelectionRect();
          const rect = hasSel ? activeSelectionRect() : contentBounds();
          if (!rect) {
            setExportMessage("Nothing to export");
            return;
          }
          setExportMessage("Rendering…");
          const blob = await buildSelectionPngBlob(hasSel ? undefined : rect);
          if (!blob) {
            setExportMessage("Nothing to export");
            return;
          }
          try {
            await saveBlob(blob, "draw-" + rect.w + "x" + rect.h + ".png");
            setExportMessage(
              "Downloaded " + rect.w + "×" + rect.h + (state.links.length ? " — links are not included in a PNG" : "")
            );
          } catch (err) {
            setExportMessage(
              err && (err.code === "declined" || /cancel/i.test(err.message || ""))
                ? "Download cancelled"
                : "Download failed"
            );
          }
        }

        async function publishSelectionPng() {
          // Only touch canvas state when there is a live selection/float.
          if (state.float) commitFloat();
          const rect = activeSelectionRect() || cloneRect(state.lastPublishSelection);
          if (!rect) {
            setExportMessage("Select an area first");
            return;
          }
          setExportMessage("Copying…");
          publishBtn.disabled = true;
          try {
            // Explicit rect: last-publish fallback does not create a selection.
            // Hand ClipboardItem a promise so Safari keeps the user gesture.
            const blobPromise = buildSelectionPngBlob(rect).then((blob) => {
              if (!blob) throw new Error("empty");
              return blob;
            });
            await navigator.clipboard.write([new ClipboardItem({ "image/png": blobPromise })]);
            state.lastPublishSelection = cloneRect(rect);
            saveSettings();
            setExportMessage("");
            showToast("Image copied" + (state.links.length ? " — links are not included in a PNG" : ""));
          } catch (err) {
            setExportMessage(err && err.message === "empty" ? "Nothing to export" : "Copy failed");
          } finally {
            syncActionButtons();
          }
        }

        function syncActionButtons() {
          const hasSel = !!(state.selection || state.float);
          const canPublish = hasSel || !!state.lastPublishSelection;
          cutBtn.disabled = !hasSel;
          copyBtn.disabled = !hasSel;
          deleteBtn.disabled = !hasSel;
          undoBtn.disabled = !undoStack.length;
          redoBtn.disabled = !redoStack.length;
          // Always allow paste — may pull an image from the system clipboard.
          pasteBtn.disabled = false;
          pasteBtn.title = state.clipboard
            ? "Paste (⌘/Ctrl+V)"
            : "Paste image or selection (⌘/Ctrl+V)";
          downloadBtn.disabled = !hasSel && pixels.size === 0;
          downloadBtn.title = hasSel ? "Download selection PNG" : "Download drawing PNG";
          publishBtn.disabled = !canPublish;
          const title = publishBtn.title || "";
          if (
            !title ||
            title === "Copy selection as image" ||
            title.startsWith("Copy last area")
          ) {
            setExportMessage("");
          }
        }

        function copySelection() {
          const rect = state.float
            ? { x: state.float.x, y: state.float.y, w: state.float.w, h: state.float.h }
            : state.selection;
          if (!rect) return;
          if (state.float) {
            state.clipboard = {
              w: state.float.w,
              h: state.float.h,
              pixels: new Map(state.float.pixels),
            };
          } else {
            state.clipboard = extractRect(rect, false);
          }
          syncActionButtons();
          saveSettings();
        }

        function cutSelection() {
          if (!state.float && !state.selection) return;
          pushUndo();
          if (state.float) {
            state.clipboard = {
              w: state.float.w,
              h: state.float.h,
              pixels: new Map(state.float.pixels),
            };
            state.float = null;
            state.selection = null;
            state.moving = false;
            state.moveGrab = null;
            canvas.classList.remove("moving");
          } else if (state.selection) {
            state.clipboard = extractRect(state.selection, true);
            state.selection = null;
          } else {
            return;
          }
          syncActionButtons();
          state.needsDraw = true;
          saveSettings();
        }

        function pasteClipboard() {
          if (!state.clipboard) return;
          pushUndo();
          if (state.float) commitFloat();
          const ox = state.hover.x;
          const oy = state.hover.y;
          state.float = {
            x: ox,
            y: oy,
            w: state.clipboard.w,
            h: state.clipboard.h,
            pixels: new Map(state.clipboard.pixels),
          };
          state.selection = {
            x: ox,
            y: oy,
            w: state.clipboard.w,
            h: state.clipboard.h,
          };
          setTool("select");
          syncActionButtons();
          state.needsDraw = true;
          saveSettings();
        }

        function deleteSelection() {
          if (!state.float && !state.selection) return;
          pushUndo();
          if (state.float) {
            state.float = null;
            state.selection = null;
            state.moving = false;
            state.moveGrab = null;
            canvas.classList.remove("moving");
          } else if (state.selection) {
            clearRect(state.selection);
            state.selection = null;
          }
          syncActionButtons();
          state.needsDraw = true;
          saveSettings();
        }

        function clearSelection() {
          if (state.float || state.selection) pushUndo();
          if (state.float) commitFloat();
          state.selection = null;
          state.selecting = false;
          state.lining = false;
          state.lineStart = null;
          state.lineEnd = null;
          syncActionButtons();
          state.needsDraw = true;
          saveSettings();
        }

        function resize() {
          state.dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
          const w = window.innerWidth;
          const h = window.innerHeight;
          canvas.width = Math.round(w * state.dpr);
          canvas.height = Math.round(h * state.dpr);
          canvas.style.width = w + "px";
          canvas.style.height = h + "px";
          ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
          state.needsDraw = true;
        }

        function zoomAt(sx, sy, nextScale) {
          const clamped = Math.max(MIN_SCALE, Math.min(MAX_SCALE, nextScale));
          const wx = (sx - state.camX) / state.scale;
          const wy = (sy - state.camY) / state.scale;
          state.scale = clamped;
          state.camX = sx - wx * state.scale;
          state.camY = sy - wy * state.scale;
          state.needsDraw = true;
          saveSettings();
        }

        function setPixel(x, y, color) {
          const k = key(x, y);
          if (pixels.get(k) === color) return;
          pixels.set(k, color);
          state.needsDraw = true;
          saveSettings();
        }

        function erasePixel(x, y) {
          const k = key(x, y);
          if (!pixels.has(k)) return;
          pixels.delete(k);
          state.needsDraw = true;
          saveSettings();
        }

        function applyPixel(x, y, color) {
          if (color == null) erasePixel(x, y);
          else setPixel(x, y, color);
        }

        function applyBrush(cx, cy, color) {
          const size = Math.max(1, state.brushSize | 0);
          if (size === 1) {
            applyPixel(cx, cy, color);
            return;
          }
          const start = -Math.floor((size - 1) / 2);
          for (let dy = 0; dy < size; dy++) {
            for (let dx = 0; dx < size; dx++) {
              applyPixel(cx + start + dx, cy + start + dy, color);
            }
          }
        }

        function paintBrushLine(x0, y0, x1, y1, color) {
          forEachLineCell(x0, y0, x1, y1, (x, y) => applyBrush(x, y, color));
        }

        function paintLine(x0, y0, x1, y1, color) {
          let dx = Math.abs(x1 - x0);
          let dy = -Math.abs(y1 - y0);
          const sx = x0 < x1 ? 1 : -1;
          const sy = y0 < y1 ? 1 : -1;
          let err = dx + dy;
          let x = x0;
          let y = y0;
          for (;;) {
            applyPixel(x, y, color);
            if (x === x1 && y === y1) break;
            const e2 = 2 * err;
            if (e2 >= dy) {
              err += dy;
              x += sx;
            }
            if (e2 <= dx) {
              err += dx;
              y += sy;
            }
          }
        }
        function forEachLineCell(x0, y0, x1, y1, fn) {
          let dx = Math.abs(x1 - x0);
          let dy = -Math.abs(y1 - y0);
          const sx = x0 < x1 ? 1 : -1;
          const sy = y0 < y1 ? 1 : -1;
          let err = dx + dy;
          let x = x0;
          let y = y0;
          for (;;) {
            fn(x, y);
            if (x === x1 && y === y1) break;
            const e2 = 2 * err;
            if (e2 >= dy) {
              err += dy;
              x += sx;
            }
            if (e2 <= dx) {
              err += dx;
              y += sy;
            }
          }
        }

        function paintAt(sx, sy) {
          const w = screenToWorld(sx, sy);
          const color = state.tool === "eraser" ? null : state.color;
          if (state.lastWorld) {
            paintBrushLine(state.lastWorld.x, state.lastWorld.y, w.x, w.y, color);
          } else {
            applyBrush(w.x, w.y, color);
          }
          state.lastWorld = w;
          state.lastPainted = { x: w.x, y: w.y };
        }

        // Fill one world cell snapped to whole screen pixels, the same way the
        // grid lines are snapped, so tile edges and grid lines never shimmer
        // against each other while panning or zooming.
        function fillCell(x, y, s) {
          const l = Math.round(state.camX + x * s);
          const t = Math.round(state.camY + y * s);
          const w = Math.max(1, Math.round(state.camX + (x + 1) * s) - l);
          const h = Math.max(1, Math.round(state.camY + (y + 1) * s) - t);
          ctx.fillRect(l, t, w, h);
        }

        function drawClipPixels(clip, ox, oy, s) {
          for (const [k, color] of clip.pixels) {
            const p = parseKey(k);
            ctx.fillStyle = color;
            fillCell(p.x + ox, p.y + oy, s);
          }
        }

        function drawMarchingAnts(rect, s) {
          const x = state.camX + rect.x * s;
          const y = state.camY + rect.y * s;
          const w = rect.w * s;
          const h = rect.h * s;
          ctx.save();
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 4]);
          ctx.lineDashOffset = -state.dashOffset;
          ctx.strokeStyle = "rgba(0,0,0,0.85)";
          ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
          ctx.lineDashOffset = -state.dashOffset + 5;
          ctx.strokeStyle = withAlpha(state.accentColor, 0.95);
          ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
          ctx.restore();
          ctx.fillStyle = withAlpha(state.accentColor, 0.08);
          ctx.fillRect(x, y, w, h);
        }

        function drawPixelGrid(x0, y0, x1, y1, s, viewW, viewH) {
          if (!state.pixelGridEnabled || s < 10) return;
          const alpha = Math.min(0.35, (s - 8) / 70);
          ctx.beginPath();
          ctx.strokeStyle = withAlpha(state.pixelGridColor, alpha);
          ctx.lineWidth = state.pixelGridThick;
          for (let x = x0; x <= x1; x++) {
            const sx = Math.round(state.camX + x * s) + 0.5;
            ctx.moveTo(sx, 0);
            ctx.lineTo(sx, viewH);
          }
          for (let y = y0; y <= y1; y++) {
            const sy = Math.round(state.camY + y * s) + 0.5;
            ctx.moveTo(0, sy);
            ctx.lineTo(viewW, sy);
          }
          ctx.stroke();
        }

        function drawMajorGrid(x0, y0, x1, y1, s, viewW, viewH) {
          if (!state.gridEnabled) return;
          const gx = state.gridCellX;
          const gy = state.gridCellY;
          if (gx < 1 || gy < 1) return;

          const startX = Math.floor(x0 / gx) * gx;
          const startY = Math.floor(y0 / gy) * gy;

          ctx.beginPath();
          ctx.strokeStyle = withAlpha(state.gridColor, 0.45);
          ctx.lineWidth = state.gridThick;
          for (let x = startX; x <= x1; x += gx) {
            const sx = Math.round(state.camX + x * s) + 0.5;
            ctx.moveTo(sx, 0);
            ctx.lineTo(sx, viewH);
          }
          for (let y = startY; y <= y1; y += gy) {
            const sy = Math.round(state.camY + y * s) + 0.5;
            ctx.moveTo(0, sy);
            ctx.lineTo(viewW, sy);
          }
          ctx.stroke();
        }

        // Per-color label: hue in degrees ("–" for greys), saturation in
        // percent, and a legible ink.
        const pixelLabelCache = new Map();
        function pixelLabelFor(color) {
          let label = pixelLabelCache.get(color);
          if (!label) {
            const { r, g, b } = hexToRgb(color);
            const hsv = rgbToHsv(r, g, b);
            const luma = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            label = {
              hue: hsv.s === 0 ? "–" : String(Math.round(hsv.h) % 360),
              sat: String(Math.round(hsv.s * 100)),
              ink: luma > 0.55 ? "rgba(0,0,0,0.75)" : "rgba(255,255,255,0.85)",
            };
            pixelLabelCache.set(color, label);
          }
          return label;
        }

        function drawPixelLabels(x0, y0, x1, y1, s) {
          if (s < 16) return; // too small to read
          // Both on: hue above, saturation below.
          const both = state.hueLabelsEnabled && state.satLabelsEnabled;
          const size = Math.min(14, Math.floor(s * (both ? 0.3 : 0.38)));
          const lineOff = both ? size * 0.6 : 0;
          ctx.font = size + "px ui-monospace, Menlo, monospace";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          for (const [k, color] of pixels) {
            const p = parseKey(k);
            if (p.x < x0 || p.x > x1 || p.y < y0 || p.y > y1) continue;
            const label = pixelLabelFor(color);
            const cx = state.camX + (p.x + 0.5) * s;
            const cy = state.camY + (p.y + 0.5) * s;
            ctx.fillStyle = label.ink;
            if (state.hueLabelsEnabled) ctx.fillText(label.hue, cx, cy - lineOff);
            if (state.satLabelsEnabled) ctx.fillText(label.sat, cx, cy + lineOff);
          }
        }

        function draw() {
          const w = window.innerWidth;
          const h = window.innerHeight;
          const s = state.scale;

          ctx.fillStyle = state.bgColor;
          ctx.fillRect(0, 0, w, h);

          const x0 = Math.floor(-state.camX / s) - 1;
          const y0 = Math.floor(-state.camY / s) - 1;
          const x1 = Math.ceil((w - state.camX) / s) + 1;
          const y1 = Math.ceil((h - state.camY) / s) + 1;

          // Layers: pixel grid, then the pixels, then the major grid and origin
          // axes on top (all snapped to whole screen pixels).
          drawPixelGrid(x0, y0, x1, y1, s, w, h);

          for (const [k, color] of pixels) {
            const p = parseKey(k);
            if (p.x < x0 || p.x > x1 || p.y < y0 || p.y > y1) continue;
            ctx.fillStyle = color;
            fillCell(p.x, p.y, s);
          }

          drawMajorGrid(x0, y0, x1, y1, s, w, h);

          {
            const ox = Math.round(state.camX) + 0.5;
            const oy = Math.round(state.camY) + 0.5;
            ctx.strokeStyle = withAlpha(state.gridColor, 0.35);
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(ox, 0);
            ctx.lineTo(ox, h);
            ctx.moveTo(0, oy);
            ctx.lineTo(w, oy);
            ctx.stroke();
          }

          if (state.hueLabelsEnabled || state.satLabelsEnabled) {
            drawPixelLabels(x0, y0, x1, y1, s);
          }

          if (state.lining && state.lineStart && state.lineEnd) {
            const a = state.lineStart;
            const b = constrainLineEnd(a, state.lineEnd);
            const size = Math.max(1, state.brushSize | 0);
            const start = -Math.floor((size - 1) / 2);
            ctx.globalAlpha = 0.85;
            ctx.fillStyle = state.lineErase ? state.bgColor : state.color;
            forEachLineCell(a.x, a.y, b.x, b.y, (x, y) => {
              for (let dy = 0; dy < size; dy++) {
                for (let dx = 0; dx < size; dx++) {
                  const px = x + start + dx;
                  const py = y + start + dy;
                  fillCell(px, py, s);
                }
              }
            });
            ctx.globalAlpha = 1;
          }

          if (state.float) {
            drawClipPixels(state.float, state.float.x, state.float.y, s);
            drawMarchingAnts(
              {
                x: state.float.x,
                y: state.float.y,
                w: state.float.w,
                h: state.float.h,
              },
              s
            );
          } else if (state.selection) {
            drawMarchingAnts(state.selection, s);
          }

          drawMapOverlay(x0, y0, x1, y1, s);
          drawEyeLoupe(s);

          if (
            state.hoverVisible &&
            state.tool !== "link" &&
            !(state.eyeHold && state.eyeHold.active) &&
            !quickMenu.open &&
            (state.tool !== "select" || !state.selection)
          ) {
            const size =
              state.tool === "brush" ||
              state.tool === "eraser" ||
              state.tool === "line"
                ? Math.max(1, state.brushSize | 0)
                : 1;
            const start = -Math.floor((size - 1) / 2);
            const hx = state.camX + (state.hover.x + start) * s;
            const hy = state.camY + (state.hover.y + start) * s;
            ctx.strokeStyle = withAlpha(state.accentColor, 0.85);
            ctx.lineWidth = 2;
            ctx.strokeRect(hx + 1, hy + 1, size * s - 2, size * s - 2);
          }

        }

        function frame(now) {
          if (state.selection || state.float || state.selecting) {
            state.dashOffset = (now / 30) % 20;
            state.needsDraw = true;
          }
          if (state.needsDraw) {
            state.needsDraw = false;
            draw();
          }
          requestAnimationFrame(frame);
        }

        function clientPos(e) {
          const r = canvas.getBoundingClientRect();
          return { x: e.clientX - r.left, y: e.clientY - r.top };
        }

        function wantsPan(e) {
          return state.spaceDown || e.button === 1 || e.buttons === 4;
        }

        function beginMove(world) {
          const rect = state.float
            ? {
                x: state.float.x,
                y: state.float.y,
                w: state.float.w,
                h: state.float.h,
              }
            : state.selection;
          if (!rect || !pointInRect(world, rect)) return false;

          if (!state.float) {
            pushUndo();
            state.float = {
              x: rect.x,
              y: rect.y,
              w: rect.w,
              h: rect.h,
              pixels: extractRect(rect, true).pixels,
            };
            liftLinks(rect);
          }
          state.moving = true;
          state.moveGrab = {
            dx: world.x - state.float.x,
            dy: world.y - state.float.y,
          };
          canvas.classList.add("moving");
          state.needsDraw = true;
          return true;
        }

        /** Number fields: allow empty while typing; commit on blur. */
        function bindOptionalNumber(input, opts) {
          const apply = (commit) => {
            const raw = input.value.trim();
            if (raw === "") {
              if (commit) input.value = String(opts.get());
              return;
            }
            const next = opts.parse(raw, opts.get());
            opts.set(next);
            if (commit) input.value = String(next);
            opts.onChange();
          };
          input.addEventListener("input", () => apply(false));
          input.addEventListener("change", () => apply(true));
          input.addEventListener("blur", () => apply(true));
        }

        function clearHoldTimer() {
          if (state.holdTimer) clearTimeout(state.holdTimer);
          state.holdTimer = null;
          state.holdPos = null;
        }

        function restartHoldTimer(x, y) {
          clearHoldTimer();
          state.holdPos = { x, y };
          state.holdTimer = setTimeout(snapStrokeToLine, QS_HOLD_MS);
        }

        // Replace the stroke so far with a straight line from its start to the
        // current cell, then keep adjusting the line end until lift (like the
        // line tool). Only for strokes that actually went somewhere.
        function snapStrokeToLine() {
          state.holdTimer = null;
          if (!state.drawing || !state.strokeStart || !state.strokeBase) return;
          const end = state.hover;
          if (end.x === state.strokeStart.x && end.y === state.strokeStart.y) return;
          pixels.clear();
          for (const [k, c] of state.strokeBase) pixels.set(k, c);
          state.drawing = false;
          state.lastWorld = null;
          state.lining = true;
          state.lineErase = state.tool === "eraser";
          state.lineStart = state.strokeStart;
          state.lineEnd = end;
          state.needsDraw = true;
        }

        // Pencil (and mouse) draws; fingers navigate. One finger pans, two
        // pinch-zoom, a quick two-finger tap undoes, three-finger tap redoes.
        function startPinch() {
          const pts = [...state.pointers.values()];
          const dx = pts[1].x - pts[0].x;
          const dy = pts[1].y - pts[0].y;
          state.pinch = {
            dist: Math.hypot(dx, dy) || 1,
            scale: state.scale,
            midX: (pts[0].x + pts[1].x) / 2,
            midY: (pts[0].y + pts[1].y) / 2,
          };
        }

        function cancelTouchGesture() {
          state.pointers.clear();
          state.pinch = null;
          state.touchGesture = null;
        }

        function touchDown(e) {
          if (state.penId != null) {
            // A finger down while the Pencil/mouse is drawing holds snapping.
            state.snapTouches.add(e.pointerId);
            snapChanged();
            return;
          }
          capturePointer(canvas, e.pointerId);
          state.pointers.set(e.pointerId, {
            x: e.clientX,
            y: e.clientY,
            sx: e.clientX,
            sy: e.clientY,
          });
          if (!state.touchGesture) {
            state.touchGesture = { start: performance.now(), maxCount: 0, moved: false };
          }
          state.touchGesture.maxCount = Math.max(
            state.touchGesture.maxCount,
            state.pointers.size
          );
          state.pinch = null;
          if (state.pointers.size === 2) startPinch();
          if (state.tool === "eyedropper" && state.pointers.size === 1) startEyeHold(e, true);
          else state.eyeHold = null; // a second finger means pinch / undo, not picking
        }

        function touchMove(e) {
          const pt = state.pointers.get(e.pointerId);
          if (!pt) return;
          const dx = e.clientX - pt.x;
          const dy = e.clientY - pt.y;
          pt.x = e.clientX;
          pt.y = e.clientY;
          const g = state.touchGesture;
          const h = state.eyeHold;
          if (h && h.id === e.pointerId) {
            if (h.active) {
              // Holding with the eyedropper: the finger aims the loupe instead of panning.
              h.x = e.clientX;
              h.y = e.clientY;
              state.needsDraw = true;
              return;
            }
            if (Math.hypot(pt.x - pt.sx, pt.y - pt.sy) > TAP_MAX_MOVE) state.eyeHold = null;
          }
          if (g && Math.hypot(pt.x - pt.sx, pt.y - pt.sy) > TAP_MAX_MOVE) g.moved = true;

          if (state.pointers.size === 1) {
            state.camX += dx;
            state.camY += dy;
            state.needsDraw = true;
          } else if (state.pointers.size === 2 && state.pinch) {
            const pts = [...state.pointers.values()];
            const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) || 1;
            const midX = (pts[0].x + pts[1].x) / 2;
            const midY = (pts[0].y + pts[1].y) / 2;
            const r = canvas.getBoundingClientRect();
            zoomAt(midX - r.left, midY - r.top, state.pinch.scale * (dist / state.pinch.dist));
            state.camX += midX - state.pinch.midX;
            state.camY += midY - state.pinch.midY;
            state.pinch.midX = midX;
            state.pinch.midY = midY;
            state.needsDraw = true;
          }
        }

        function touchUp(e) {
          if (state.snapTouches.delete(e.pointerId)) {
            snapChanged();
            return;
          }
          if (!state.pointers.delete(e.pointerId)) return;
          if (state.eyeHold && state.eyeHold.id === e.pointerId) {
            // A held pick ends here; a quick tap falls through to the tap handling below.
            if (state.eyeHold.active) {
              finishEyeHold(e.type === "pointerup");
              state.touchGesture = null;
            } else {
              state.eyeHold = null;
            }
          }
          state.pinch = null;
          if (state.pointers.size === 2) startPinch();
          if (state.pointers.size > 0) return;
          const g = state.touchGesture;
          state.touchGesture = null;
          if (g && !g.moved && performance.now() - g.start < TAP_MAX_MS) {
            if (g.maxCount === 2) undo();
            else if (g.maxCount === 3) redo();
            else if (g.maxCount === 1 && state.tool === "link") {
              const r = canvas.getBoundingClientRect();
              linkTap(e.clientX - r.left, e.clientY - r.top);
            } else if (g.maxCount === 1 && state.tool === "eyedropper") {
              const r = canvas.getBoundingClientRect();
              const w = screenToWorld(e.clientX - r.left, e.clientY - r.top);
              applyEyedropperAt(w.x, w.y);
            }
          }
          saveSettings();
        }

        canvas.addEventListener("pointerdown", (e) => {
          // While the quick menu is open the canvas only aims, never draws.
          if (quickMenu.open) {
            if (e.pointerType !== "touch" && !quickMenu.sticky) updateQuickMenuHot(e.clientX, e.clientY, true);
            return;
          }
          if (e.pointerType === "touch") {
            touchDown(e);
            return;
          }
          // Right mouse button = squeeze.
          if (e.pointerType === "mouse" && e.button === 2) {
            openQuickMenu(e.pointerId, { x: e.clientX, y: e.clientY });
            return;
          }
          // Pen or mouse cancels any finger gesture (e.g. a resting palm).
          cancelTouchGesture();
          capturePointer(canvas, e.pointerId);
          state.penId = e.pointerId;

          const p = clientPos(e);
          const world = screenToWorld(p.x, p.y);
          state.hover = world;
          state.hoverVisible = true;

          if (wantsPan(e)) {
            state.panning = true;
            state.drawing = false;
            state.lining = false;
            state.selecting = false;
            canvas.classList.add("panning");
            e.preventDefault();
            return;
          }

          if (e.button !== 0) return;

          if (state.tool === "link") {
            if (!linkDragStart(p.x, p.y)) linkTap(p.x, p.y);
            return;
          }

          if (state.tool === "eyedropper") {
            startEyeHold(e, false);
            return;
          }

          if (state.tool === "brush" || state.tool === "eraser") {
            pushUndo();
            if (state.float) commitFloat();
            if (e.shiftKey && state.lastPainted) {
              const color = state.tool === "eraser" ? null : state.color;
              paintBrushLine(
                state.lastPainted.x,
                state.lastPainted.y,
                world.x,
                world.y,
                color
              );
              state.lastPainted = { x: world.x, y: world.y };
              state.drawing = false;
              state.lastWorld = null;
              state.needsDraw = true;
              saveSettings();
              return;
            }
            state.drawing = true;
            state.lastWorld = null;
            state.strokeStart = world;
            state.strokeBase = undoStack[undoStack.length - 1].pixels;
            restartHoldTimer(e.clientX, e.clientY);
            paintAt(p.x, p.y);
            return;
          }

          if (state.tool === "line") {
            pushUndo();
            if (state.float) commitFloat();
            state.lining = true;
            state.lineErase = false;
            state.lineStart = world;
            state.lineEnd = world;
            state.needsDraw = true;
            return;
          }

          if (state.tool === "select") {
            const live = state.float
              ? {
                  x: state.float.x,
                  y: state.float.y,
                  w: state.float.w,
                  h: state.float.h,
                }
              : state.selection;
            if (live && pointInRect(world, live)) {
              beginMove(world);
              return;
            }
            if (state.float) {
              pushUndo();
              commitFloat();
            }
            state.selecting = true;
            state.selectAnchor = world;
            state.selection = selectionRectFromDrag(
              world,
              world,
              e.shiftKey || snapHeld()
            );
            syncActionButtons();
            state.needsDraw = true;
          }
        });

        canvas.addEventListener("pointermove", (e) => {
          if (e.pointerType === "touch") {
            touchMove(e);
            return;
          }
          if (state.penId != null && e.pointerId !== state.penId) return;

          // Also fires while a Pencil hovers, so the brush outline follows it.
          state.lastCanvasClient = { x: e.clientX, y: e.clientY };
          const p = clientPos(e);
          const cell = screenToWorld(p.x, p.y);
          if (!state.hoverVisible || cell.x !== state.hover.x || cell.y !== state.hover.y) {
            state.hover = cell;
            state.hoverVisible = true;
            state.needsDraw = true;
          }

          if (state.panning) {
            state.camX += e.movementX;
            state.camY += e.movementY;
            state.needsDraw = true;
            return;
          }

          if (state.eyeHold && state.eyeHold.id === e.pointerId) {
            state.eyeHold.x = e.clientX;
            state.eyeHold.y = e.clientY;
            state.eyeHold.active = true;
            state.needsDraw = true;
            return;
          }

          if (state.linkDrag) {
            linkDragMove(p.x, p.y);
            return;
          }

          if (state.moving && state.float && state.moveGrab) {
            state.float.x = cell.x - state.moveGrab.dx;
            state.float.y = cell.y - state.moveGrab.dy;
            state.selection = {
              x: state.float.x,
              y: state.float.y,
              w: state.float.w,
              h: state.float.h,
            };
            state.needsDraw = true;
            return;
          }

          if (state.selecting && state.selectAnchor) {
            state.selection = selectionRectFromDrag(
              state.selectAnchor,
              cell,
              e.shiftKey || snapHeld()
            );
            syncActionButtons();
            state.needsDraw = true;
            return;
          }

          if (state.lining && state.lineStart) {
            state.lineEnd = cell;
            state.needsDraw = true;
            return;
          }

          if (state.drawing) {
            if (
              !state.holdPos ||
              Math.hypot(e.clientX - state.holdPos.x, e.clientY - state.holdPos.y) > QS_STILL_PX
            ) {
              restartHoldTimer(e.clientX, e.clientY);
            }
            paintAt(p.x, p.y);
          }

          if (state.tool === "select" && !state.panning && !state.moving) {
            const live = state.float
              ? {
                  x: state.float.x,
                  y: state.float.y,
                  w: state.float.w,
                  h: state.float.h,
                }
              : state.selection;
            canvas.style.cursor = pointInRect(cell, live) ? "move" : "crosshair";
          }
        });

        function endPointer(e) {
          if (e.pointerType === "touch") {
            touchUp(e);
            return;
          }
          if (e.pointerId !== state.penId) return;
          state.penId = null;
          if (state.eyeHold && state.eyeHold.id === e.pointerId) {
            finishEyeHold(e.type === "pointerup");
          }
          if (state.linkDrag) {
            const p = clientPos(e);
            linkDragEnd(p.x, p.y);
          }
          clearHoldTimer();
          {
            if (state.lining && state.lineStart && state.lineEnd) {
              const end = constrainLineEnd(state.lineStart, state.lineEnd);
              paintBrushLine(
                state.lineStart.x,
                state.lineStart.y,
                end.x,
                end.y,
                state.lineErase ? null : state.color
              );
              state.lastPainted = { x: end.x, y: end.y };
            }
            if (state.moving && state.float) commitFloat();
            state.drawing = false;
            state.lining = false;
            state.lineStart = null;
            state.lineEnd = null;
            state.panning = false;
            state.selecting = false;
            state.moving = false;
            state.moveGrab = null;
            state.lastWorld = null;
            state.selectAnchor = null;
            canvas.classList.remove("panning");
            canvas.classList.remove("moving");
            syncActionButtons();
            state.needsDraw = true;
            saveSettings();
          }
        }

        canvas.addEventListener("pointerup", endPointer);
        canvas.addEventListener("pointercancel", endPointer);
        canvas.addEventListener("pointerleave", (e) => {
          if (e.pointerType === "touch" || state.penId != null) return;
          state.hoverVisible = false;
          state.needsDraw = true;
        });

        // Snapping (lines to 45° steps, selections to the major grid) while
        // Shift is held, or while a finger rests on the screen during a Pencil
        // or mouse stroke (the iPad stand-in for Shift).
        function snapHeld() {
          return state.shiftDown || state.snapTouches.size > 0;
        }

        function snapChanged() {
          if (state.lining) state.needsDraw = true;
          if (state.selecting) refreshSelectingRect(snapHeld());
        }

        // Quick menu: a ring of tools plus a "colors" item whose swatches open
        // as an outer ring when it's hovered. Opened by holding the squeeze
        // button (stand-in for Pencil Pro squeeze) or the right mouse button.
        // Hold mode: whatever is hovered when the button is released is picked.
        // If the button is released quickly, with nothing hovered, on the
        // colors item, or iOS cancels the held touch, the menu stays open
        // (sticky) and the next tap picks; tapping the centre/outside cancels.
        // Tools the menu can show ("flex" = the previous tool); the order and
        // how many are shown come from Settings › Quick menu.
        const QM_ALL_TOOLS = ["brush", "line", "flex", "eyedropper", "link", "eraser", "select"];
        const QM_DEFAULT_ORDER = ["brush", "line", "flex", "eyedropper", "link", "eraser", "select"];
        const QM_TOOL_LABELS = { flex: "last tool" };
        // Sizes at 100%; Settings › Quick menu › size scales them.
        const QM_BASE = { R: 72, BAND: 52, SUB_GAP: 6, SUB_BAND: 40, SUB_ARC: 40, ICON: 22, HOT_PUSH: 8, CENTER_R: 30, OUTER_SLOP: 40 };
        let QM_R = 72; // mid radius of the main ring
        let QM_BAND = 52; // main ring thickness
        let QM_SUB_GAP = 6; // gap between main ring and swatch ring
        let QM_SUB_BAND = 40; // swatch ring thickness
        let QM_SUB_ARC = 40; // arc length per swatch at the swatch ring's mid radius
        const QM_ARC_GAP = 2; // px gap between neighbouring arcs
        let QM_ICON = 22;
        let QM_HOT_PUSH = 8; // an arc slides outward up to this much as you near it
        const QM_PROX_SCALE = 0.1; // ...and grows up to this fraction
        const QM_SUB_MIN_SCALE = 0.8; // swatch ring scale when barely expanded
        let QM_CENTER_R = 30; // centre = cancel
        let QM_OUTER_SLOP = 40; // px past the outermost ring that still counts
        const QM_QUICK_MS = 300; // shorter hold = sticky
        const QM_TAP_SLOP = 6; // a tap this far past a ring still hits it
        const QM_SMOOTH_MS = 45; // aim smoothing time constant

        function applyQmScale() {
          const k = state.qmScale;
          QM_R = QM_BASE.R * k;
          QM_BAND = QM_BASE.BAND * k;
          QM_SUB_GAP = QM_BASE.SUB_GAP * k;
          QM_SUB_BAND = QM_BASE.SUB_BAND * k;
          QM_SUB_ARC = QM_BASE.SUB_ARC * k;
          QM_ICON = QM_BASE.ICON * k;
          QM_HOT_PUSH = QM_BASE.HOT_PUSH * k;
          QM_CENTER_R = QM_BASE.CENTER_R * k;
          QM_OUTER_SLOP = QM_BASE.OUTER_SLOP * k;
        }

        function quickMenuTools() {
          return state.qmToolOrder.slice(0, state.qmToolCount);
        }
        const SVG_NS = "http://www.w3.org/2000/svg";

        const quickMenuEl = document.getElementById("quick-menu");
        const quickMenu = {
          open: false,
          pointerId: null, // pointer holding the menu open (hold mode)
          sticky: false,
          tapId: null, // pointer picking an item in sticky mode
          openedAt: 0,
          cx: 0,
          cy: 0,
          outer: 0, // outer edge of the main ring
          subOuter: 0, // outer edge of the swatch ring
          items: [], // main ring
          sub: [], // swatches
          subEl: null,
          subOpen: false,
          colorsItem: null,
          hot: null,
          label: null,
        };

        function toolIconPaths(name) {
          const btn = document.getElementById("tool-" + name);
          const svg = btn && btn.querySelector("svg");
          return svg ? svg.innerHTML : "";
        }

        // Annular sector between radii r0 < r1 and angles a0 < a1, centred on 0,0.
        function arcPath(r0, r1, a0, a1) {
          const large = a1 - a0 > Math.PI ? 1 : 0;
          const pt = (rad, a) => (rad * Math.cos(a)).toFixed(2) + " " + (rad * Math.sin(a)).toFixed(2);
          return (
            "M" + pt(r1, a0) +
            " A" + r1 + " " + r1 + " 0 " + large + " 1 " + pt(r1, a1) +
            " L" + pt(r0, a1) +
            " A" + r0 + " " + r0 + " 0 " + large + " 0 " + pt(r0, a0) +
            "Z"
          );
        }

        function placeQuickMenuEl(el, size) {
          el.style.width = size + "px";
          el.style.height = size + "px";
          el.style.left = quickMenu.cx - size / 2 + "px";
          el.style.top = quickMenu.cy - size / 2 + "px";
          quickMenuEl.appendChild(el);
        }

        // Builds one arc item into `parent` and returns its hit-test record.
        function addArcItem(parent, it, r0, r1, angle, halfStep) {
          const mid = (r0 + r1) / 2;
          const pad = QM_ARC_GAP / 2 / mid;
          const g = document.createElementNS(SVG_NS, "g");
          g.setAttribute(
            "class",
            "qm-item qm-" + it.kind +
              (it.flex ? " qm-flex" : "") +
              (it.current ? " current" : "") +
              (it.apply || it.submenu ? "" : " empty")
          );
          const arc = document.createElementNS(SVG_NS, "path");
          arc.setAttribute("class", "qm-arc");
          arc.setAttribute("d", arcPath(r0, r1, angle - halfStep + pad, angle + halfStep - pad));
          if (it.color) arc.style.fill = it.color;
          g.appendChild(arc);
          if (it.tool) {
            const icon = document.createElementNS(SVG_NS, "g");
            icon.setAttribute("class", "qm-icon");
            const x = mid * Math.cos(angle) - QM_ICON / 2;
            const y = mid * Math.sin(angle) - QM_ICON / 2;
            icon.setAttribute("transform", "translate(" + x + " " + y + ") scale(" + QM_ICON / 24 + ")");
            icon.innerHTML = toolIconPaths(it.tool);
            g.appendChild(icon);
          }
          parent.appendChild(g);
          return {
            el: g,
            angle,
            halfStep,
            label: it.label,
            apply: it.apply || null,
            submenu: !!it.submenu,
          };
        }

        function openQuickMenu(pointerId, anchor) {
          closeColorPicker();
          applyQmScale();
          quickMenu.aim = null;
          quickMenu.target = null;
          const main = [];
          for (const slot of quickMenuTools()) {
            const tool = slot === "flex" ? state.prevTool : slot;
            main.push({
              kind: "tool",
              flex: slot === "flex",
              tool,
              label: tool ? (slot === "flex" ? "last: " : "") + tool : "no previous tool",
              current: tool === state.tool,
              apply: tool ? () => setTool(tool) : null,
            });
          }
          main.push({ kind: "colors", color: state.color, label: "colors", submenu: true });

          const inner = QM_R - QM_BAND / 2;
          const outer = QM_R + QM_BAND / 2;
          const subInner = outer + QM_SUB_GAP;
          const subOuter = subInner + QM_SUB_BAND;
          const reach = subOuter + QM_HOT_PUSH + 4;
          const at = anchor ||
            state.lastCanvasClient || { x: window.innerWidth / 2, y: window.innerHeight / 2 };
          const fit = (v, max) => {
            const m = Math.min(reach, max / 2);
            return Math.max(m, Math.min(max - m, v));
          };
          quickMenu.cx = fit(at.x, window.innerWidth);
          quickMenu.cy = fit(at.y, window.innerHeight);
          quickMenu.inner = inner;
          quickMenu.outer = outer;
          quickMenu.subInner = subInner;
          quickMenu.subOuter = subOuter;
          quickMenu.items = [];
          quickMenu.sub = [];
          quickMenu.hot = null;
          quickMenuEl.innerHTML = "";

          const size = 2 * reach;
          const svg = document.createElementNS(SVG_NS, "svg");
          svg.setAttribute("class", "qm-svg");
          svg.setAttribute("viewBox", -size / 2 + " " + -size / 2 + " " + size + " " + size);
          placeQuickMenuEl(svg, size);

          const center = document.createElement("div");
          center.className = "qm-center";
          center.style.fontSize = Math.round(10 * state.qmScale) + "px";
          placeQuickMenuEl(center, QM_CENTER_R * 2);
          quickMenu.label = center;

          const step = (2 * Math.PI) / main.length;
          main.forEach((it, k) => {
            const item = addArcItem(svg, it, inner, outer, -Math.PI / 2 + k * step, step / 2);
            quickMenu.items.push(item);
            if (item.submenu) quickMenu.colorsItem = item;
          });

          // Swatch ring: a fan centred on the colors item, or the full circle
          // when there are too many swatches to fan.
          const subEl = document.createElementNS(SVG_NS, "g");
          subEl.setAttribute("class", "qm-sub");
          svg.insertBefore(subEl, svg.firstChild);
          // Show up to qmColorCount swatches, keeping the current one in view.
          let shown = state.palette.map((color, k) => ({ color, k }));
          if (shown.length > state.qmColorCount) {
            const start = Math.max(0, Math.min(shown.length - state.qmColorCount, state.paletteIndex - Math.floor(state.qmColorCount / 2)));
            shown = shown.slice(start, start + state.qmColorCount);
          }
          const n = shown.length;
          const subMid = (subInner + subOuter) / 2;
          const subStep = Math.min(QM_SUB_ARC / subMid, (2 * Math.PI) / n);
          const start = quickMenu.colorsItem.angle - ((n - 1) * subStep) / 2;
          shown.forEach(({ color, k }, j) => {
            quickMenu.sub.push(
              addArcItem(
                subEl,
                {
                  kind: "swatch",
                  color,
                  label: color,
                  current: k === state.paletteIndex,
                  apply: () => {
                    selectPaletteIndex(k);
                  },
                },
                subInner,
                subOuter,
                start + j * subStep,
                subStep / 2
              )
            );
          });
          quickMenu.subEl = subEl;
          setQuickMenuSub(false);
          applyQuickMenuProximity(null);

          quickMenu.open = true;
          quickMenu.pointerId = pointerId;
          quickMenu.sticky = false;
          quickMenu.tapId = null;
          quickMenu.openedAt = performance.now();
          quickMenu.entered = false;
          quickMenuEl.hidden = false;
          setQuickMenuHot(null);
          state.needsDraw = true;
        }

        function setQuickMenuSub(open) {
          quickMenu.subOpen = open;
          quickMenu.subEl.classList.toggle("open", open);
          quickMenu.colorsItem.el.classList.toggle("expanded", open);
        }

        function angleDiff(a, b) {
          let d = Math.abs(a - b) % (2 * Math.PI);
          return d > Math.PI ? 2 * Math.PI - d : d;
        }

        function nearestByAngle(list, angle) {
          let best = null;
          let bestDiff = Infinity;
          for (const it of list) {
            const diff = angleDiff(angle, it.angle);
            if (diff < bestDiff) {
              bestDiff = diff;
              best = it;
            }
          }
          return { item: best, diff: bestDiff };
        }

        // Distance picks the ring, angle picks the item, so a rough move
        // toward an item is enough. Returns undefined for the centre.
        // The item in a direction: a swatch if the swatch ring is open and the
        // angle falls inside its fan, otherwise the main item. `inFan` tells
        // the caller which ring answered.
        function quickMenuItemInDirection(angle) {
          if (quickMenu.subOpen) {
            const hit = nearestByAngle(quickMenu.sub, angle);
            if (hit.item && hit.diff <= hit.item.halfStep) return { item: hit.item, inFan: true };
          }
          const best = nearestByAngle(quickMenu.items, angle).item;
          return { item: best && (best.apply || best.submenu) ? best : null, inFan: false };
        }

        // Distance picks the ring, angle picks the item, so a rough move toward
        // an item is enough. Returns undefined for the centre; `beyond` is set
        // once the pointer has left the menu in that direction.
        function quickMenuItemAt(x, y) {
          const dx = x - quickMenu.cx;
          const dy = y - quickMenu.cy;
          const d = Math.hypot(dx, dy);
          if (d < QM_CENTER_R) return { item: undefined, beyond: false };
          if (!quickMenu.subOpen || d <= quickMenu.outer + QM_SUB_GAP / 2) {
            const main = nearestByAngle(quickMenu.items, Math.atan2(dy, dx)).item;
            return {
              item: main && (main.apply || main.submenu) ? main : null,
              beyond: d > quickMenu.outer + QM_OUTER_SLOP,
            };
          }
          const hit = quickMenuItemInDirection(Math.atan2(dy, dx));
          const edge = (hit.inFan ? quickMenu.subOuter : quickMenu.outer) + QM_OUTER_SLOP;
          return { item: hit.item, beyond: d > edge };
        }

        function setQuickMenuHot(hot) {
          const prev = quickMenu.hot;
          if (prev && prev !== hot) prev.el.classList.remove("hot");
          if (hot) {
            hot.el.classList.add("hot");
            hot.el.parentNode.appendChild(hot.el); // paint above neighbours
          }
          quickMenu.hot = hot;
          if (quickMenu.label) quickMenu.label.textContent = hot ? hot.label : "×";
        }

        // The aim point eases toward the pointer (QM_SMOOTH_MS) so jitter from a
        // hovering Pencil or a shaky finger doesn't flick between items. Taps
        // aim instantly.
        function updateQuickMenuHot(x, y, immediate) {
